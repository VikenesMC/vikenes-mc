<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Quiz – Skjerm</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap">
  <link rel="stylesheet" href="stil.css">
  <style>
    /* To visningar:
         skjerm.html        – UTE (vindauget): klokke, neste og deretter-gruppe med namn, poengtavle
         skjerm.html?inne   – INNE (der alle står): alle gruppene med namn, starttid og status */
    body { overflow: hidden; }
    .fraktur-h { font-family: "UnifrakturCook", "Old English Text MT", serif; }
    .stripe { padding: .8vw 0; }
    .stripe .vinge { max-width: 34vw; }
    .tal { font-variant-numeric: tabular-nums; }

    /* ---------- UTE ---------- */
    .ute { display: grid; grid-template-columns: 1.15fr 1fr; gap: 2.5vw; padding: 1.5vw 3vw 3vw; height: calc(100vh - 13.8vw); }
    .venstre { display: flex; flex-direction: column; justify-content: center; gap: 1.4vw; min-height: 0; }
    .klokke { font-size: 9vw; font-weight: bold; line-height: 1; text-align: center; }
    .gruppekort { background: var(--kort); border-radius: 1vw; padding: 1.4vw 1.8vw; border: .25vw solid var(--oransje); }
    .gruppekort.deretter { border-color: #555; }
    .gruppekort .leiar { font-size: 1.7vw; margin-top: .5vw; color: var(--oransje); }
    .gruppekort.deretter .leiar { font-size: 1.4vw; }
    .gruppekort .etikett { font-size: 1.5vw; color: var(--dempa); text-transform: uppercase; letter-spacing: .1vw; }
    .gruppekort .gnamn { font-size: 3.4vw; font-weight: bold; }
    .gruppekort .nedtelling { font-size: 4.6vw; font-weight: bold; color: var(--oransje); }
    .gruppekort .namn { font-size: 2.1vw; margin-top: .4vw; }
    .gruppekort.deretter .gnamn { font-size: 2.6vw; }
    .gruppekort.deretter .namn { font-size: 1.7vw; color: var(--dempa); }
    .melding { font-size: 3vw; text-align: center; }

    .tavle { background: var(--kort); border-radius: 1.2vw; padding: 2vw; overflow: hidden; border: .25vw solid var(--oransje); }
    .tavle h2 { margin: 0 0 1vw; font-size: 2.6vw; }
    .tavle table { font-size: 2vw; }
    .tavle td, .tavle th { padding: .7vw .5vw; }
    .plass { width: 4vw; font-weight: bold; }
    .poeng { text-align: right; font-weight: bold; }
    .likt { font-size: 1.2vw; }

    /* ---------- INNE ---------- */
    .inne { padding: 1.2vw 2.5vw 2vw; height: calc(100vh - 13.8vw); display: flex; flex-direction: column; gap: 1.2vw; }
    .inne-topp { display: flex; justify-content: space-between; align-items: baseline; gap: 2vw; }
    .inne-topp .klokke { font-size: 4.5vw; text-align: left; }
    .inne-topp .neste-linje { font-size: 2.4vw; }
    .inne-topp .neste-linje b { color: var(--oransje); }
    /* 5 kolonnar: 13 grupper (maks) får plass på tre rader */
    .rutenett { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1vw; align-content: start; overflow: hidden; }
    /* Lik ramme rundt heile kortet (same tjukkleik på alle sider) */
    .gk { background: var(--kort); border-radius: .8vw; padding: .7vw 1vw; border: .25vw solid transparent; border-top-color: #444; }
    .gk.neste { border-color: var(--oransje); }
    .gk .rad1 { display: flex; justify-content: space-between; align-items: baseline; gap: 1vw; }
    .gk .gnamn { font-size: 1.7vw; font-weight: bold; }
    .gk .tid { font-size: 1.6vw; color: var(--oransje); font-weight: bold; }
    .gk .namn { font-size: 1.25vw; margin: .4vw 0; line-height: 1.3; }
    .gk .status { font-size: 1vw; }
    .gk.innsjekk { border-color: #e53935; }
    .gk .leiar { font-size: 1.1vw; color: var(--oransje); margin: -.1vw 0 .4vw; }

    /* ---------- RESULTAT (når alle er i mål) ---------- */
    .resultat { display: flex; flex-direction: column; gap: 1vw; min-height: 0; }
    .resultat h2 { font-size: 2.6vw; margin: 0; text-align: center; }
    .pall { display: flex; justify-content: center; align-items: flex-end; gap: 1.5vw; }
    .pk { background: var(--kort); border-radius: 1vw; padding: .8vw 1.5vw; text-align: center; border: .3vw solid; flex: 0 1 26vw; }
    .pk .plass-nr { font-size: 3.6vw; font-weight: bold; line-height: 1; }
    .pk .medalje { font-size: 2.2vw; line-height: 1; }
    .pk .gnamn { font-size: 2vw; font-weight: bold; margin-top: .3vw; }
    .pk .poeng { font-size: 2.5vw; font-weight: bold; margin: .2vw 0; text-align: center; }
    .pk .namn { font-size: 1.1vw; color: var(--dempa); }
    .pk.p1 { border-color: #FFD54F; padding-top: 1.6vw; padding-bottom: 1.6vw; }
    .pk.p1 .plass-nr, .pk.p1 .poeng { color: #FFD54F; }
    .pk.p2 { border-color: #CFD8DC; } .pk.p2 .plass-nr, .pk.p2 .poeng { color: #CFD8DC; }
    .pk.p3 { border-color: #D7A26B; } .pk.p3 .plass-nr, .pk.p3 .poeng { color: #D7A26B; }
    .pk .likt-merke { display: inline-block; margin-top: .4vw; background: #e53935; color: #fff; border-radius: .5vw; padding: .2vw .6vw; font-size: 1.1vw; font-weight: bold; }
    .resten { display: grid; grid-template-columns: repeat(3, 1fr); gap: .2vw 3vw; font-size: 1.3vw; max-width: 80vw; margin: 0 auto; width: 100%; }
    .resten div { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: .2vw 0; }
    .gk.innsjekk .gnamn { color: #ff6b5e; }

    @media (max-width: 800px) {
      body { overflow: auto; }
      .ute, .inne { height: auto; grid-template-columns: 1fr; }
      .klokke { font-size: 18vw; }
      .tavle table { font-size: 16px; }
      .rutenett { grid-template-columns: 1fr; }
      .gk .gnamn, .gk .tid { font-size: 20px; } .gk .namn { font-size: 16px; } .gk .status, .gk .leiar { font-size: 14px; }
      .gruppekort .gnamn { font-size: 24px; } .gruppekort .namn { font-size: 17px; } .gruppekort .nedtelling { font-size: 32px; }
      .gruppekort .etikett { font-size: 13px; } .inne-topp .neste-linje { font-size: 18px; }
    }
  </style>
</head>
<body ondblclick="document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()">
  <div class="stripe"><img class="vinge" src="vinge-logo.png" alt="Vikenes MC"></div>
  <div id="visning"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="felles.js"></script>
  <script>
    // Dobbeltklikk = fullskjerm. Hentar data kvart 5. sekund.
    const INNE = new URLSearchParams(location.search).has("inne");
    let data = null;
    let tidsavvik = 0; // serverklokke minus PC-klokke

    const na = () => new Date(Date.now() + tidsavvik);
    const to = n => String(n).padStart(2, "0");
    const klokke = t => `${to(t.getHours())}:${to(t.getMinutes())}:${to(t.getSeconds())}`;
    const namnliste = g => (g.members && g.members.length) ? g.members.map(esc).join(", ") : "<span class='dempa'>Ingen medlemmer</span>";

    // Leiaren blir vald ved start – vis berre når han er vald
    const leiarLinje = g => g.leader ? `<div class="leiar">Leiar: <b>${esc(g.leader)}</b></div>` : "";

    function nedtelling(sek) {
      return sek >= 3600
        ? `${Math.floor(sek / 3600)}:${to(Math.floor(sek / 60) % 60)}:${to(sek % 60)}`
        : `${to(Math.floor(sek / 60))}:${to(sek % 60)}`;
    }

    // Gruppene som ikkje har starta enno (og ikkje er i mål), i startrekkjefølgje
    function ventande(t) {
      return data.groups
        .filter(g => !g.finished && g.start_at && new Date(g.start_at) > t)
        .sort((a, b) => new Date(a.start_at) - new Date(b.start_at));
    }

    function statusMerke(g, t) {
      if (g.finished) return `<span class="merke gronn">I mål</span>`;
      // (Ei gruppe som er i mål blir aldri vist som «Ventar»)
      if (!g.start_at || new Date(g.start_at) > t) return `<span class="merke">Ventar</span>`;
      return `<span class="merke gul">Ute · post ${g.stops_handled}/${data.stops_total}</span>`;
    }

    // ---------------- UTE ----------------
    function byggUte() {
      document.getElementById("visning").innerHTML = `
        <div class="ute">
          <div class="venstre">
            <div class="klokke tal" id="klokke">--:--:--</div>
            <div id="grupper"></div>
          </div>
          <div class="tavle">
            <h2>Poengtavle</h2>
            <table id="tavle"></table>
          </div>
        </div>`;
    }

    function teiknUte() {
      const t = na();
      document.getElementById("klokke").textContent = klokke(t);
      if (!data) return;
      sjekkUteModus();
      if (uteModus === "resultat") return;
      const v = ventande(t);
      const el = document.getElementById("grupper");

      if (data.groups.length === 0) {
        el.innerHTML = `<div class="melding">Gruppene er ikkje fordelte enno</div>`;
      } else if (v.length) {
        const [neste, deretter] = v;
        const sek = Math.max(0, Math.round((new Date(neste.start_at) - t) / 1000));
        el.innerHTML = `
          <div class="gruppekort">
            <div class="etikett">Neste ut · kl. ${klokkeslett(neste.start_at)}</div>
            <div class="rad" style="justify-content:space-between">
              <span class="gnamn">${esc(neste.name)}</span>
              <span class="nedtelling tal">${nedtelling(sek)}</span>
            </div>
            <div class="namn">${namnliste(neste)}</div>
            ${leiarLinje(neste)}
          </div>
          ${deretter ? `
          <div class="gruppekort deretter">
            <div class="etikett">Deretter · kl. ${klokkeslett(deretter.start_at)}</div>
            <div class="gnamn">${esc(deretter.name)}</div>
            <div class="namn">${namnliste(deretter)}</div>
            ${leiarLinje(deretter)}
          </div>` : ""}`;
      } else if (data.groups.every(g => g.finished)) {
        el.innerHTML = `<div class="melding ok">Alle gruppene er i mål! 🏁</div>`;
      } else {
        el.innerHTML = `<div class="melding">Alle gruppene er ute</div>`;
      }
    }

    function tavle() {
      sjekkUteModus();
      if (uteModus === "resultat") {
        document.getElementById("uteResultat").innerHTML = resultatHtml();
        return;
      }
      const t = na();
      const grupper = [...data.groups].sort((a, b) => b.points - a.points || a.position - b.position);
      let plass = 0, forrige = null;
      const telling = {};
      grupper.forEach(g => { telling[g.points] = (telling[g.points] || 0) + 1; });
      const rader = grupper.map((g, i) => {
        if (g.points !== forrige) { plass = i + 1; forrige = g.points; }
        const likt = telling[g.points] > 1 && g.points !== 0 ? ` <span class="merke raud likt">likt</span>` : "";
        return `<tr>
          <td class="plass">${plass}.</td>
          <td>${esc(g.name)}${likt}</td>
          <td>${statusMerke(g, t)}</td>
          <td class="poeng tal">${g.points}</td>
        </tr>`;
      }).join("");
      document.getElementById("tavle").innerHTML = rader || `<tr><td class="dempa">Ingen grupper enno</td></tr>`;
    }

    // ---------------- INNE ----------------
    function byggInne() {
      document.getElementById("visning").innerHTML = `
        <div class="inne">
          <div class="inne-topp">
            <div class="klokke tal" id="klokke">--:--:--</div>
            <div class="neste-linje" id="nesteLinje"></div>
          </div>
          <div class="rutenett" id="rutenett"></div>
        </div>`;
    }

    function teiknInne() {
      const t = na();
      document.getElementById("klokke").textContent = klokke(t);
      if (!data) return;
      const v = ventande(t);
      const neste = v[0];
      const linje = document.getElementById("nesteLinje");
      if (data.groups.length === 0) linje.textContent = "Gruppene er ikkje fordelte enno";
      else if (neste) linje.innerHTML = `Neste ut: <b>${esc(neste.name)}</b> om <b class="tal">${nedtelling(Math.max(0, Math.round((new Date(neste.start_at) - t) / 1000)))}</b>`;
      else if (data.groups.every(g => g.finished)) linje.innerHTML = `<span class="ok">Alle gruppene er i mål! 🏁</span>`;
      else linje.textContent = "Alle gruppene er ute";
    }

    // Plassering: likt poeng = same plass (1, 1, 3 …)
    function plasseringar() {
      const grupper = [...data.groups].sort((a, b) => b.points - a.points || a.position - b.position);
      const telling = {};
      grupper.forEach(g => { telling[g.points] = (telling[g.points] || 0) + 1; });
      let plass = 0, forrige = null;
      return grupper.map((g, i) => {
        if (g.points !== forrige) { plass = i + 1; forrige = g.points; }
        return { g, plass, likt: telling[g.points] > 1 };
      });
    }

    const alleIMaal = () => data.groups.length > 0 && data.groups.every(g => g.finished);

    // Når siste gruppe er i mål: vis 1., 2. og 3. plass tydeleg
    function resultatInne() {
      document.getElementById("rutenett").className = "";
      document.getElementById("rutenett").innerHTML = resultatHtml();
    }

    // UTE: same resultat, med klokka over. Byter tilbake om løpet blir nullstilt.
    let uteModus = "ute";
    function sjekkUteModus() {
      const vil = alleIMaal() ? "resultat" : "ute";
      if (vil === uteModus) return;
      uteModus = vil;
      if (vil === "resultat") {
        document.getElementById("visning").innerHTML = `
          <div class="inne">
            <div class="inne-topp">
              <div class="klokke tal" id="klokke">--:--:--</div>
              <div class="neste-linje"><span class="ok">Alle gruppene er i mål! 🏁</span></div>
            </div>
            <div id="uteResultat"></div>
          </div>`;
        document.getElementById("uteResultat").innerHTML = resultatHtml();
      } else {
        byggUte();
      }
    }

    function resultatHtml() {
      const p = plasseringar();
      const pall = p.filter(x => x.plass <= 3);
      // Klassisk pall: 2 – 1 – 3 (likt på same plass står ved sida av kvarandre)
      const rekkje = [...pall.filter(x => x.plass === 2), ...pall.filter(x => x.plass === 1), ...pall.filter(x => x.plass === 3)];
      const medalje = { 1: "🥇", 2: "🥈", 3: "🥉" };
      const resten = p.filter(x => x.plass > 3);
      return `
        <div class="resultat">
          <h2>Resultat</h2>
          <div class="pall">
            ${rekkje.map(x => `
              <div class="pk p${x.plass}">
                <div class="medalje">${medalje[x.plass]}</div>
                <div class="plass-nr">${x.plass}. plass</div>
                <div class="gnamn">${esc(x.g.name)}</div>
                <div class="poeng tal">${x.g.points} poeng</div>
                <div class="namn">${namnliste(x.g)}</div>
                ${x.likt ? `<div class="likt-merke">Likt – utslagsspørsmål</div>` : ""}
              </div>`).join("")}
          </div>
          ${resten.length ? `<div class="resten">${resten.map(x => `
            <div><span>${x.plass}. ${esc(x.g.name)}${x.likt ? ` <span class="merke raud">likt</span>` : ""}</span><b class="tal">${x.g.points}</b></div>`).join("")}</div>` : ""}
        </div>`;
    }

    function kortInne() {
      if (alleIMaal()) return resultatInne();
      const t = na();
      document.getElementById("rutenett").className = "rutenett";
      const neste = ventande(t)[0];
      const grupper = [...data.groups].sort((a, b) => a.position - b.position);
      // Påmelde som ikkje har betalt: eige kort først (nemn ikkje betaling på skjermen)
      const innsjekk = (data.not_checked_in || []).length ? `
        <div class="gk innsjekk">
          <div class="rad1"><span class="gnamn">Meld dykk i innsjekken</span></div>
          <div class="namn">${data.not_checked_in.map(esc).join(", ")}</div>
        </div>` : "";
      document.getElementById("rutenett").innerHTML = innsjekk + grupper.map(g => `
        <div class="gk ${neste && neste.name === g.name ? "neste" : ""}">
          <div class="rad1">
            <span class="gnamn">${esc(g.name)}</span>
            <span class="tid tal">${klokkeslett(g.start_at)}</span>
          </div>
          <div class="namn">${namnliste(g)}</div>
          ${g.leader ? `<div class="leiar">Leiar: <b>${esc(g.leader)}</b></div>` : ""}
          <div class="status">${statusMerke(g, t)} ${g.start_at && new Date(g.start_at) <= t ? `<span class="dempa">${g.points} poeng</span>` : ""}</div>
        </div>`).join("");
    }

    // ---------------- Felles ----------------
    async function hentData() {
      try {
        data = await rpc("screen_data");
        tidsavvik = new Date(data.now) - Date.now();
        if (INNE) { kortInne(); teiknInne(); } else { tavle(); teiknUte(); }
      } catch (e) {
        console.error(e);
      }
    }

    if (INNE) byggInne(); else byggUte();
    hentData();
    setInterval(hentData, 5000);
    setInterval(INNE ? teiknInne : teiknUte, 250);
    // Kort/tavle oppdaterer status når ei gruppe startar, sjølv mellom hentingane
    setInterval(() => { if (data) { if (INNE) kortInne(); else tavle(); } }, 1000);
  </script>
</body>
</html>
