<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vikenes MC – Medlem</title>
  <meta name="robots" content="noindex">
  <!-- App på heimeskjermen (krevst for varsel på iPhone) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="app-ikon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vikenes MC">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap">
  <link rel="stylesheet" href="stil.css">
  <style>
    .topp h1 { font-size: 30px; }
    img.oe { height: .9em; width: auto; max-width: 100%; vertical-align: middle; display: block; }
    .meg { font-size: 15px; }
    .faner2 { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .faner2 button { flex: 1 1 auto; margin-top: 0; background: #333; color: #fff; padding: 10px 12px; font-size: 15px; }
    textarea { font-family: inherit; }

    /* Bakgrunn som i lokalet: svart med oransje stripe og vinge-logoen svakt bak */
    body {
      background:
        linear-gradient(rgba(10,10,10,.90), rgba(10,10,10,.94)),
        url("gruppebilete.jpg") center top / cover fixed no-repeat,
        #0a0a0a;
    }
    .wrap { position: relative; }
    .medlem-topp { text-align: center; margin: 0 0 18px; }
    .medlem-topp .stripe { padding: 6px 0; }
    .medlem-topp .stripe img { display: block; margin: 0 auto; width: 86%; max-width: 460px; height: auto; }
    .medlem-topp img.oe { height: 44px; margin: 6px auto 0; display: block; }
    .medlem-topp .under { color: var(--dempa); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
    .kort, .chatlogg, .varselboks { background: rgba(26,26,26,.92); }

    /* ---------- Regnskap ---------- */
    .saldoar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .saldo { background: #222; border-radius: 8px; padding: 12px; font-size: 14px; }
    .saldo h3 { margin: 0 0 6px; color: var(--oransje); font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
    .saldo .linje { display: flex; justify-content: space-between; }
    .saldo .sum { font-size: 18px; font-weight: bold; border-top: 1px solid #444; margin-top: 6px; padding-top: 6px; }
    .innut { display: flex; gap: 8px; margin-top: 6px; }
    .innut label { flex: 1; margin: 0; background: #333; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; }
    .innut input { display: none; }
    .innut input:checked + span { color: #000; }
    .innut label:has(input:checked) { background: var(--oransje); color: #000; }
    .post { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--linje); }
    .post:last-child { border-bottom: 0; }
    .post .tekst { font-weight: bold; }
    .post .belop { font-weight: bold; text-align: right; white-space: nowrap; }
    .post .belop.inn { color: var(--gronn); }
    .post .belop.ut { color: var(--raud); }
    .post .meta { color: var(--dempa); font-size: 14px; }
    .post .rad button { margin-top: 6px; }
    @media (max-width: 480px) { .saldoar { grid-template-columns: 1fr; } }

    /* ---------- Kalender ---------- */
    .mnd-topp { display: flex; justify-content: space-between; align-items: center; }
    .mnd-topp h2 { margin: 0; font-size: 22px; text-transform: capitalize; }
    .mnd-topp button { margin: 0; padding: 6px 14px; }
    .kal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 12px; }
    .kal .vd { text-align: center; font-size: 12px; color: var(--dempa); padding: 2px 0; }
    .kal .dag { background: #222; border-radius: 6px; min-height: 52px; padding: 3px; font-size: 13px; cursor: pointer;
      border: 2px solid transparent; display: flex; flex-direction: column; gap: 2px; }
    .kal .dag.annan { opacity: .35; }
    .kal .dag.idag { border-color: #666; }
    .kal .dag.vald { border-color: var(--oransje); }
    .kal .dag .nr { font-weight: bold; }
    .kal .merke-treff { background: var(--oransje); color: #000; border-radius: 4px; font-size: 10px; font-weight: bold;
      padding: 1px 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .kal .merke-borte { color: var(--dempa); font-size: 11px; }
    .treff { background: #222; border-left: 4px solid var(--oransje); border-radius: 8px; padding: 12px; margin-top: 10px; }
    .treff h3 { margin: 0 0 4px; }
    .treff .smaa { color: var(--dempa); font-size: 14px; }
    .jane { display: flex; gap: 8px; margin-top: 8px; }
    .jane button { margin: 0; flex: 1; background: #333; color: #fff; }
    .jane button.vald-ja { background: var(--gronn); color: #000; }
    .jane button.vald-nei { background: var(--raud); color: #000; }
    .mld .treffkort { background: #1a1a1a; border: 1px solid #444; border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 14px; color: #fff; }
    .mld.min .treffkort { color: #fff; }
    .mld .treffkort .jane button { padding: 6px; font-size: 14px; }
    .faner2 button.aktiv { background: var(--oransje); color: #000; }
    .medlem { padding: 12px 0; border-bottom: 1px solid var(--linje); }
    .medlem:last-child { border-bottom: 0; }
    .medlem .namn { font-weight: bold; }
    .medlem .rolle { color: var(--oransje); font-size: 15px; }
    .medlem .info { color: var(--dempa); font-size: 15px; }
    .medlem select { width: auto; padding: 8px; margin-top: 8px; font-size: 15px; }
    .medlem .rad button { margin-top: 8px; }
    .kjem { color: var(--dempa); font-size: 16px; }

    /* ---------- Chat ---------- */
    .varselboks { background: var(--kort); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 15px; }
    .varselboks button { margin-top: 8px; }
    .chatlogg { background: var(--kort); border-radius: 10px; padding: 12px; height: 58vh; min-height: 300px; overflow-y: auto; }
    .dag { text-align: center; color: var(--dempa); font-size: 13px; margin: 10px 0 6px; }
    .mld { max-width: 85%; margin: 6px 0; }
    .mld .boble { background: #2b2b2b; border-radius: 14px 14px 14px 4px; padding: 8px 12px; white-space: pre-wrap; word-wrap: break-word; }
    .mld .kven { font-size: 13px; color: var(--oransje); font-weight: bold; margin: 0 0 2px 4px; }
    .mld .meta { font-size: 12px; color: var(--dempa); margin: 2px 4px 0; }
    .mld .meta button { background: none; color: var(--dempa); padding: 0; margin: 0; font-size: 12px; font-weight: normal; text-decoration: underline; }
    .mld.min { margin-left: auto; }
    .mld.min .boble { background: var(--oransje); color: #000; border-radius: 14px 14px 4px 14px; }
    .mld.min .meta { text-align: right; }
    .mld.min .kven { text-align: right; margin: 0 4px 2px 0; }
    .skrivfelt { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
    .skrivfelt textarea { flex: 1; margin: 0; resize: none; min-height: 48px; max-height: 140px; }
    .skrivfelt button { margin: 0; height: 48px; }
    .komande { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid #333; cursor: pointer; }
    .komande:first-of-type { border-top: 0; }
    .komande .kdato { width: 52px; flex: none; text-align: center; font-weight: bold; color: var(--oransje); font-size: 18px; line-height: 1.1; }
    .komande .kdato span { display: block; font-size: 11px; font-weight: normal; color: var(--dempa); }
    .album-rutenett { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .album { cursor: pointer; background: #1b1b1b; border: 1px solid #333; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .album img, .album .tomt { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 34px; background: #222; }
    .album b { padding: 8px 10px 0; } .album .smaa { padding: 0 10px 8px; }
    .bilete-rutenett { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .bilete { background: #1b1b1b; border: 2px solid #333; border-radius: 8px; overflow: hidden; }
    .bilete.delt { border-color: var(--oransje); }
    .bilete img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; cursor: zoom-in; background: #222; }
    .bilete-meny { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; font-size: 13px; }
    .bilete-meny label { display: flex; gap: 4px; align-items: center; margin: 0; cursor: pointer; }
    .bilete-meny input { width: 18px; height: 18px; margin: 0; accent-color: var(--oransje); }
    .bilete-meny button { margin: 0; padding: 2px 6px; }
    .knapp-fil { background: var(--oransje); color: #000; font-weight: bold; padding: 8px 14px; border-radius: 8px; cursor: pointer; margin: 0; }
    details.reglar { background: #1b1b1b; border: 1px solid #333; border-radius: 8px; padding: 8px 12px; margin: 6px 0 10px; }
    details.reglar summary { cursor: pointer; color: var(--oransje); font-weight: bold; }
    details.reglar p { font-size: 14px; line-height: 1.5; margin: 8px 0 0; }
    .datorad { display: flex; gap: 6px; align-items: stretch; margin: 6px 0 12px; }
    .kalknapp { position: relative; display: flex; align-items: center; justify-content: center; width: 52px; flex: none;
                margin: 0; padding: 0; font-size: 24px; background: #222; border: 1px solid #444; border-radius: 8px; cursor: pointer; overflow: hidden; }
    .kalknapp input[type=date] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; padding: 0; border: 0; cursor: pointer; }
    table.tilgang { border-collapse: collapse; width: 100%; font-size: 14px; }
    table.tilgang th { font-size: 12px; font-weight: normal; color: var(--dempa); padding: 4px; vertical-align: bottom; }
    table.tilgang td { padding: 8px 4px; border-top: 1px solid #333; text-align: center; }
    table.tilgang td:first-child { text-align: left; min-width: 110px; }
    table.tilgang input[type=checkbox] { width: 22px; height: 22px; margin: 0; accent-color: var(--oransje); }
  </style>
</head>
<body>
  <div class="wrap">
    <p style="margin:0 0 6px"><a href="index.html" class="dempa" style="font-size:15px">← Til framsida</a></p>
    <div class="medlem-topp">
      <div class="stripe"><img src="vinge-logo.png" alt=""></div>
      <h1 style="margin:0"><img class="oe" src="vikenes-tekst.png" alt="Vikenes MC"></h1>
      <div class="under">Medlemssida</div>
    </div>

    <div id="appbanner"></div>
    <div id="innhald"><p class="dempa">Lastar …</p></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>window.AUTH_LAGER = "vmc-medlem";</script>
  <script src="felles.js"></script>
  <script>
    let meg = null;          // medlem_me()
    let liste = [];          // member_list()
    let roller = [];
    let aktivFane = "chat";
    let innloggingsFane = "inn";

    const vis = html => document.getElementById("innhald").innerHTML = html;

    function normTlf(t) {
      let d = (t || "").replace(/[\s\-+]/g, "");
      if (/^0047\d{8}$/.test(d)) d = d.slice(4);
      else if (/^47\d{8}$/.test(d) && t.trim().startsWith("+")) d = d.slice(2);
      return d;
    }

    function visTlf(t) {
      return t && t.length === 8 ? t.slice(0, 3) + " " + t.slice(3, 5) + " " + t.slice(5) : (t || "");
    }

    // ---------------- Kva skal visast ----------------
    async function start() {
      const { data } = await db.auth.getSession();
      if (!data.session) return visInnlogging();
      try {
        meg = await rpc("member_me");
      } catch (e) {
        return vis(`<div class="kort"><p class="feil">Noko gjekk gale: ${esc(e.message)}</p>
          <button onclick="start()">Prøv igjen</button></div>`);
      }
      if (!meg) return visFullfor();
      if (meg.status === "pending") return visVentar();
      if (meg.status === "removed") return visFjerna();
      if (!roller.length) roller = await rpc("member_roles");
      visApp();
    }

    // ---------------- Innlogging / ny konto ----------------
    // Nye medlemmer kjem berre inn via QR-kode som President viser (medlem.html?ny=<kode>)
    const invitasjon = new URLSearchParams(location.search).get("ny");

    async function visInnlogging(melding) {
      visAppBanner();
      if (invitasjon) {
        let ok = false;
        try { ok = await rpc("invite_valid", { p_token: invitasjon }); } catch (e) { /* vist under */ }
        if (!ok) {
          return vis(`<div class="kort"><h2 style="margin-top:0">QR-koden er ikkje gyldig</h2>
            <p>Koden er gått ut eller feil. Be President om å vise ein ny QR-kode.</p>
            <a class="dempa" href="medlem.html">Har du alt konto? Logg inn her</a></div>`);
        }
      }
      const ny = !!invitasjon;
      vis(`
        <div class="kort" style="text-align:center; padding:14px 16px">
          <b>🔒 Berre for medlemmer i Vikenes MC</b>
          <div class="dempa" style="font-size:14px; margin-top:4px">${ny
            ? "Du er invitert av President. Lag kontoen din under."
            : "Nye medlemmer får tilgang via President."}</div>
        </div>
        <div class="kort">
          ${!ny ? `
            <label for="epost" style="margin-top:0">E-post</label>
            <input id="epost" type="email" autocomplete="username">
            <label for="passord">Passord</label>
            <input id="passord" type="password" autocomplete="current-password">
            <button class="stor" onclick="loggInn()">Logg inn</button>
          ` : `
            <h2 style="margin-top:0">Ny medlem</h2>
            <p class="dempa" style="margin-top:0">Du kjem inn når President eller Vice President har godkjent deg.</p>
            <label for="namn">Fullt namn</label>
            <input id="namn" autocomplete="name">
            <label for="tlf">Mobilnummer</label>
            <input id="tlf" type="tel" inputmode="numeric" autocomplete="tel" placeholder="8 siffer, t.d. 912 34 567">
            <label for="epost">E-post</label>
            <input id="epost" type="email" autocomplete="username">
            <label for="passord">Vel eit passord (minst 8 teikn)</label>
            <input id="passord" type="password" autocomplete="new-password">
            <button class="stor" onclick="nyKonto()">Lag konto</button>
          `}
          <p id="melding" class="feil">${esc(melding || "")}</p>
        </div>`);
    }

    function feil(t) { document.getElementById("melding").textContent = t; }

    async function loggInn() {
      const email = document.getElementById("epost").value.trim();
      const password = document.getElementById("passord").value;
      if (!email || !password) return feil("Skriv inn e-post og passord.");
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) return feil("Feil e-post eller passord.");
      start();
    }

    async function nyKonto() {
      const namn = document.getElementById("namn").value.trim();
      const tlf = normTlf(document.getElementById("tlf").value);
      const email = document.getElementById("epost").value.trim();
      const password = document.getElementById("passord").value;
      if (namn.length < 2) return feil("Skriv inn namnet ditt.");
      if (!/^\d{8}$/.test(tlf)) return feil("Mobilnummeret må vere 8 siffer.");
      if (!/^\S+@\S+\.\S+$/.test(email)) return feil("Sjekk e-postadressa.");
      if (password.length < 8) return feil("Passordet må vere minst 8 teikn.");

      const { data, error } = await db.auth.signUp({ email, password });
      if (error) {
        if (/registered|exists/i.test(error.message)) return feil("Denne e-posten har alt ein konto. Logg inn på medlemssida i staden.");
        return feil("Kunne ikkje lage konto: " + error.message);
      }
      if (!data.session) {
        return feil("Kontoen er laga, men må stadfestast før du kan logge inn. Sei frå til President.");
      }
      await registrer(namn, tlf);
    }

    async function registrer(namn, tlf) {
      let svar;
      try { svar = await rpc("member_register", { p_name: namn, p_phone: tlf, p_token: invitasjon }); }
      catch (e) { return feil("Noko gjekk gale: " + e.message); }
      if (svar.status === "bad_invite") return feil("QR-koden er gått ut. Be President om ein ny.");
      if (svar.status === "bad_name") return feil("Skriv inn namnet ditt.");
      if (svar.status === "bad_phone") return feil("Mobilnummeret må vere 8 siffer.");
      if (svar.status === "phone_exists") return feil("Dette mobilnummeret er alt registrert på ein annan konto.");
      start();
    }

    // Innlogga, men ikkje i registeret (t.d. registreringa vart avbroten)
    function visFullfor() {
      if (!invitasjon) {
        return vis(`<div class="kort"><h2 style="margin-top:0">Berre for medlemmer i Vikenes MC</h2>
          <p>Denne kontoen er ikkje i medlemsregisteret. Nye medlemmer blir lagde til via QR-kode frå President.</p>
          <button class="sekundar" onclick="loggUt()">Logg ut</button></div>`);
      }
      vis(`
        <div class="kort">
          <h2 style="margin-top:0">Fullfør registreringa</h2>
          <label for="namn">Fullt namn</label>
          <input id="namn" autocomplete="name">
          <label for="tlf">Mobilnummer</label>
          <input id="tlf" type="tel" inputmode="numeric" autocomplete="tel" placeholder="8 siffer, t.d. 912 34 567">
          <button class="stor" onclick="fullfor()">Send</button>
          <p id="melding" class="feil"></p>
          <button class="sekundar" onclick="loggUt()">Logg ut</button>
        </div>`);
    }

    function fullfor() {
      const namn = document.getElementById("namn").value.trim();
      const tlf = normTlf(document.getElementById("tlf").value);
      if (namn.length < 2) return feil("Skriv inn namnet ditt.");
      if (!/^\d{8}$/.test(tlf)) return feil("Mobilnummeret må vere 8 siffer.");
      registrer(namn, tlf);
    }

    function visVentar() {
      vis(`
        <div class="kort">
          <h2 style="margin-top:0">Takk, ${esc(meg.name)}!</h2>
          <p>Du ventar på godkjenning frå <b>President</b> eller <b>Vice President</b>.</p>
          <p class="dempa">Når du er godkjend, kjem du rett inn her.</p>
          <button onclick="start()">Sjekk igjen</button>
          <button class="sekundar" onclick="loggUt()">Logg ut</button>
        </div>`);
    }

    function visFjerna() {
      vis(`
        <div class="kort">
          <p>Du har ikkje tilgang til medlemssida.</p>
          <p class="dempa">Ta kontakt med President om du meiner dette er feil.</p>
          <button class="sekundar" onclick="loggUt()">Logg ut</button>
        </div>`);
    }

    async function loggUt() {
      stoppChat();
      await db.auth.signOut();
      meg = null;
      innloggingsFane = "inn";
      visInnlogging();
    }

    // ---------------- Medlemssida ----------------
    async function visApp() {
      vis(`
        <div class="rad" style="justify-content:space-between; margin-bottom:12px">
          <div class="meg"><b>${esc(meg.name)}</b> · <span style="color:var(--oransje)">${esc(meg.role)}</span></div>
          <button class="sekundar liten" onclick="loggUt()">Logg ut</button>
        </div>
        <div class="faner2">
          <button data-fane="chat" onclick="visFane('chat')">Chat</button>
          <button data-fane="kalender" onclick="visFane('kalender')">Kalender</button>
          <button data-fane="arkiv" onclick="visFane('arkiv')">Arkiv</button>
          <button data-fane="bilete" onclick="visFane('bilete')">Bilete</button>
          <button data-fane="quiz" onclick="visFane('quiz')">MC Quiz</button>
          <button data-fane="regnskap" onclick="visFane('regnskap')">Regnskap</button>
          <button data-fane="arsmote" onclick="visFane('arsmote')">Saker</button>
          <button data-fane="klubbhus" onclick="visFane('klubbhus')">Klubbhuset</button>
          <button data-fane="medlemmer" onclick="visFane('medlemmer')">Medlemmer</button>
          ${meg.role === "President" ? `<button data-fane="president" onclick="visFane('president')">President</button>` : ""}
          ${meg.news_writer ? `<button data-fane="nyheiter" onclick="visFane('nyheiter')">Nyheiter</button>
                               <button data-fane="gjestebok" onclick="visFane('gjestebok')">Gjestebok<span id="g-tal"></span></button>` : ""}
        </div>
        <div id="fane"></div>`);
      visFane(aktivFane);
      if (meg.news_writer) oppdaterGjestetal();
      fornyAbonnement();
      visAppBanner();
    }

    async function visFane(f) {
      aktivFane = f;
      document.querySelectorAll(".faner2 button").forEach(b =>
        b.classList.toggle("aktiv", b.dataset.fane === f));
      if (f !== "chat") stoppChat();
      if (f === "chat") return visChat();
      if (f === "arkiv") return visArkiv();
      if (f === "regnskap") return visRegnskap();
      if (f === "kalender") return visKalender();
      if (f === "quiz") return visQuiz();
      if (f === "nyheiter") return visNyheiter();
      if (f === "gjestebok") return visGjestebok();
      if (f === "president") return visPresident();
      if (f === "arsmote") return visArsmote();
      if (f === "bilete") return visBilete();
      if (f === "klubbhus") return visKlubbhus();
      try { liste = await rpc("member_list"); }
      catch (e) { return start(); }
      visMedlemmer();
    }

    // ---------------- Chat ----------------
    let chat = { siste: 0, forste: 0, total: 0, timer: null, mine: new Set(), dagar: new Set() };

    function stoppChat() { if (chat.timer) { clearInterval(chat.timer); chat.timer = null; } }

    async function visChat() {
      stoppChat();
      chat = { siste: 0, forste: 0, total: 0, timer: null, dagar: new Set() };
      document.getElementById("fane").innerHTML = `
        <div id="leiarvarsel"></div>
        <div class="varselboks" id="varselboks"></div>
        <div class="chatlogg" id="chatlogg"><p class="dempa">Lastar chatten …</p></div>
        <div class="skrivfelt">
          <textarea id="chattekst" rows="1" maxlength="2000" placeholder="Skriv ei melding …"></textarea>
          <button onclick="sendChat()">Send</button>
        </div>`;
      const ta = document.getElementById("chattekst");
      ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; });
      ta.addEventListener("keydown", e => {
        // Enter sender på PC; Shift+Enter gir ny linje. På mobil brukar ein Send-knappen.
        if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)) { e.preventDefault(); sendChat(); }
      });
      visVarselboks();
      visLeiarvarsel();
      document.getElementById("chatlogg").innerHTML = "";
      await hentChat(true);
      chat.timer = setInterval(() => { if (!document.hidden) hentChat(false); }, 4000);

    async function visLeiarvarsel() {
      if (!meg.leader && !meg.styre) return;
      try {
        const n = meg.leader ? (await rpc("member_list")).filter(m => m.status === "pending").length : 0;
        const s = meg.styre ? (await rpc("member_changes_open")).filter(x => x.can_vote && x.my_vote === null).length : 0;
        const tekst = [n ? `${n} ventar på godkjenning` : "", s ? `${s} forslag til styret ventar på svaret ditt` : ""]
          .filter(Boolean).join(" · ");
        const el = document.getElementById("leiarvarsel");
        if (el && tekst) el.innerHTML = `<div class="kort" style="border-top-color:var(--gul); padding:12px 16px">
          <span class="vars">${tekst}</span>
          <button class="liten" style="margin-left:10px" onclick="visFane('medlemmer')">Sjå medlemmer</button></div>`;
      } catch (e) { /* ikkje kritisk */ }

    function klokke(iso) { return new Date(iso).toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" }); }
    function dagTekst(iso) {
      const d = new Date(iso), i = new Date(); const ig = new Date(); ig.setDate(i.getDate() - 1);
      if (d.toDateString() === i.toDateString()) return "I dag";
      if (d.toDateString() === ig.toDateString()) return "I går";
      return d.toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" });
    }

    function meldingHtml(m) {
      const min = m.author_id === meg.id;
      const dag = new Date(m.created_at).toDateString();
      let skil = "";
      if (!chat.dagar.has(dag)) { chat.dagar.add(dag); skil = `<div class="dag">${esc(dagTekst(m.created_at))}</div>`; }
      return `${skil}<div class="mld ${min ? "min" : ""}" data-id="${m.id}">
          <div class="kven">${esc(m.author)}</div>
          <div class="boble">${esc(m.body)}${m.event ? treffkortHtml(m.event) : ""}</div>
          <div class="meta">${esc(klokke(m.created_at))} ·
            <button onclick="visSettAv(${m.id})">Sett av <span class="sett">${m.seen}</span> av ${chat.total}</button></div>
        </div>`;
    }

    async function hentChat(forsteGong) {
      let r;
      try { r = await rpc("chat_list", { p_after: chat.siste }); }
      catch (e) { if (forsteGong) document.getElementById("chatlogg").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      const logg = document.getElementById("chatlogg");
      if (!logg) return;
      chat.total = r.total;
      const nedst = logg.scrollHeight - logg.scrollTop - logg.clientHeight < 80;
      if (forsteGong && !r.messages.length) logg.innerHTML = '<p class="dempa" id="tomchat">Ingen meldingar enno. Skriv den første!</p>';
      if (r.messages.length) {
        document.getElementById("tomchat")?.remove();
        if (!chat.forste) chat.forste = r.messages[0].id;
        logg.insertAdjacentHTML("beforeend", r.messages.map(meldingHtml).join(""));
        chat.siste = r.messages[r.messages.length - 1].id;
        if (forsteGong || nedst || r.messages.some(m => m.author_id === meg.id)) logg.scrollTop = logg.scrollHeight;
      } else if (chat.forste) {
        // Ingen nye meldingar – oppdater berre «Sett av»-tala
        try {
          const tal = await rpc("chat_seen_counts", { p_from: chat.forste });
          for (const [id, n] of Object.entries(tal)) {
            const s = logg.querySelector(`.mld[data-id="${id}"] .sett`);
            if (s) s.textContent = n;
          }
        } catch (e) { /* prøver igjen neste runde */ }
      }
      if (chat.siste && !document.hidden) rpc("chat_mark_read", { p_id: chat.siste }).catch(() => {});
    }

    async function sendChat() {
      const ta = document.getElementById("chattekst");
      const tekst = ta.value.trim();
      if (!tekst) return;
      ta.disabled = true;
      try {
        const id = await rpc("chat_send", { p_body: tekst });
        ta.value = ""; ta.style.height = "auto";
        // Send varsel til dei andre (treng ikkje vente på svaret)
        db.functions.invoke("chat-push", { body: { action: "send", message_id: id } }).catch(() => {});
        await hentChat(false);
      } catch (e) {
        alert("Klarte ikkje å sende: " + e.message);
      }
      ta.disabled = false; ta.focus();
    }

    async function visSettAv(id) {
      let r;
      try { r = await rpc("chat_seen_by", { p_id: id }); } catch (e) { return alert(e.message); }
      alert(`Sett av (${r.seen.length}):\n${r.seen.join(", ") || "–"}\n\nIkkje sett enno (${r.not_seen.length}):\n${r.not_seen.join(", ") || "–"}`);
    }

    // Opna frå eit varsel medan sida alt er open → gå til chatten
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("message", e => { if (e.data === "opne-chat" && meg && meg.status === "approved") visFane("chat"); });
    }

    // ---------------- Varsel (push) ----------------
    const erIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const erApp = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

    async function harAbonnement() {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
      const reg = await navigator.serviceWorker.getRegistration();
      return !!(reg && await reg.pushManager.getSubscription());
    }

    async function visVarselboks() {
      const boks = document.getElementById("varselboks");
      if (!boks) return;
      if (erIOS && !erApp) {
        boks.innerHTML = `🔔 <b>Varsel på iPhone:</b> trykk på <b>Del</b>-knappen (firkanten med pil opp) nedst i Safari,
          vel <b>«Legg til på Heim-skjerm»</b>, og opne Vikenes MC frå ikonet. Då kan du slå på varsel.`;
        return;
      }
      if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
        boks.innerHTML = "Denne nettlesaren kan ikkje vise varsel. Prøv Chrome eller Safari.";
        return;
      }
      if (Notification.permission === "denied") {
        boks.innerHTML = "🔕 Varsel er blokkerte for denne sida. Slå dei på i innstillingane til nettlesaren.";
        return;
      }
      if (Notification.permission === "granted" && await harAbonnement()) {
        boks.innerHTML = `🔔 Varsel er på for denne eininga.
          <button class="sekundar liten" style="margin-left:8px" onclick="testVarsel()">Send testvarsel</button>`;
        return;
      }
      boks.innerHTML = `Få varsel på mobilen når nokon skriv i chatten.
        <br><button onclick="slaaPaaVarsel()">🔔 Slå på varsel</button>`;
    }

    function b64tilBytes(b64) {
      const pad = "=".repeat((4 - b64.length % 4) % 4);
      const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    async function slaaPaaVarsel() {
      const boks = document.getElementById("varselboks");
      try {
        const lov = await Notification.requestPermission();
        if (lov !== "granted") return visVarselboks();
        boks.innerHTML = "Slår på varsel …";
        const reg = await navigator.serviceWorker.register("sw.js");
        await navigator.serviceWorker.ready;
        let nokkel = await rpc("push_public_key");
        if (!nokkel) {
          const { data, error } = await db.functions.invoke("chat-push", { body: { action: "key" } });
          if (error) throw error;
          nokkel = data.publicKey;
        }
        let ab = await reg.pushManager.getSubscription();
        if (!ab) ab = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64tilBytes(nokkel) });
        const j = ab.toJSON();
        await rpc("push_subscribe", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent });
      } catch (e) {
        boks.innerHTML = `<span class="feil">Klarte ikkje å slå på varsel: ${esc(e.message || String(e))}</span>`;
        return;
      }
      visVarselboks();
    }

    function sakListe(liste, tittel, hast) {
      return `<div class="kort">
        <h2 style="margin-top:0">${tittel} (${liste.length})</h2>
        ${liste.map(s => `<div class="treff" style="${s.handled ? "opacity:.55" : ""}">
          <p style="white-space:pre-line; margin:0">${esc(s.body)}</p>
          <div class="smaa" style="margin-top:6px">${s.anonymous ? "🕶️ Anonym" : "Frå " + esc(s.author_name || "–")} · ${datoKort(s.created_at)}${s.handled ? " · ✔ Behandla" : ""}</div>
          ${meg.styre ? `<div class="rad" style="margin-top:8px">
            ${hast ? `<button class="sekundar liten" onclick="sakBehandla(${s.id}, ${!s.handled})">${s.handled ? "Opne att" : "✔ Merk som behandla"}</button>` : ""}
            <button class="fare liten" onclick="fjernSak(${s.id})">Fjern</button></div>` : ""}
        </div>`).join("") || '<p class="dempa" style="margin:0">Ingen saker.</p>'}
      </div>`;
    }

    async function sendSak(mal) {
      const tekst = document.getElementById("s-tekst").value.trim();
      const anonym = document.getElementById("s-anonym").checked;
      if (tekst.length < 3) return alert("Skriv saka først.");
      const kvar = mal === "styret" ? "til styret (hastar – styret får varsel)" : "til årsmøtet";
      if (!confirm(`Sende saka ${kvar}${anonym ? " anonymt? Ingen kan sjå kven som sende ho." : " med namnet ditt?"}`)) return;
      let id;
      try { id = await rpc("agm_case_submit", { p_body: tekst, p_anonymous: anonym, p_target: mal }); }
      catch (e) { return alert(e.message); }
      if (mal === "styret") db.functions.invoke("chat-push", { body: { action: "sak", case_id: id } }).catch(() => {});
      visArsmote();
    }

    async function sakBehandla(id, ja) {
      try { await rpc("agm_case_handled", { p_id: id, p_handled: ja }); } catch (e) { alert(e.message); }
      visArsmote();
    }

    async function fjernSak(id) {
      if (!confirm("Fjerne saka frå lista?")) return;
      try { await rpc("agm_case_hide", { p_id: id }); } catch (e) { alert(e.message); }
      visArsmote();
    }

    async function lagAvstemming() {
      const k = KRAV.find(k => k.v === document.getElementById("a-krav").value);
      try {
        await rpc("agm_vote_create", { p_question: document.getElementById("a-sp").value,
          p_info: document.getElementById("a-info").value, p_krav_pct: k.pct, p_strict: k.strict });
      } catch (e) { return alert(e.message === "bad_text" ? "Skriv kva forslaget er." : e.message); }
      nyAvstemming = false;
      visArsmote();
    }

    async function roeyst(id, ja) {
      if (!confirm(`Røyste ${ja ? "JA" : "NEI"}? Du kan ikkje endre røysta etterpå.`)) return;
      try { await rpc("agm_vote_cast", { p_id: id, p_yes: ja }); }
      catch (e) { alert({ already_voted: "Du har alt røysta.", closed: "Avstemminga er stengd.",
                          no_vote_right: "Prospect og Hangaround har ikkje røysterett." }[e.message] || e.message); }
      visArsmote();
    }

    async function merkGjennomfort(id, ja) {
      try { await rpc("agm_vote_done", { p_id: id, p_done: ja }); } catch (e) { alert(e.message); }
      visArsmote();
    }

    async function stengAvstemming(id) {
      if (!confirm("Stengje avstemminga og vise resultatet til alle? Ingen kan røyste etterpå.")) return;
      try { await rpc("agm_vote_close", { p_id: id }); } catch (e) { alert(e.message); }
      visArsmote();
    }

    // ---------------- Bilete: album + «Vis på framsida» ----------------
    let aktivAlbum = null;
    let bileteListe = [];

    async function signerteUrlar(stiar) {
      if (!stiar.length) return {};
      const { data } = await db.storage.from("bilete").createSignedUrls(stiar, 3600);
      const ut = {};
      (data || []).forEach(d => { if (d.signedUrl) ut[d.path] = d.signedUrl; });
      return ut;
    }

    async function visBilete() {
      const fane = document.getElementById("fane");
      let a;
      try { a = await rpc("album_list"); } catch (e) { fane.innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      // Kay 2026-11-26: berre éi bilet-mappe – alle bilete i same
      if (!a.albums.length) {
        try { await rpc("album_create", { p_name: "Bilete" }); a = await rpc("album_list"); }
        catch (e) { fane.innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      }
      aktivAlbum = a.albums[0].id;
      try { bileteListe = await rpc("photo_list", { p_album: aktivAlbum }); } catch (e) { fane.innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      const url = await signerteUrlar(bileteListe.map(p => p.path));
      fane.innerHTML = `<div class="kort">
        <div class="rad" style="justify-content:space-between">
          <h2 style="margin:0">📷 Bilete (${bileteListe.length})</h2>

        </div>

        <p id="b-status" class="dempa"></p>
        <div class="bilete-rutenett">
          ${bileteListe.map((p, i) => `<div class="bilete${p.shared ? " delt" : ""}">
              <img src="${url[p.path] || ""}" alt="${esc(p.caption || "")}" loading="lazy" onclick="visStortBilete(${i})">
              <div class="bilete-meny">
                ${a.can_share ? `<label><input type="checkbox" ${p.shared ? "checked" : ""} onchange="delBilete(${p.id}, this)"> Supportsida</label>` : (p.shared ? "<span>🌐 Supportsida</span>" : "<span></span>")}
                ${p.can_delete ? `<button class="fare liten" onclick="slettBilete(${p.id})">🗑️</button>` : ""}
              </div>
            </div>`).join("") || '<p class="dempa">Ingen bilete i dette albumet enno.</p>'}
        </div>
      </div>`;
      window._bileteUrl = url;
    }

    async function nyttAlbum() {
      const namn = document.getElementById("a-namn").value;
      try { aktivAlbum = await rpc("album_create", { p_name: namn }); }
      catch (e) { return alert(e.message === "bad_text" ? "Skriv eit namn på albumet." : e.message); }
      visBilete();
    }

    async function lastOppBilete(filer) {
      const status = document.getElementById("b-status");
      let n = 0;
      for (const f0 of filer) {
        n++;
        status.textContent = `Lastar opp ${n} av ${filer.length} …`;
        const f = await krympBilete(f0);
        const sti = `${aktivAlbum}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${(f.name.split(".").pop() || "jpg").toLowerCase()}`;
        const { error } = await db.storage.from("bilete").upload(sti, f, { contentType: f.type || "image/jpeg" });
        if (error) { alert(`Klarte ikkje å laste opp «${f0.name}»: ${error.message}`); continue; }
        try { await rpc("photo_add", { p_album: aktivAlbum, p_path: sti, p_caption: null }); }
        catch (e) { await db.storage.from("bilete").remove([sti]); alert(`Feil for «${f0.name}»: ${e.message}`); }
      }
      visBilete();
    }

    async function delBilete(id, boks) {
      boks.disabled = true;
      try { await rpc("photo_set_shared", { p_id: id, p_shared: boks.checked }); boks.closest(".bilete").classList.toggle("delt", boks.checked); }
      catch (e) { boks.checked = !boks.checked; alert(e.message); }
      boks.disabled = false;
    }

    async function slettBilete(id) {
      if (!confirm("Slette biletet?")) return;
      try { const sti = await rpc("photo_delete", { p_id: id }); await db.storage.from("bilete").remove([sti]); }
      catch (e) { alert(e.message); }
      visBilete();
    }

    function visStortBilete(i) {
      const p = bileteListe[i]; if (!p) return;
      const bak = document.createElement("div");
      bak.className = "modal-bak";
      bak.onclick = e => { if (e.target === bak) bak.remove(); };
      bak.innerHTML = `<div class="modal" style="max-width:95vw; padding:10px">
        <img src="${window._bileteUrl[p.path]}" style="max-width:100%; max-height:75vh; display:block; margin:0 auto; border-radius:6px">
        <div class="rad" style="justify-content:space-between; margin-top:8px">
          <button class="sekundar liten" ${i > 0 ? "" : "disabled"} onclick="this.closest('.modal-bak').remove(); visStortBilete(${i - 1})">◀</button>
          <span class="smaa">${esc(p.uploaded_name || "")} · ${datoKort(p.created_at)}</span>
          <button class="sekundar liten" ${i < bileteListe.length - 1 ? "" : "disabled"} onclick="this.closest('.modal-bak').remove(); visStortBilete(${i + 1})">▶</button>
        </div>
        <button class="stor" style="margin-top:8px" onclick="this.closest('.modal-bak').remove()">Lukk</button>
      </div>`;
      document.body.appendChild(bak);
    }

    // ---------------- Klubbhuset: husreglar + skjema ----------------
    // Husreglar for Vikenes MC 2026–2027 (frå dokumentet Kay delte, ordrett)

      ["1. Orden, ansvar og bruk av lokalet", [

        "1.4 Lys, kaffetrakter og elektrisk utstyr skal slås av, og dører låses ved forlatelse av lokalet.",

        "1.6 Olje, bensin og annet søl skal tørkes opp umiddelbart."]],

        "2.1 Unødig tomgangskjøring utenfor lokalet etter kl. 23.00 er ikke tillatt.",

        "3.3 Ved arrangement skal lokalet ryddes og forlates senest kl. 04.00, så langt det lar seg gjøre. Grundigere rydding og vask utføres i regi av arrangør, helst innen ett døgn etter arrangementet.",
        "3.4 Ved behov skal naboer varsles i forkant.",
        "3.5 Medlemmer er ansvarlige for sine gjester under arrangement."]],
      ["4. Rusmidler", [
        "4.1 Bruk av narkotiske rusmidler er ikke tillatt i klubbens lokaler eller på arrangement i regi av Vikenes MC.",
        "4.2 Misbruk av alkohol som fører til uakseptabel oppførsel tolereres ikke."]],
      ["5. Lagring", [
        "5.1 Medlemmer med gyldig medlemskap kan lagre egen motorsykkel i klubbens lokaler samt én (1) ekstra motorsykkel som enten eies av medlemmet selv eller tilhører nærmeste familie (ektefelle, samboer eller barn).",
        "5.2 Alle motorsykler som lagres i lokalet skal ha minst gyldig lagringsforsikring, inkludert brannforsikring.",
        "5.3 Utleie av lagringsplass til andre enn medlemmer skal godkjennes av styret.",
        "5.4 Pris for vinterlagring per vintersesong, med mindre annet vedtas av styret: Fullt medlem lagrer to (2) motorsykler gratis. Prospect lagrer én (1) motorsykkel gratis og én (1) for kr 1000. Hangaround kan lagre én (1) motorsykkel for kr 1000. Lagring for andre enn medlemmer koster kr 1800 per motorsykkel."]],
      ["6. Bryggeutstyr og bryggeansvar", [
        "6.1 Bryggeutstyr forvaltes av klubbens bryggeansvarlig.",

        "6.4 Skader eller feil bruk skal meldes til bryggeansvarlig eller styret, da klubben er avhengig av at utstyret fungerer optimalt."]],
      ["7. Verksted og bruk av arbeidsplass", [

        "7.3 Verktøy og maskiner skal kun brukes av medlemmer som har tilstrekkelig kunnskap til sikker bruk. Ved tvil skal ansvarlig medlem kontaktes.",
        "7.4 Defekt, slitt eller ødelagt utstyr skal meldes til styret eller verkstedsansvarlig umiddelbart.",
        "7.5 Sveising, sliping og annet arbeid som medfører gnister eller brannfare skal kun utføres inne på selve verkstedet og med nødvendig brannsikring. Slike arbeider skal kun utføres når minst ett (1) ekstra medlem er til stede som observatør, og gjeldende retningslinjer for varme arbeider skal følges.",

        if (kapittel.includes(i + 1)) linjer.push(`<b>${esc(tittel)}</b>`, ...punkt.map(esc));
        else punkt.filter(p => ekstra.some(e => p.startsWith(e + " "))).forEach(p => linjer.push(esc(p)));

                <div class="rad" style="gap:6px">
