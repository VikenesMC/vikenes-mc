<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vikenes MC – Medlem</title>
  <meta name="robots" content="noindex">
  <!-- App på heimeskjermen (krevst for varsel på iPhone) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="app-ikon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vikenes MC">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap">
  <link rel="stylesheet" href="stil.css">
  <style>
    .topp h1 { font-size: 30px; }
    img.oe { height: .9em; width: auto; max-width: 100%; vertical-align: middle; display: block; }
    .meg { font-size: 15px; }
    .faner2 { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .faner2 button { flex: 1 1 auto; margin-top: 0; background: #333; color: #fff; padding: 10px 12px; font-size: 15px; }
    textarea { font-family: inherit; }

    /* Bakgrunn som i lokalet: svart med oransje stripe og vinge-logoen svakt bak */
    body {
      background:
        linear-gradient(rgba(10,10,10,.90), rgba(10,10,10,.94)),
        url("gruppebilete.jpg") center top / cover fixed no-repeat,
        #0a0a0a;
    }
    .wrap { position: relative; }
    .medlem-topp { text-align: center; margin: 0 0 18px; }
    .medlem-topp .stripe { padding: 6px 0; }
    .medlem-topp .stripe img { display: block; margin: 0 auto; width: 86%; max-width: 460px; height: auto; }
    .medlem-topp img.oe { height: 44px; margin: 6px auto 0; display: block; }
    .medlem-topp .under { color: var(--dempa); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
    .kort, .chatlogg, .varselboks { background: rgba(26,26,26,.92); }

    /* ---------- Regnskap ---------- */
    .saldoar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .saldo { background: #222; border-radius: 8px; padding: 12px; font-size: 14px; }
    .saldo h3 { margin: 0 0 6px; color: var(--oransje); font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
    .saldo .linje { display: flex; justify-content: space-between; }
    .saldo .sum { font-size: 18px; font-weight: bold; border-top: 1px solid #444; margin-top: 6px; padding-top: 6px; }
    .innut { display: flex; gap: 8px; margin-top: 6px; }
    .innut label { flex: 1; margin: 0; background: #333; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; }
    .innut input { display: none; }
    .innut input:checked + span { color: #000; }
    .innut label:has(input:checked) { background: var(--oransje); color: #000; }
    .post { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--linje); }
    .post:last-child { border-bottom: 0; }
    .post .tekst { font-weight: bold; }
    .post .belop { font-weight: bold; text-align: right; white-space: nowrap; }
    .post .belop.inn { color: var(--gronn); }
    .post .belop.ut { color: var(--raud); }
    .post .meta { color: var(--dempa); font-size: 14px; }
    .post .rad button { margin-top: 6px; }
    @media (max-width: 480px) { .saldoar { grid-template-columns: 1fr; } }

    /* ---------- Kalender ---------- */
    .mnd-topp { display: flex; justify-content: space-between; align-items: center; }
    .mnd-topp h2 { margin: 0; font-size: 22px; text-transform: capitalize; }
    .mnd-topp button { margin: 0; padding: 6px 14px; }
    .kal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 12px; }
    .kal .vd { text-align: center; font-size: 12px; color: var(--dempa); padding: 2px 0; }
    .kal .dag { background: #222; border-radius: 6px; min-height: 52px; padding: 3px; font-size: 13px; cursor: pointer;
      border: 2px solid transparent; display: flex; flex-direction: column; gap: 2px; }
    .kal .dag.annan { opacity: .35; }
    .kal .dag.idag { border-color: #666; }
    .kal .dag.vald { border-color: var(--oransje); }
    .kal .dag .nr { font-weight: bold; }
    .kal .merke-treff { background: var(--oransje); color: #000; border-radius: 4px; font-size: 10px; font-weight: bold;
      padding: 1px 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .kal .merke-borte { color: var(--dempa); font-size: 11px; }
    .treff { background: #222; border-left: 4px solid var(--oransje); border-radius: 8px; padding: 12px; margin-top: 10px; }
    .treff h3 { margin: 0 0 4px; }
    .treff .smaa { color: var(--dempa); font-size: 14px; }
    .jane { display: flex; gap: 8px; margin-top: 8px; }
    .jane button { margin: 0; flex: 1; background: #333; color: #fff; }
    .jane button.vald-ja { background: var(--gronn); color: #000; }
    .jane button.vald-nei { background: var(--raud); color: #000; }
    .mld .treffkort { background: #1a1a1a; border: 1px solid #444; border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 14px; color: #fff; }
    .mld.min .treffkort { color: #fff; }
    .mld .treffkort .jane button { padding: 6px; font-size: 14px; }
    .faner2 button.aktiv { background: var(--oransje); color: #000; }
    .medlem { padding: 12px 0; border-bottom: 1px solid var(--linje); }
    .medlem:last-child { border-bottom: 0; }
    .medlem .namn { font-weight: bold; }
    .medlem .rolle { color: var(--oransje); font-size: 15px; }
    .medlem .info { color: var(--dempa); font-size: 15px; }
    .medlem select { width: auto; padding: 8px; margin-top: 8px; font-size: 15px; }
    .medlem .rad button { margin-top: 8px; }
    .kjem { color: var(--dempa); font-size: 16px; }

    /* ---------- Chat ---------- */
    .varselboks { background: var(--kort); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 15px; }
    .varselboks button { margin-top: 8px; }
    .chatlogg { background: var(--kort); border-radius: 10px; padding: 12px; height: 58vh; min-height: 300px; overflow-y: auto; }
    .dag { text-align: center; color: var(--dempa); font-size: 13px; margin: 10px 0 6px; }
    .mld { max-width: 85%; margin: 6px 0; }
    .mld .boble { background: #2b2b2b; border-radius: 14px 14px 14px 4px; padding: 8px 12px; white-space: pre-wrap; word-wrap: break-word; }
    .mld .kven { font-size: 13px; color: var(--oransje); font-weight: bold; margin: 0 0 2px 4px; }
    .mld .meta { font-size: 12px; color: var(--dempa); margin: 2px 4px 0; }
    .mld .meta button { background: none; color: var(--dempa); padding: 0; margin: 0; font-size: 12px; font-weight: normal; text-decoration: underline; }
    .mld.min { margin-left: auto; }
    .mld.min .boble { background: var(--oransje); color: #000; border-radius: 14px 14px 4px 14px; }
    .mld.min .meta { text-align: right; }
    .skrivfelt { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
    .skrivfelt textarea { flex: 1; margin: 0; resize: none; min-height: 48px; max-height: 140px; }
    .skrivfelt button { margin: 0; height: 48px; }
  </style>
</head>
<body>
  <div class="wrap">
    <p style="margin:0 0 6px"><a href="index.html" class="dempa" style="font-size:15px">← Til framsida</a></p>
    <div class="medlem-topp">
      <div class="stripe"><img src="vinge-logo.png" alt=""></div>
      <h1 style="margin:0"><img class="oe" src="vikenes-tekst.png" alt="Vikenes MC"></h1>
      <div class="under">Medlemssida</div>
    </div>

    <div id="appbanner"></div>
    <div id="innhald"><p class="dempa">Lastar …</p></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>window.AUTH_LAGER = "vmc-medlem";</script>
  <script src="felles.js"></script>
  <script>
    let meg = null;          // medlem_me()
    let liste = [];          // member_list()
    let roller = [];
    let aktivFane = "chat";
    let innloggingsFane = "inn";

    const vis = html => document.getElementById("innhald").innerHTML = html;

    function normTlf(t) {
      let d = (t || "").replace(/[\s\-+]/g, "");
      if (/^0047\d{8}$/.test(d)) d = d.slice(4);
      else if (/^47\d{8}$/.test(d) && t.trim().startsWith("+")) d = d.slice(2);
      return d;
    }

    function visTlf(t) {
      return t && t.length === 8 ? t.slice(0, 3) + " " + t.slice(3, 5) + " " + t.slice(5) : (t || "");
    }

    // ---------------- Kva skal visast ----------------
    async function start() {
      const { data } = await db.auth.getSession();
      if (!data.session) return visInnlogging();
      try {
        meg = await rpc("member_me");
      } catch (e) {
        return vis(`<div class="kort"><p class="feil">Noko gjekk gale: ${esc(e.message)}</p>
          <button onclick="start()">Prøv igjen</button></div>`);
      }
      if (!meg) return visFullfor();
      if (meg.status === "pending") return visVentar();
      if (meg.status === "removed") return visFjerna();
      if (!roller.length) roller = await rpc("member_roles");
      visApp();
    }

    // ---------------- Innlogging / ny konto ----------------
    // Nye medlemmer kjem berre inn via QR-kode som President viser (medlem.html?ny=<kode>)
    const invitasjon = new URLSearchParams(location.search).get("ny");

    async function visInnlogging(melding) {
      visAppBanner();
      if (invitasjon) {
        let ok = false;
        try { ok = await rpc("invite_valid", { p_token: invitasjon }); } catch (e) { /* vist under */ }
        if (!ok) {
          return vis(`<div class="kort"><h2 style="margin-top:0">QR-koden er ikkje gyldig</h2>
            <p>Koden er gått ut eller feil. Be President om å vise ein ny QR-kode.</p>
            <a class="dempa" href="medlem.html">Har du alt konto? Logg inn her</a></div>`);
        }
      }
      const ny = !!invitasjon;
      vis(`
        <div class="kort" style="text-align:center; padding:14px 16px">
          <b>🔒 Berre for medlemmer i Vikenes MC</b>
          <div class="dempa" style="font-size:14px; margin-top:4px">${ny
            ? "Du er invitert av President. Lag kontoen din under."
            : "Nye medlemmer får tilgang via President."}</div>
        </div>
        <div class="kort">
          ${!ny ? `
            <label for="epost" style="margin-top:0">E-post</label>
            <input id="epost" type="email" autocomplete="username">
            <label for="passord">Passord</label>
            <input id="passord" type="password" autocomplete="current-password">
            <button class="stor" onclick="loggInn()">Logg inn</button>
          ` : `
            <h2 style="margin-top:0">Ny medlem</h2>
            <p class="dempa" style="margin-top:0">Du kjem inn når President eller Vice President har godkjent deg.</p>
            <label for="namn">Fullt namn</label>
            <input id="namn" autocomplete="name">
            <label for="tlf">Mobilnummer</label>
            <input id="tlf" type="tel" inputmode="numeric" autocomplete="tel" placeholder="8 siffer, t.d. 912 34 567">
            <label for="epost">E-post</label>
            <input id="epost" type="email" autocomplete="username">
            <label for="passord">Vel eit passord (minst 8 teikn)</label>
            <input id="passord" type="password" autocomplete="new-password">
            <button class="stor" onclick="nyKonto()">Lag konto</button>
          `}
          <p id="melding" class="feil">${esc(melding || "")}</p>
        </div>`);
    }

    function feil(t) { document.getElementById("melding").textContent = t; }

    async function loggInn() {
      const email = document.getElementById("epost").value.trim();
      const password = document.getElementById("passord").value;
      if (!email || !password) return feil("Skriv inn e-post og passord.");
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) return feil("Feil e-post eller passord.");
      start();
    }

    async function nyKonto() {
      const namn = document.getElementById("namn").value.trim();
      const tlf = normTlf(document.getElementById("tlf").value);
      const email = document.getElementById("epost").value.trim();
      const password = document.getElementById("passord").value;
      if (namn.length < 2) return feil("Skriv inn namnet ditt.");
      if (!/^\d{8}$/.test(tlf)) return feil("Mobilnummeret må vere 8 siffer.");
      if (!/^\S+@\S+\.\S+$/.test(email)) return feil("Sjekk e-postadressa.");
      if (password.length < 8) return feil("Passordet må vere minst 8 teikn.");

      const { data, error } = await db.auth.signUp({ email, password });
      if (error) {
        if (/registered|exists/i.test(error.message)) return feil("Denne e-posten har alt ein konto. Logg inn på medlemssida i staden.");
        return feil("Kunne ikkje lage konto: " + error.message);
      }
      if (!data.session) {
        return feil("Kontoen er laga, men må stadfestast før du kan logge inn. Sei frå til President.");
      }
      await registrer(namn, tlf);
    }

    async function registrer(namn, tlf) {
      let svar;
      try { svar = await rpc("member_register", { p_name: namn, p_phone: tlf, p_token: invitasjon }); }
      catch (e) { return feil("Noko gjekk gale: " + e.message); }
      if (svar.status === "bad_invite") return feil("QR-koden er gått ut. Be President om ein ny.");
      if (svar.status === "bad_name") return feil("Skriv inn namnet ditt.");
      if (svar.status === "bad_phone") return feil("Mobilnummeret må vere 8 siffer.");
      if (svar.status === "phone_exists") return feil("Dette mobilnummeret er alt registrert på ein annan konto.");
      start();
    }

    // Innlogga, men ikkje i registeret (t.d. registreringa vart avbroten)
    function visFullfor() {
      if (!invitasjon) {
        return vis(`<div class="kort"><h2 style="margin-top:0">Berre for medlemmer i Vikenes MC</h2>
          <p>Denne kontoen er ikkje i medlemsregisteret. Nye medlemmer blir lagde til via QR-kode frå President.</p>
          <button class="sekundar" onclick="loggUt()">Logg ut</button></div>`);
      }
      vis(`
        <div class="kort">
          <h2 style="margin-top:0">Fullfør registreringa</h2>
          <label for="namn">Fullt namn</label>
          <input id="namn" autocomplete="name">
          <label for="tlf">Mobilnummer</label>
          <input id="tlf" type="tel" inputmode="numeric" autocomplete="tel" placeholder="8 siffer, t.d. 912 34 567">
          <button class="stor" onclick="fullfor()">Send</button>
          <p id="melding" class="feil"></p>
          <button class="sekundar" onclick="loggUt()">Logg ut</button>
        </div>`);
    }

    function fullfor() {
      const namn = document.getElementById("namn").value.trim();
      const tlf = normTlf(document.getElementById("tlf").value);
      if (namn.length < 2) return feil("Skriv inn namnet ditt.");
      if (!/^\d{8}$/.test(tlf)) return feil("Mobilnummeret må vere 8 siffer.");
      registrer(namn, tlf);
    }

    function visVentar() {
      vis(`
        <div class="kort">
          <h2 style="margin-top:0">Takk, ${esc(meg.name)}!</h2>
          <p>Du ventar på godkjenning frå <b>President</b> eller <b>Vice President</b>.</p>
          <p class="dempa">Når du er godkjend, kjem du rett inn her.</p>
          <button onclick="start()">Sjekk igjen</button>
          <button class="sekundar" onclick="loggUt()">Logg ut</button>
        </div>`);
    }

    function visFjerna() {
      vis(`
        <div class="kort">
          <p>Du har ikkje tilgang til medlemssida.</p>
          <p class="dempa">Ta kontakt med President om du meiner dette er feil.</p>
          <button class="sekundar" onclick="loggUt()">Logg ut</button>
        </div>`);
    }

    async function loggUt() {
      stoppChat();
      await db.auth.signOut();
      meg = null;
      innloggingsFane = "inn";
      visInnlogging();
    }

    // ---------------- Medlemssida ----------------
    async function visApp() {
      vis(`
        <div class="rad" style="justify-content:space-between; margin-bottom:12px">
          <div class="meg"><b>${esc(meg.name)}</b> · <span style="color:var(--oransje)">${esc(meg.role)}</span></div>
          <button class="sekundar liten" onclick="loggUt()">Logg ut</button>
        </div>
        <div class="faner2">
          <button data-fane="chat" onclick="visFane('chat')">Chat</button>
          <button data-fane="kalender" onclick="visFane('kalender')">Kalender</button>
          <button data-fane="arkiv" onclick="visFane('arkiv')">Arkiv</button>
          <button data-fane="quiz" onclick="visFane('quiz')">MC Quiz</button>
          ${meg.regnskap ? `<button data-fane="regnskap" onclick="visFane('regnskap')">Regnskap</button>` : ""}
          <button data-fane="medlemmer" onclick="visFane('medlemmer')">Medlemmer</button>
          ${meg.news_writer ? `<button data-fane="nyheiter" onclick="visFane('nyheiter')">Nyheiter</button>
                               <button data-fane="gjestebok" onclick="visFane('gjestebok')">Gjestebok<span id="g-tal"></span></button>` : ""}
        </div>
        <div id="fane"></div>`);
      visFane(aktivFane);
      if (meg.news_writer) oppdaterGjestetal();
      fornyAbonnement();
      visAppBanner();
    }

    async function visFane(f) {
      aktivFane = f;
      document.querySelectorAll(".faner2 button").forEach(b =>
        b.classList.toggle("aktiv", b.dataset.fane === f));
      if (f !== "chat") stoppChat();
      if (f === "chat") return visChat();
      if (f === "arkiv") return visArkiv();
      if (f === "regnskap") return visRegnskap();
      if (f === "kalender") return visKalender();
      if (f === "quiz") return visQuiz();
      if (f === "nyheiter") return visNyheiter();
      if (f === "gjestebok") return visGjestebok();
      try { liste = await rpc("member_list"); }
      catch (e) { return start(); }
      visMedlemmer();
    }

    // ---------------- Chat ----------------
    let chat = { siste: 0, forste: 0, total: 0, timer: null, mine: new Set(), dagar: new Set() };

    function stoppChat() { if (chat.timer) { clearInterval(chat.timer); chat.timer = null; } }

    async function visChat() {
      stoppChat();
      chat = { siste: 0, forste: 0, total: 0, timer: null, dagar: new Set() };
      document.getElementById("fane").innerHTML = `
        <div id="leiarvarsel"></div>
        <div class="varselboks" id="varselboks"></div>
        <div class="chatlogg" id="chatlogg"><p class="dempa">Lastar chatten …</p></div>
        <div class="skrivfelt">
          <textarea id="chattekst" rows="1" maxlength="2000" placeholder="Skriv ei melding …"></textarea>
          <button onclick="sendChat()">Send</button>
        </div>`;
      const ta = document.getElementById("chattekst");
      ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; });
      ta.addEventListener("keydown", e => {
        // Enter sender på PC; Shift+Enter gir ny linje. På mobil brukar ein Send-knappen.
        if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)) { e.preventDefault(); sendChat(); }
      });
      visVarselboks();
      visLeiarvarsel();
      document.getElementById("chatlogg").innerHTML = "";
      await hentChat(true);
      chat.timer = setInterval(() => { if (!document.hidden) hentChat(false); }, 4000);
    }

    async function visLeiarvarsel() {
      if (!meg.leader) return;
      try {
        const l = await rpc("member_list");
        const n = l.filter(m => m.status === "pending").length;
        const el = document.getElementById("leiarvarsel");
        if (el && n) el.innerHTML = `<div class="kort" style="border-top-color:var(--gul); padding:12px 16px">
          <span class="vars">${n} ventar på godkjenning</span>
          <button class="liten" style="margin-left:10px" onclick="visFane('medlemmer')">Sjå medlemmer</button></div>`;
      } catch (e) { /* ikkje kritisk */ }
    }

    function klokke(iso) { return new Date(iso).toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" }); }
    function dagTekst(iso) {
      const d = new Date(iso), i = new Date(); const ig = new Date(); ig.setDate(i.getDate() - 1);
      if (d.toDateString() === i.toDateString()) return "I dag";
      if (d.toDateString() === ig.toDateString()) return "I går";
      return d.toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" });
    }

    function meldingHtml(m) {
      const min = m.author_id === meg.id;
      const dag = new Date(m.created_at).toDateString();
      let skil = "";
      if (!chat.dagar.has(dag)) { chat.dagar.add(dag); skil = `<div class="dag">${esc(dagTekst(m.created_at))}</div>`; }
      return `${skil}<div class="mld ${min ? "min" : ""}" data-id="${m.id}">
          ${min ? "" : `<div class="kven">${esc(m.author)}</div>`}
          <div class="boble">${esc(m.body)}${m.event ? treffkortHtml(m.event) : ""}</div>
          <div class="meta">${esc(klokke(m.created_at))} ·
            <button onclick="visSettAv(${m.id})">Sett av <span class="sett">${m.seen}</span> av ${chat.total}</button></div>
        </div>`;
    }

    async function hentChat(forsteGong) {
      let r;
      try { r = await rpc("chat_list", { p_after: chat.siste }); }
      catch (e) { if (forsteGong) document.getElementById("chatlogg").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      const logg = document.getElementById("chatlogg");
      if (!logg) return;
      chat.total = r.total;
      const nedst = logg.scrollHeight - logg.scrollTop - logg.clientHeight < 80;
      if (forsteGong && !r.messages.length) logg.innerHTML = '<p class="dempa" id="tomchat">Ingen meldingar enno. Skriv den første!</p>';
      if (r.messages.length) {
        document.getElementById("tomchat")?.remove();
        if (!chat.forste) chat.forste = r.messages[0].id;
        logg.insertAdjacentHTML("beforeend", r.messages.map(meldingHtml).join(""));
        chat.siste = r.messages[r.messages.length - 1].id;
        if (forsteGong || nedst || r.messages.some(m => m.author_id === meg.id)) logg.scrollTop = logg.scrollHeight;
      } else if (chat.forste) {
        // Ingen nye meldingar – oppdater berre «Sett av»-tala
        try {
          const tal = await rpc("chat_seen_counts", { p_from: chat.forste });
          for (const [id, n] of Object.entries(tal)) {
            const s = logg.querySelector(`.mld[data-id="${id}"] .sett`);
            if (s) s.textContent = n;
          }
        } catch (e) { /* prøver igjen neste runde */ }
      }
      if (chat.siste && !document.hidden) rpc("chat_mark_read", { p_id: chat.siste }).catch(() => {});
    }

    async function sendChat() {
      const ta = document.getElementById("chattekst");
      const tekst = ta.value.trim();
      if (!tekst) return;
      ta.disabled = true;
      try {
        const id = await rpc("chat_send", { p_body: tekst });
        ta.value = ""; ta.style.height = "auto";
        // Send varsel til dei andre (treng ikkje vente på svaret)
        db.functions.invoke("chat-push", { body: { action: "send", message_id: id } }).catch(() => {});
        await hentChat(false);
      } catch (e) {
        alert("Klarte ikkje å sende: " + e.message);
      }
      ta.disabled = false; ta.focus();
    }

    async function visSettAv(id) {
      let r;
      try { r = await rpc("chat_seen_by", { p_id: id }); } catch (e) { return alert(e.message); }
      alert(`Sett av (${r.seen.length}):\n${r.seen.join(", ") || "–"}\n\nIkkje sett enno (${r.not_seen.length}):\n${r.not_seen.join(", ") || "–"}`);
    }

    // Opna frå eit varsel medan sida alt er open → gå til chatten
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("message", e => { if (e.data === "opne-chat" && meg && meg.status === "approved") visFane("chat"); });
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden && aktivFane === "chat" && chat.timer) hentChat(false); });

    // ---------------- Varsel (push) ----------------
    const erIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const erApp = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

    async function harAbonnement() {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
      const reg = await navigator.serviceWorker.getRegistration();
      return !!(reg && await reg.pushManager.getSubscription());
    }

    async function visVarselboks() {
      const boks = document.getElementById("varselboks");
      if (!boks) return;
      if (erIOS && !erApp) {
        boks.innerHTML = `🔔 <b>Varsel på iPhone:</b> trykk på <b>Del</b>-knappen (firkanten med pil opp) nedst i Safari,
          vel <b>«Legg til på Heim-skjerm»</b>, og opne Vikenes MC frå ikonet. Då kan du slå på varsel.`;
        return;
      }
      if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
        boks.innerHTML = "Denne nettlesaren kan ikkje vise varsel. Prøv Chrome eller Safari.";
        return;
      }
      if (Notification.permission === "denied") {
        boks.innerHTML = "🔕 Varsel er blokkerte for denne sida. Slå dei på i innstillingane til nettlesaren.";
        return;
      }
      if (Notification.permission === "granted" && await harAbonnement()) {
        boks.innerHTML = `🔔 Varsel er på for denne eininga.
          <button class="sekundar liten" style="margin-left:8px" onclick="testVarsel()">Send testvarsel</button>`;
        return;
      }
      boks.innerHTML = `Få varsel på mobilen når nokon skriv i chatten.
        <br><button onclick="slaaPaaVarsel()">🔔 Slå på varsel</button>`;
    }

    function b64tilBytes(b64) {
      const pad = "=".repeat((4 - b64.length % 4) % 4);
      const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    async function slaaPaaVarsel() {
      const boks = document.getElementById("varselboks");
      try {
        const lov = await Notification.requestPermission();
        if (lov !== "granted") return visVarselboks();
        boks.innerHTML = "Slår på varsel …";
        const reg = await navigator.serviceWorker.register("sw.js");
        await navigator.serviceWorker.ready;
        let nokkel = await rpc("push_public_key");
        if (!nokkel) {
          const { data, error } = await db.functions.invoke("chat-push", { body: { action: "key" } });
          if (error) throw error;
          nokkel = data.publicKey;
        }
        let ab = await reg.pushManager.getSubscription();
        if (!ab) ab = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64tilBytes(nokkel) });
        const j = ab.toJSON();
        await rpc("push_subscribe", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent });
      } catch (e) {
        boks.innerHTML = `<span class="feil">Klarte ikkje å slå på varsel: ${esc(e.message || String(e))}</span>`;
        return;
      }
      visVarselboks();
    }

    async function testVarsel() {
      const { data, error } = await db.functions.invoke("chat-push", { body: { action: "test" } });
      if (error) return alert("Feil: " + error.message);
      alert(data.sendt ? "Testvarsel sendt – det skal kome om nokre sekund." : "Fann ingen eining å sende til. Prøv å slå på varsel på nytt.");
    }

    // ---------------- Installer appen ----------------
    // Android/Chrome: nettlesaren gir oss ein «installer»-hendings som vi viser som knapp.
    // iPhone: Safari har ingen slik knapp, så vi viser korleis ein legg sida på heimeskjermen.
    let installHending = null;
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installHending = e; visAppBanner(); });
    window.addEventListener("appinstalled", () => { installHending = null; visAppBanner(); });

    function visAppBanner() {
      const el = document.getElementById("appbanner");
      if (!el) return;
      const bedt = new URLSearchParams(location.search).has("app");
      // Berre innlogga, godkjende medlemmer blir oppmoda om å installere appen
      if (erApp || !meg || meg.status !== "approved") { el.innerHTML = ""; return; }
      if (installHending) {
        el.innerHTML = `<div class="kort" style="display:flex; gap:12px; align-items:center; padding:14px 16px">
          <img src="app-ikon.png" alt="" style="width:48px; height:48px; border-radius:12px">
          <div style="flex:1"><b>Vikenes MC-appen</b><br><span class="dempa" style="font-size:14px">Legg medlemssida på heimeskjermen</span></div>
          <button style="margin:0" onclick="installerApp()">📲 Installer</button></div>`;
      } else if (erIOS && bedt) {
        el.innerHTML = `<div class="kort" style="padding:14px 16px">
          <b>📲 Installer Vikenes MC-appen på iPhone</b>
          <ol style="margin:8px 0 0; padding-left:20px; font-size:15px">
            <li>Opne sida i <b>Safari</b></li>
            <li>Trykk på <b>Del</b>-knappen (firkanten med pil opp)</li>
            <li>Vel <b>«Legg til på Heim-skjerm»</b> og trykk <b>Legg til</b></li>
          </ol></div>`;
      } else if (bedt) {
        el.innerHTML = `<div class="kort" style="padding:14px 16px; font-size:15px">
          <b>📲 Installer appen:</b> trykk på menyen <b>⋮</b> øvst i Chrome og vel <b>«Installer app»</b>
          eller <b>«Legg til på startsida»</b>.</div>`;
      } else {
        el.innerHTML = "";
      }
    }

    async function installerApp() {
      if (!installHending) return;
      installHending.prompt();
      await installHending.userChoice;
      installHending = null;
      visAppBanner();
    }
    visAppBanner();
    // Registrer service worker med ein gong, så nettlesaren reknar sida som ein app
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

    // Hald abonnementet oppdatert (t.d. etter at nettlesaren har fornya det)
    async function fornyAbonnement() {
      try {
        if (Notification.permission !== "granted" || !("serviceWorker" in navigator)) return;
        const reg = await navigator.serviceWorker.register("sw.js");
        const ab = await reg.pushManager.getSubscription();
        if (!ab) return;
        const j = ab.toJSON();
        await rpc("push_subscribe", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent });
      } catch (e) { /* ikkje kritisk */ }
    }

    function rolleVal(id, valt) {
      return `<select id="rolle-${id}">${roller.map(r =>
        `<option value="${esc(r)}" ${r === valt ? "selected" : ""}>${esc(r)}</option>`).join("")}</select>`;
    }

    function medlemRad(m) {
      const megSjolv = m.id === meg.id;
      let knappar = "";
      if (meg.leader && !megSjolv) {
        if (m.status === "pending") {
          knappar = `<div class="rad">${rolleVal(m.id, m.role)}
            <button onclick="sett('${m.id}', 'approved')">Godkjenn</button>
            <button class="sekundar" onclick="sett('${m.id}', 'removed', 'Avvise')">Avvis</button></div>`;
        } else if (m.status === "approved") {
          knappar = `<div class="rad">${rolleVal(m.id, m.role)}
            <button class="sekundar" onclick="sett('${m.id}', 'approved')">Lagre rolle</button>
            <button class="fare" onclick="sett('${m.id}', 'removed', 'Fjerne')">Fjern</button></div>`;
        } else {
          knappar = `<div class="rad">${rolleVal(m.id, m.role)}
            <button class="sekundar" onclick="sett('${m.id}', 'approved')">Gje tilgang att</button></div>`;
        }
      }
      return `<div class="medlem">
        <div class="namn">${esc(m.name)}${megSjolv ? ' <span class="dempa">(deg)</span>' : ""}</div>
        <div class="rolle">${esc(m.role)}</div>
        <div class="info">${m.phone ? `<a href="tel:${esc(m.phone)}">${esc(visTlf(m.phone))}</a>` : ""}
          ${m.email ? " · " + esc(m.email) : ""}</div>
        ${knappar}
      </div>`;
    }

    function visMedlemmer() {
      const ventande = liste.filter(m => m.status === "pending");
      const godkjende = liste.filter(m => m.status === "approved");
      const fjerna = liste.filter(m => m.status === "removed");
      document.getElementById("fane").innerHTML = `
        ${meg.role === "President" ? `<div class="kort">
          <h2 style="margin-top:0">Ny medlem</h2>
          <p class="dempa" style="margin-top:0">Vis QR-koden på mobilen din. Den nye medlemmen skannar ho og lagar konto.
            Koden gjeld i 24 timar, og du godkjenner medlemmen etterpå her.</p>
          <button onclick="visInvitasjon()">📱 Vis QR-kode for ny medlem</button>
        </div>` : ""}
        ${ventande.length ? `<div class="kort" style="border-top-color:var(--gul)">
          <h2 style="margin-top:0">Ventar på godkjenning</h2>
          <p class="dempa" style="margin-top:0">Vel rolle og trykk «Godkjenn».</p>
          ${ventande.map(medlemRad).join("")}</div>` : ""}
        <div class="kort">
          <h2 style="margin-top:0">Medlemmer (${godkjende.length})</h2>
          ${godkjende.map(medlemRad).join("") || '<p class="dempa">Ingen enno.</p>'}
          ${meg.leader ? '<p class="dempa" style="font-size:14px">Berre President og Vice President kan endre roller. Du kan ikkje endre deg sjølv.</p>' : ""}
        </div>
        ${fjerna.length ? `<div class="kort" style="border-top-color:#555">
          <h2 style="margin-top:0">Utan tilgang</h2>
          ${fjerna.map(medlemRad).join("")}</div>` : ""}`;
    }

    // President: vis QR-kode som nye medlemmer skannar for å lage konto
    async function visInvitasjon() {
      let inv;
      try { inv = await rpc("invite_create"); }
      catch (e) { return alert(e.message === "not_allowed" ? "Berre President kan lage QR-kode for nye medlemmer." : e.message); }
      const url = BASE_URL + "medlem.html?ny=" + encodeURIComponent(inv.token);
      const bak = document.createElement("div");
      bak.className = "modal-bak";
      bak.innerHTML = `<div class="modal">
        <h2 style="margin-top:0">Ny medlem i Vikenes MC</h2>
        <p class="dempa" style="margin:0">Skann med mobilkameraet</p>
        <div class="qr-boks" id="inv-qr"></div>
        <p class="dempa" style="font-size:14px">Gjeld til ${new Date(inv.expires_at).toLocaleString("nb-NO", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</p>
        <button class="stor" onclick="this.closest('.modal-bak').remove()">Lukk</button>
      </div>`;
      document.body.appendChild(bak);
      new QRCode(document.getElementById("inv-qr"), { text: url, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
    }

    async function sett(id, status, verb) {
      const m = liste.find(x => x.id === id);
      if (verb && !confirm(verb + " " + (m ? m.name : "") + "?")) return;
      const rolle = document.getElementById("rolle-" + id).value;
      try {
        await rpc("member_set", { p_id: id, p_role: rolle, p_status: status });
      } catch (e) {
        const t = { not_allowed: "Berre President og Vice President kan gjere dette.",
                    not_self: "Du kan ikkje endre deg sjølv." }[e.message] || e.message;
        alert(t);
      }
      visFane("medlemmer");
    }

    // ---------------- Nyheiter (President, Vice President, Secretary) ----------------
    let nyheiter = [];
    let redigerer = null;   // id på saka som blir redigert, "ny" for ny sak

    function dato(iso) {
      return iso ? new Date(iso).toLocaleDateString("nb-NO", { day: "numeric", month: "long", year: "numeric" }) : "";
    }

    async function visNyheiter() {
      try { nyheiter = await rpc("news_all"); }
      catch (e) { document.getElementById("fane").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      const sak = redigerer === "ny" ? {} : nyheiter.find(n => n.id === redigerer);
      document.getElementById("fane").innerHTML = (redigerer !== null && sak) ? nyheitSkjema(sak) : `
        <div class="kort">
          <p class="dempa" style="margin-top:0">Publiserte saker kjem rett på framsida (dei 10 nyaste).</p>
          <button class="stor" onclick="redigerer='ny'; visNyheiter()">+ Skriv ny sak</button>
        </div>
        ${nyheiter.map(n => `
          <div class="kort" style="${n.published ? "" : "border-top-color:#555"}">
            <div class="rad" style="justify-content:space-between">
              <b>${esc(n.title)}</b>
              ${n.published ? `<span class="merke gronn">Publisert ${esc(dato(n.published_at))}</span>`
                            : `<span class="merke">Kladd</span>`}
            </div>
            <p class="dempa" style="white-space:pre-line; margin-bottom:0">${esc(n.body.length > 200 ? n.body.slice(0, 200) + " …" : n.body)}</p>
            <p class="dempa" style="font-size:14px">Skriven av ${esc(n.author_name || "–")}</p>
            <button class="sekundar liten" onclick="redigerer=${n.id}; visNyheiter()">Rediger</button>
          </div>`).join("") || '<p class="dempa">Ingen saker enno.</p>'}`;
    }

    function nyheitSkjema(n) {
      return `
        <div class="kort">
          <h2 style="margin-top:0">${n.id ? "Rediger sak" : "Ny sak"}</h2>
          <label for="n-tittel">Overskrift</label>
          <input id="n-tittel" maxlength="120" value="${esc(n.title || "")}">
          <label for="n-tekst">Tekst</label>
          <textarea id="n-tekst" rows="8" maxlength="5000">${esc(n.body || "")}</textarea>
          <label for="n-lenkje">Lenkje (valfritt) – t.d. #quiz, quiz.html eller https://…</label>
          <input id="n-lenkje" value="${esc(n.link_url || "")}" placeholder="quiz.html">
          <label for="n-lenkjetekst">Tekst på knappen (valfritt)</label>
          <input id="n-lenkjetekst" value="${esc(n.link_text || "")}" placeholder="Meld deg på">
          <div class="rad" style="margin-top:16px">
            <button onclick="lagreNyheit(${n.id || "null"}, true)">${n.published ? "Lagre" : "Publiser"}</button>
            <button class="sekundar" onclick="lagreNyheit(${n.id || "null"}, false)">${n.published ? "Gjer om til kladd" : "Lagre som kladd"}</button>
            <button class="sekundar" onclick="redigerer=null; visNyheiter()">Avbryt</button>
            ${n.id ? `<button class="fare" onclick="slettNyheit(${n.id})">Slett</button>` : ""}
          </div>
          <p id="n-feil" class="feil"></p>
        </div>`;
    }

    async function lagreNyheit(id, publiser) {
      const v = k => document.getElementById(k).value;
      try {
        await rpc("news_save", { p_id: id, p_title: v("n-tittel"), p_body: v("n-tekst"),
          p_link_url: v("n-lenkje"), p_link_text: v("n-lenkjetekst"), p_published: publiser });
      } catch (e) {
        const t = { bad_title: "Overskrifta må vere 2–120 teikn.", bad_body: "Teksten er for lang.",
                    bad_link: "Lenkja må starte med https://, vere ei side her (t.d. quiz.html) eller ein bolk på framsida (t.d. #quiz).",
                    not_allowed: "Berre President, Vice President og Secretary kan skrive nyheiter." }[e.message] || e.message;
        document.getElementById("n-feil").textContent = t;
        return;
      }
      redigerer = null;
      visNyheiter();
    }

    async function slettNyheit(id) {
      if (!confirm("Slette saka for godt?")) return;
      try { await rpc("news_delete", { p_id: id }); } catch (e) { alert(e.message); }
      redigerer = null;
      visNyheiter();
    }

    // ---------------- Arkiv / dokument ----------------
    const MAPPER = [
      { id: "reglar", namn: "📜 Retningslinjer / Reglar" },
      { id: "vedtekter", namn: "⚖️ Vedtekter" },
      { id: "hus-lokale", namn: "🏠 Hus / Lokale" },
      { id: "arsmote", namn: "🗳️ Årsmøte" },
      { id: "regnskap", namn: "💰 Regnskap", berreRegnskap: true },
    ];
    let aktivMappe = "reglar";

    function kanSkrive(mappe) {
      return mappe === "regnskap" ? !!meg.regnskap : !!meg.leader;
    }
    function storleik(b) {
      if (!b && b !== 0) return "";
      return b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + " kB" : (b / 1024 / 1024).toFixed(1).replace(".", ",") + " MB";
    }

    async function visArkiv() {
      const mapper = MAPPER.filter(m => !m.berreRegnskap || meg.regnskap);
      if (!mapper.some(m => m.id === aktivMappe)) aktivMappe = mapper[0].id;
      document.getElementById("fane").innerHTML = `
        <div class="kort">
          <label for="mappeval" style="margin-top:0">Mappe</label>
          <select id="mappeval" onchange="aktivMappe = this.value; visArkiv()">
            ${mapper.map(m => `<option value="${m.id}" ${m.id === aktivMappe ? "selected" : ""}>${m.namn}</option>`).join("")}
          </select>
          ${kanSkrive(aktivMappe) ? `
            <div style="margin-top:16px">
              <label for="arkivfil" style="margin-top:0">Last opp dokument (maks 25 MB)</label>
              <input type="file" id="arkivfil" multiple style="background:#222; color:#fff">
              <button onclick="lastOppDok()">⬆️ Last opp</button>
              <p id="arkivstatus" class="dempa" style="margin-bottom:0"></p>
            </div>` : ""}
        </div>
        <div class="kort" id="dokliste"><p class="dempa">Lastar …</p></div>`;
      let liste;
      try { liste = await rpc("doc_list", { p_folder: aktivMappe }); }
      catch (e) { document.getElementById("dokliste").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      document.getElementById("dokliste").innerHTML = liste.length ? liste.map(d => `
        <div class="medlem">
          <div class="namn">📄 ${esc(d.name)}</div>
          <div class="info">${esc(storleik(d.size))} · ${esc(dato(d.created_at))}${d.uploader ? " · " + esc(d.uploader) : ""}</div>
          <div class="rad">
            <button class="liten" style="margin-top:8px" onclick="opneDok('${esc(d.path)}')">Opne</button>
            ${kanSkrive(aktivMappe) ? `<button class="fare liten" style="margin-top:8px" onclick="slettDok(${d.id})">Slett</button>` : ""}
          </div>
        </div>`).join("") : '<p class="dempa" style="margin:0">Ingen dokument i denne mappa enno.</p>';
    }

    // Lagar eit trygt filnamn til lagringa (det ekte namnet blir lagra i lista)
    function trygtNamn(n) {
      return n.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[æÆ]/g, "ae").replace(/[øØ]/g, "o").replace(/[åÅ]/g, "a")
        .replace(/[^a-zA-Z0-9._-]+/g, "-").replace(/-+/g, "-").slice(-80) || "fil";
    }

    async function lastOppDok() {
      const filer = [...document.getElementById("arkivfil").files];
      const status = document.getElementById("arkivstatus");
      if (!filer.length) { status.textContent = "Vel ei fil først."; return; }
      for (const [i, f] of filer.entries()) {
        if (f.size > 25 * 1024 * 1024) { alert(`«${f.name}» er større enn 25 MB og blir ikkje lasta opp.`); continue; }
        status.textContent = `Lastar opp ${i + 1} av ${filer.length}: ${f.name} …`;
        const sti = `${aktivMappe}/${Date.now()}-${trygtNamn(f.name)}`;
        const { error } = await db.storage.from("arkiv").upload(sti, f, { contentType: f.type || "application/octet-stream" });
        if (error) { alert(`Klarte ikkje å laste opp «${f.name}»: ${error.message}`); continue; }
        try { await rpc("doc_add", { p_folder: aktivMappe, p_path: sti, p_name: f.name, p_size: f.size, p_mime: f.type }); }
        catch (e) { await db.storage.from("arkiv").remove([sti]); alert(`Feil for «${f.name}»: ${e.message}`); }
      }
      visArkiv();
    }

    async function opneDok(sti) {
      const vindauge = window.open("", "_blank");   // opnar fane med ein gong (elles blokkerer mobilen)
      const { data, error } = await db.storage.from("arkiv").createSignedUrl(sti, 300);
      if (error) { if (vindauge) vindauge.close(); return alert("Klarte ikkje å opne: " + error.message); }
      if (vindauge) vindauge.location = data.signedUrl; else location.href = data.signedUrl;
    }

    async function slettDok(id) {
      if (!confirm("Slette dokumentet for godt?")) return;
      try {
        const sti = await rpc("doc_delete", { p_id: id });
        await db.storage.from("arkiv").remove([sti]);
      } catch (e) { alert(e.message); }
      visArkiv();
    }

    // ---------------- MC Quiz: snarvegar til quiz-sidene ----------------
    function visQuiz() {
      const knapp = (href, ikon, tittel, tekst) => `
        <a class="knapp" href="${href}" target="_blank" rel="noopener"
           style="display:block; text-align:left; margin-top:10px; background:#2a2a2a; color:#fff; border-left:4px solid var(--oransje)">
          <span style="font-size:20px">${ikon}</span> <b>${tittel}</b><br>
          <span style="font-weight:normal; font-size:14px; color:var(--dempa)">${tekst}</span></a>`;
      document.getElementById("fane").innerHTML = `
        <div class="kort">
          <h2 style="margin-top:0">MC Quiz</h2>
          <p class="dempa" style="margin-top:0">Sidene opnar i ny fane. Admin krev eiga quiz-innlogging og PIN.</p>
          ${knapp("admin.html", "🛠️", "Quiz-admin", "Deltakarar, betaling, grupper, postar, ruter og start")}
          ${knapp("skjerm.html", "📺", "Skjerm ute", "Klokke, neste gruppe ut og poengtavle")}
          ${knapp("skjerm.html?inne", "🖥️", "Skjerm inne", "Alle gruppene med starttid og status")}
          ${knapp("utskrift.html", "🖨️", "Skriv ut QR-kodar", "QR-ark til postane og målet")}
          ${knapp("quiz.html", "📝", "Påmelding", "Sida deltakarane melder seg på")}
        </div>`;
    }

    // ---------------- Kalender ----------------
    const FRAVAER = { jobb: "💼 Jobb", ferie: "🏖️ Ferie", vekk: "✈️ Bortreist" };
    let kalMnd = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
    let kalValt = null;       // ISO-dato for dagen som er vald
    let kalData = null;
    let kalSkjema = null;     // null | {type:"treff", e} | {type:"fravaer", a}

    function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
    function treffDato(e) {
      const f = datoKort(e.dato) + (e.tid ? ` kl. ${e.tid}` : "");
      return e.til_dato && e.til_dato !== e.dato ? `${f} – ${datoKort(e.til_dato)}` : f;
    }
    function erLeiarEllerEigar(e) { return meg.leader || e.created_by === meg.id; }

    async function visKalender() {
      if (!kalValt) kalValt = iso(new Date());
      // Rutenettet startar på måndag
      const forste = new Date(kalMnd);
      const start = new Date(forste); start.setDate(1 - ((forste.getDay() + 6) % 7));
      const slutt = new Date(start); slutt.setDate(start.getDate() + 41);
      try { kalData = await rpc("cal_range", { p_fra: iso(start), p_til: iso(slutt) }); }
      catch (e) { document.getElementById("fane").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      const idagIso = iso(new Date());
      let celler = "";
      for (let i = 0; i < 42; i++) {
        const d = new Date(start); d.setDate(start.getDate() + i);
        const di = iso(d);
        const treff = kalData.events.filter(e => e.dato <= di && (e.til_dato || e.dato) >= di);
        const borte = kalData.absences.filter(a => a.fra <= di && a.til >= di);
        celler += `<div class="dag ${d.getMonth() !== kalMnd.getMonth() ? "annan" : ""} ${di === idagIso ? "idag" : ""} ${di === kalValt ? "vald" : ""}"
            onclick="kalValt='${di}'; kalSkjema=null; visKalender()">
          <span class="nr">${d.getDate()}</span>
          ${treff.slice(0, 2).map(e => `<span class="merke-treff">${esc(e.title)}</span>`).join("")}
          ${treff.length > 2 ? `<span class="merke-treff">+${treff.length - 2}</span>` : ""}
          ${borte.length ? `<span class="merke-borte">🚫 ${borte.length}</span>` : ""}
        </div>`;
      }
      const dagTreff = kalData.events.filter(e => e.dato <= kalValt && (e.til_dato || e.dato) >= kalValt);
      const dagBorte = kalData.absences.filter(a => a.fra <= kalValt && a.til >= kalValt);
      const valtDato = new Date(kalValt + "T12:00:00");
      document.getElementById("fane").innerHTML = `
        <div class="kort">
          <div class="mnd-topp">
            <button class="sekundar" onclick="kalMnd.setMonth(kalMnd.getMonth() - 1); kalMnd = new Date(kalMnd); kalSkjema=null; visKalender()">◀</button>
            <h2>${kalMnd.toLocaleDateString("nb-NO", { month: "long", year: "numeric" })}</h2>
            <button class="sekundar" onclick="kalMnd.setMonth(kalMnd.getMonth() + 1); kalMnd = new Date(kalMnd); kalSkjema=null; visKalender()">▶</button>
          </div>
          <div class="kal">
            ${["Må", "Ty", "On", "To", "Fr", "La", "Sø"].map(v => `<div class="vd">${v}</div>`).join("")}
            ${celler}
          </div>
          <div class="rad" style="margin-top:12px">
            <button onclick="kalSkjema={type:'treff', e:null}; visKalender()">＋ Nytt arrangement</button>
            <button class="sekundar" onclick="kalSkjema={type:'fravaer', a:null}; visKalender()">＋ Legg inn fråvær</button>
          </div>
        </div>
        ${kalSkjema ? kalSkjemaHtml() : ""}
        <div class="kort">
          <h2 style="margin-top:0; text-transform:capitalize">${valtDato.toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" })}</h2>
          ${dagTreff.map(treffHtml).join("") || '<p class="dempa" style="margin:0">Ingen arrangement denne dagen.</p>'}
          ${dagBorte.length ? `<p style="margin:14px 0 0"><b>Borte:</b> ${dagBorte.map(a =>
              `${esc(a.name)} <span class="dempa">(${FRAVAER[a.type]}${a.note ? " – " + esc(a.note) : ""})</span>`).join(", ")}</p>` : ""}
        </div>
        <div class="kort">
          <h2 style="margin-top:0">Mitt fråvær</h2>
          ${kalData.mine_fravaer.map(a => `<div class="medlem">
              <div class="namn">${FRAVAER[a.type]} ${datoKort(a.fra)}${a.til !== a.fra ? " – " + datoKort(a.til) : ""}</div>
              ${a.note ? `<div class="info">${esc(a.note)}</div>` : ""}
              <div class="rad">
                <button class="sekundar liten" style="margin-top:8px" onclick='kalSkjema={type:"fravaer", a:${JSON.stringify(a).replace(/'/g, "&#39;")}}; visKalender()'>Endre</button>
                <button class="fare liten" style="margin-top:8px" onclick="slettFravaer(${a.id})">Slett</button>
              </div></div>`).join("") || '<p class="dempa" style="margin:0">Du har ikkje lagt inn noko fråvær framover.</p>'}
        </div>`;
      if (kalSkjema) document.getElementById("kalskjema")?.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function svarKnappar(e, kjelde) {
      return `<div class="jane">
        <button class="${e.mitt === true ? "vald-ja" : ""}" onclick="svarTreff(${e.id}, ${e.mitt === true ? "null" : "true"}, '${kjelde}')">👍 Ja${e.ja.length ? " (" + e.ja.length + ")" : ""}</button>
        <button class="${e.mitt === false ? "vald-nei" : ""}" onclick="svarTreff(${e.id}, ${e.mitt === false ? "null" : "false"}, '${kjelde}')">👎 Nei${e.nei.length ? " (" + e.nei.length + ")" : ""}</button>
      </div>`;
    }

    function treffHtml(e) {
      return `<div class="treff">
        <h3>${esc(e.title)}</h3>
        <div class="smaa">📅 ${treffDato(e)}${e.place ? " · 📍 " + esc(e.place) : ""}${e.arranger ? " · " + esc(e.arranger) : ""}</div>
        ${e.info ? `<p style="white-space:pre-line; margin:8px 0 0">${esc(e.info)}</p>` : ""}
        ${e.link ? `<p style="margin:6px 0 0"><a href="${esc(e.link)}" target="_blank" rel="noopener">Meir info ↗</a></p>` : ""}
        ${svarKnappar(e, "kal")}
        <p class="smaa" style="margin:8px 0 0">
          ${e.ja.length ? "👍 " + e.ja.map(esc).join(", ") : ""}${e.ja.length && e.nei.length ? "<br>" : ""}
          ${e.nei.length ? "👎 " + e.nei.map(esc).join(", ") : ""}
          ${e.borte.length ? `<br>🚫 Borte: ${e.borte.map(b => esc(b.name) + " (" + FRAVAER[b.type].split(" ")[1].toLowerCase() + ")").join(", ")}` : ""}
        </p>
        <div class="rad">
          <button class="liten" style="margin-top:8px" onclick="delTreff(${e.id})">💬 Del i chatten</button>
          ${erLeiarEllerEigar(e) ? `<button class="sekundar liten" style="margin-top:8px" onclick="redigerTreff(${e.id})">Endre</button>
            <button class="fare liten" style="margin-top:8px" onclick="slettTreff(${e.id})">Slett</button>` : ""}
        </div>
        <div class="smaa" style="margin-top:6px; font-size:12px">Lagt inn av ${esc(e.created_name || "–")}</div>
      </div>`;
    }

    function kalSkjemaHtml() {
      if (kalSkjema.type === "treff") {
        const e = kalSkjema.e || {};
        return `<div class="kort" id="kalskjema">
          <h2 style="margin-top:0">${e.id ? "Endre arrangement" : "Nytt arrangement"}</h2>
          <label for="t-tittel">Kva er det?</label>
          <input id="t-tittel" maxlength="120" placeholder="t.d. Sommartreff hos Eid MC" value="${esc(e.title || "")}">
          <div class="rad" style="align-items:flex-start">
            <div style="flex:1; min-width:140px"><label for="t-dato">Dato</label>${datoFelt("t-dato", e.dato || kalValt)}</div>
            <div style="flex:1; min-width:150px"><label for="t-time">Klokka (valfritt)</label>
              <div class="rad" style="flex-wrap:nowrap; gap:4px">
                <select id="t-time" style="margin-top:6px">${tidVal(24, 1, e.tid ? e.tid.slice(0, 2) : "")}</select>
                <b style="margin-top:6px">:</b>
                <select id="t-min" style="margin-top:6px">${tidVal(60, 5, e.tid ? e.tid.slice(3, 5) : "")}</select>
              </div></div>
          </div>
          <label for="t-til">Siste dag (om det varer fleire dagar)</label>
          ${datoFelt("t-til", e.til_dato || "")}
          <label for="t-arr">Kven arrangerer?</label>
          <input id="t-arr" maxlength="80" placeholder="t.d. Vikenes MC eller Eid MC" value="${esc(e.arranger || "")}">
          <label for="t-stad">Stad (valfritt)</label>
          <input id="t-stad" maxlength="120" value="${esc(e.place || "")}">
          <label for="t-lenkje">Lenkje (valfritt, https://…)</label>
          <input id="t-lenkje" placeholder="https://www.facebook.com/events/…" value="${esc(e.link || "")}">
          <label for="t-info">Meir info (valfritt)</label>
          <textarea id="t-info" rows="3" maxlength="2000">${esc(e.info || "")}</textarea>
          <div class="rad" style="margin-top:12px">
            <button onclick="lagreTreff(${e.id || "null"})">💾 Lagre</button>
            <button class="sekundar" onclick="kalSkjema=null; visKalender()">Avbryt</button>
          </div>
          <p id="k-melding" class="feil" style="margin-bottom:0"></p>
        </div>`;
      }
      const a = kalSkjema.a || {};
      return `<div class="kort" id="kalskjema">
        <h2 style="margin-top:0">${a.id ? "Endre fråvær" : "Legg inn fråvær"}</h2>
        <div class="jane">
          ${Object.entries(FRAVAER).map(([k, n]) => `<label style="flex:1; margin:0; background:#333; border-radius:8px; padding:10px; text-align:center; cursor:pointer">
            <input type="radio" name="f-type" value="${k}" ${(a.type || "jobb") === k ? "checked" : ""}> ${n}</label>`).join("")}
        </div>
        <div class="rad" style="align-items:flex-start">
          <div style="flex:1; min-width:140px"><label for="f-fra">Frå</label>${datoFelt("f-fra", a.fra || kalValt)}</div>
          <div style="flex:1; min-width:140px"><label for="f-til">Til og med</label>${datoFelt("f-til", a.til || kalValt)}</div>
        </div>
        <label for="f-note">Merknad (valfritt)</label>
        <input id="f-note" maxlength="200" placeholder="t.d. nattskift" value="${esc(a.note || "")}">
        <div class="rad" style="margin-top:12px">
          <button onclick="lagreFravaer(${a.id || "null"})">💾 Lagre</button>
          <button class="sekundar" onclick="kalSkjema=null; visKalender()">Avbryt</button>
        </div>
        <p id="k-melding" class="feil" style="margin-bottom:0"></p>
      </div>`;
    }

    // 24-timars klokke med eigne nedtrekkslister (nettlesaren kan elles vise AM/PM)
    function tidVal(maks, steg, valt) {
      let s = maks === 24 ? `<option value="">--</option>` : "";
      for (let i = 0; i < maks; i += steg) {
        const v = String(i).padStart(2, "0");
        s += `<option ${v === valt ? "selected" : ""}>${v}</option>`;
      }
      return s;
    }

    const kalFeil = { bad_title: "Skriv kva arrangementet heiter (2–120 teikn).", bad_dates: "Sjekk datoane.", bad_link: "Lenkja må starte med https://",
      too_long: "Fråvær kan vere maks eitt år om gongen.", not_allowed: "Berre den som la inn arrangementet, eller President/Vice President, kan endre det." };

    async function lagreTreff(id) {
      const v = k => document.getElementById(k).value;
      try {
        const tid = v("t-time") ? `${v("t-time")}:${v("t-min")}` : null;
        const dato = lesDato("t-dato"), til = lesDato("t-til");
        if (!dato || til === null) throw new Error("bad_dates");
        await rpc("event_save", { p_id: id, p_title: v("t-tittel"), p_dato: dato, p_tid: tid,
          p_til_dato: til || null, p_place: v("t-stad"), p_link: v("t-lenkje"), p_info: v("t-info"), p_arranger: v("t-arr") });
      } catch (e) { document.getElementById("k-melding").textContent = kalFeil[e.message] || e.message; return; }
      kalValt = lesDato("t-dato"); const d = new Date(kalValt + "T12:00:00"); kalMnd = new Date(d.getFullYear(), d.getMonth(), 1);
      kalSkjema = null; visKalender();
    }

    async function lagreFravaer(id) {
      const v = k => document.getElementById(k).value;
      const type = document.querySelector('input[name="f-type"]:checked')?.value;
      try {
        const fra = lesDato("f-fra"), til = lesDato("f-til");
        if (!fra || !til) throw new Error("bad_dates");
        await rpc("absence_save", { p_id: id, p_fra: fra, p_til: til, p_type: type, p_note: v("f-note") });
      }
      catch (e) { document.getElementById("k-melding").textContent = kalFeil[e.message] || e.message; return; }
      kalSkjema = null; visKalender();
    }

    function redigerTreff(id) { kalSkjema = { type: "treff", e: kalData.events.find(e => e.id === id) }; visKalender(); }

    async function slettTreff(id) {
      if (!confirm("Slette arrangementet? Svara blir òg sletta.")) return;
      try { await rpc("event_delete", { p_id: id }); } catch (e) { alert(kalFeil[e.message] || e.message); }
      visKalender();
    }

    async function slettFravaer(id) {
      if (!confirm("Slette fråværet?")) return;
      try { await rpc("absence_delete", { p_id: id }); } catch (e) { alert(e.message); }
      visKalender();
    }

    async function svarTreff(id, svar, kjelde) {
      let e;
      try { e = await rpc("event_answer", { p_id: id, p_svar: svar }); } catch (err) { return alert(err.message); }
      if (kjelde === "kal") return visKalender();
      // I chatten: oppdater alle treffkort for dette treffet
      document.querySelectorAll(`.treffkort[data-treff="${id}"]`).forEach(k => k.outerHTML = treffkortHtml(e));
    }

    async function delTreff(id) {
      if (!confirm("Dele arrangementet i chatten? Alle får varsel og kan svare Ja eller Nei.")) return;
      try {
        const mid = await rpc("event_share", { p_id: id });
        db.functions.invoke("chat-push", { body: { action: "send", message_id: mid } }).catch(() => {});
      } catch (e) { return alert(e.message); }
      visFane("chat");
    }

    function treffkortHtml(e) {
      return `<div class="treffkort" data-treff="${e.id}">
        <b>${esc(e.title)}</b><br><span class="dempa">${treffDato(e)}${e.place ? " · " + esc(e.place) : ""}</span>
        ${svarKnappar(e, "chat")}
      </div>`;
    }

    // ---------------- Regnskap (President og Treasurer) ----------------
    let regnAr = new Date().getFullYear();
    let regnData = null;
    let regnRediger = null;   // posten som blir endra, eller null
    // Klubben har berre éin bankkonto (ingen kontantar lenger)
    const KONTO = { bank: "Bank" };

    function kr(n) {
      return Number(n).toLocaleString("nb-NO", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " kr";
    }
    function idag() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
    // Norsk datoformat: DD/MM-ÅÅÅÅ
    function datoKort(iso) { if (!iso) return ""; const [y, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}-${y}`; }

    // Datofelt som alltid viser DD/MM-ÅÅÅÅ (nettlesaren sitt eige datofelt følgjer språket på mobilen)
    function datoFelt(id, iso) {
      return `<input id="${id}" class="datofelt" inputmode="numeric" maxlength="10" placeholder="DD/MM-ÅÅÅÅ"
        value="${iso ? datoKort(iso) : ""}" oninput="formaterDato(this)">`;
    }
    function formaterDato(el) {
      const s = el.value.replace(/\D/g, "").slice(0, 8);
      el.value = s.length > 4 ? `${s.slice(0, 2)}/${s.slice(2, 4)}-${s.slice(4)}` : s.length > 2 ? `${s.slice(0, 2)}/${s.slice(2)}` : s;
    }
    // Les datofeltet → ÅÅÅÅ-MM-DD, "" om tomt, null om ugyldig
    function lesDato(id) {
      const v = document.getElementById(id).value.trim();
      if (!v) return "";
      const m = v.match(/^(\d{1,2})\D(\d{1,2})\D(\d{4})$/);
      if (!m) return null;
      const d = new Date(+m[3], +m[2] - 1, +m[1]);
      if (d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1]) return null;
      return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    }

    async function visRegnskap() {
      try { regnData = await rpc("ledger_year", { p_year: regnAr }); }
      catch (e) { document.getElementById("fane").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      const r = regnData, p = regnRediger;
      const saldo = k => {
        const s = r.kontoar[k];
        return `<div class="saldo"><h3>${KONTO[k]}</h3>
          <div class="linje"><span>Inngåande 1.1.</span><span>${kr(s.inn_saldo)}</span></div>
          <div class="linje"><span>Inn ${r.year}</span><span style="color:var(--gronn)">${kr(s.inn)}</span></div>
          <div class="linje"><span>Ut ${r.year}</span><span style="color:var(--raud)">${kr(s.ut)}</span></div>
          <div class="linje sum"><span>Saldo 31.12.</span><span>${kr(s.ut_saldo)}</span></div></div>`;
      };
      document.getElementById("fane").innerHTML = `
        <div class="kort">
          <div class="rad" style="justify-content:space-between">
            <select style="width:auto; margin:0" onchange="regnAr = +this.value; regnRediger = null; visRegnskap()">
              ${r.years.map(y => `<option ${y === r.year ? "selected" : ""}>${y}</option>`).join("")}
            </select>
            <div class="rad">
              <button class="sekundar liten" onclick="lastNedRegnskap()">📥 Excel (CSV)</button>
              <button class="sekundar liten" onclick="skrivUtRegnskap()">🖨️ Skriv ut</button>
            </div>
          </div>
          <div style="margin-top:12px">${saldo("bank")}</div>
        </div>

        <div class="kort" id="regnskjema">
          <h2 style="margin-top:0">${p ? "Endre post" : "Ny post"}</h2>
          <div class="innut">
            <label><input type="radio" name="r-type" value="inn" ${p && p.belop > 0 ? "checked" : ""}><span>➕ Inn</span></label>
            <label><input type="radio" name="r-type" value="ut" ${!p || p.belop < 0 ? "checked" : ""}><span>➖ Ut</span></label>
          </div>
          <label for="r-belop">Beløp (kr)</label>
          <input id="r-belop" inputmode="decimal" placeholder="t.d. 249,90" value="${p ? String(Math.abs(p.belop)).replace(".", ",") : ""}">
          <label for="r-tekst">Kva gjeld det?</label>
          <input id="r-tekst" maxlength="200" placeholder="t.d. Kaffi og vaflar, Rema 1000" value="${esc(p ? p.tekst : "")}">
          <label for="r-dato">Dato</label>
          ${datoFelt("r-dato", p ? p.dato : idag())}
          <label for="r-kvittering">Kvittering (bilete eller PDF)${p && p.kvittering_path ? " – har alt ei, vel ny for å byte" : ""}</label>
          <input id="r-kvittering" type="file" accept="image/*,application/pdf" style="background:#222; color:#fff">
          <div class="rad" style="margin-top:12px">
            <button onclick="lagrePost()">💾 Lagre</button>
            ${p ? `<button class="sekundar" onclick="regnRediger = null; visRegnskap()">Avbryt</button>` : ""}
          </div>
          <p id="r-melding" class="feil" style="margin-bottom:0"></p>
        </div>

        <div class="kort">
          <h2 style="margin-top:0">Postar ${r.year} (${r.postar.length})</h2>
          ${r.postar.map(x => `
            <div class="post">
              <div class="tekst">${esc(x.tekst)}</div>
              <div class="belop ${x.belop > 0 ? "inn" : "ut"}">${x.belop > 0 ? "+" : "−"} ${kr(Math.abs(x.belop))}</div>
              <div class="meta">${datoKort(x.dato)}${x.created_name ? " · " + esc(x.created_name) : ""}</div>
              <div class="meta" style="text-align:right">${x.kvittering_path ? "📎 kvittering" : "⚠️ manglar kvittering"}</div>
              <div class="rad" style="grid-column: 1 / -1">
                ${x.kvittering_path ? `<button class="liten" onclick="opneDok('${esc(x.kvittering_path)}')">Sjå kvittering</button>` : ""}
                <button class="sekundar liten" onclick="redigerPost(${x.id})">Endre</button>
                <button class="fare liten" onclick="slettPost(${x.id})">Slett</button>
              </div>
            </div>`).join("") || '<p class="dempa" style="margin:0">Ingen postar i år enno.</p>'}
        </div>`;
    }

    function redigerPost(id) {
      regnRediger = regnData.postar.find(x => x.id === id) || null;
      visRegnskap().then(() => document.getElementById("regnskjema").scrollIntoView({ behavior: "smooth" }));
    }

    // Gjer store mobilbilete mindre (maks 1800 px) så lagringsplassen held lenge
    async function krympBilete(fil) {
      if (!fil.type.startsWith("image/") || fil.size < 1.2 * 1024 * 1024) return fil;
      try {
        const bmp = await createImageBitmap(fil);
        const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
        const c = document.createElement("canvas");
        c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
        c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
        const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
        return blob ? new File([blob], fil.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" }) : fil;
      } catch (e) { return fil; }
    }

    async function lagrePost() {
      const feil = t => { document.getElementById("r-melding").textContent = t; };
      const type = document.querySelector('input[name="r-type"]:checked')?.value;
      const belop = parseFloat(document.getElementById("r-belop").value.replace(/\s/g, "").replace(",", "."));
      const tekst = document.getElementById("r-tekst").value.trim();
      const dato = lesDato("r-dato");
      const konto = "bank";
      let fil = document.getElementById("r-kvittering").files[0];
      if (!type) return feil("Vel Inn eller Ut.");
      if (!(belop > 0)) return feil("Skriv eit beløp større enn 0.");
      if (tekst.length < 2) return feil("Skriv kva posten gjeld.");
      if (!dato) return feil("Vel dato.");
      feil("Lagrar …");
      let sti = null, namn = null;
      if (fil) {
        fil = await krympBilete(fil);
        if (fil.size > 25 * 1024 * 1024) return feil("Kvitteringa er større enn 25 MB.");
        sti = `regnskap/kvitteringar/${Date.now()}-${trygtNamn(fil.name)}`;
        namn = fil.name;
        const { error } = await db.storage.from("arkiv").upload(sti, fil, { contentType: fil.type || "application/octet-stream" });
        if (error) return feil("Klarte ikkje å laste opp kvitteringa: " + error.message);
      }
      const gammal = regnRediger && sti ? regnRediger.kvittering_path : null;
      try {
        await rpc("ledger_save", { p_id: regnRediger ? regnRediger.id : null, p_dato: dato, p_konto: konto, p_tekst: tekst,
          p_belop: type === "ut" ? -belop : belop, p_kvittering_path: sti, p_kvittering_namn: namn });
      } catch (e) {
        if (sti) await db.storage.from("arkiv").remove([sti]);
        return feil({ bad_amount: "Ugyldig beløp.", bad_text: "Teksten må vere 2–200 teikn.", not_allowed: "Berre President og Treasurer kan føre regnskap." }[e.message] || e.message);
      }
      if (gammal) await db.storage.from("arkiv").remove([gammal]);
      regnAr = +dato.slice(0, 4);
      regnRediger = null;
      visRegnskap();
    }

    async function slettPost(id) {
      const x = regnData.postar.find(p => p.id === id);
      if (!confirm(`Slette «${x ? x.tekst : "posten"}» for godt? Kvitteringa blir òg sletta.`)) return;
      try {
        const sti = await rpc("ledger_delete", { p_id: id });
        if (sti) await db.storage.from("arkiv").remove([sti]);
      } catch (e) { alert(e.message); }
      visRegnskap();
    }

    function lastNedRegnskap() {
      const r = regnData;
      const csvFelt = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const tal = n => Number(n).toFixed(2).replace(".", ",");
      const linjer = [["Dato", "Tekst", "Inn", "Ut", "Kvittering", "Ført av"].map(csvFelt).join(";")];
      for (const x of [...r.postar].reverse()) {
        linjer.push([datoKort(x.dato), x.tekst, x.belop > 0 ? tal(x.belop) : "", x.belop < 0 ? tal(-x.belop) : "",
                     x.kvittering_namn || (x.kvittering_path ? "ja" : "MANGLAR"), x.created_name || ""].map(csvFelt).join(";"));
      }
      linjer.push("");
      for (const k of ["bank"]) {
        const s = r.kontoar[k];
        linjer.push([`${KONTO[k]}: inngåande ${tal(s.inn_saldo)}`, `inn ${tal(s.inn)}`, `ut ${tal(-s.ut)}`, `saldo 31.12. ${tal(s.ut_saldo)}`].map(csvFelt).join(";"));
      }
      const blob = new Blob(["﻿" + linjer.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `regnskap-vikenes-mc-${r.year}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
    }

    function skrivUtRegnskap() {
      const r = regnData;
      const rader = [...r.postar].reverse().map(x => `<tr><td>${datoKort(x.dato)}</td><td>${esc(x.tekst)}</td>
        <td class="t">${x.belop > 0 ? kr(x.belop) : ""}</td><td class="t">${x.belop < 0 ? kr(-x.belop) : ""}</td>
        <td>${x.kvittering_path ? "✔" : "MANGLAR"}</td></tr>`).join("");
      const saldo = ["bank"].map(k => { const s = r.kontoar[k];
        return `<tr><td>${KONTO[k]}</td><td class="t">${kr(s.inn_saldo)}</td><td class="t">${kr(s.inn)}</td><td class="t">${kr(-s.ut)}</td><td class="t"><b>${kr(s.ut_saldo)}</b></td></tr>`; }).join("");
      const w = window.open("", "_blank");
      if (!w) return alert("Nettlesaren stoppa utskriftsvindauget. Tillat sprettoppvindauge og prøv igjen.");
      w.document.write(`<!DOCTYPE html><html lang="no"><head><meta charset="utf-8"><title>Regnskap Vikenes MC ${r.year}</title>
        <style>body{font-family:Arial,sans-serif;margin:24px;color:#000} h1{margin:0 0 4px} table{border-collapse:collapse;width:100%;margin:12px 0 24px;font-size:13px}
        th,td{border:1px solid #999;padding:5px 7px;text-align:left} th{background:#eee} .t{text-align:right;white-space:nowrap}</style></head><body>
        <h1>Regnskap – Vikenes MC</h1><div>År ${r.year} · utskrive ${datoKort(idag())}</div>
        <h2>Saldo</h2><table><tr><th>Konto</th><th>Inngåande 1.1.</th><th>Inn</th><th>Ut</th><th>Saldo 31.12.</th></tr>${saldo}</table>
        <h2>Postar</h2><table><tr><th>Dato</th><th>Tekst</th><th>Inn</th><th>Ut</th><th>Kvittering</th></tr>${rader}</table>
        <script>window.onload=()=>window.print()<\/script></body></html>`);
      w.document.close();
    }

    // ---------------- Gjestebok (President, Vice President, Secretary) ----------------
    async function oppdaterGjestetal() {
      try {
        const n = await rpc("guestbook_pending_count");
        const el = document.getElementById("g-tal");
        if (el) el.textContent = n ? ` (${n})` : "";
      } catch (e) { /* ikkje kritisk */ }
    }

    async function visGjestebok() {
      let liste, ukjende = [];
      try { [liste, ukjende] = await Promise.all([rpc("guestbook_all"), rpc("unknown_clubs")]); }
      catch (e) { document.getElementById("fane").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      const ventar = liste.filter(h => h.status === "pending");
      const godkjende = liste.filter(h => h.status === "approved");
      const kort = h => `
        <div class="medlem">
          <div class="namn">${esc(h.name)}${h.club_name ? ` <span style="color:var(--oransje); font-weight:normal">· ${esc(h.club_name)}</span>` : ""}
            <span class="dempa" style="font-weight:normal; font-size:14px">${esc(dato(h.created_at))}</span></div>
          <div style="white-space:pre-line; margin-top:4px">${esc(h.message)}</div>
          <div class="rad">
            ${h.status === "pending" ? `<button onclick="godkjennHelsing(${h.id})">Godkjenn</button>` : ""}
            <button class="${h.status === "pending" ? "sekundar" : "fare"}" onclick="slettHelsing(${h.id})">Slett</button>
          </div>
        </div>`;
      document.getElementById("fane").innerHTML = `
        ${ukjende.length ? `<div class="kort" style="border-top-color:var(--gul)">
          <h2 style="margin-top:0">Nye klubbar som har sjekka inn (${ukjende.length})</h2>
          <p class="dempa" style="margin-top:0">Desse er ikkje under «Klubbar i nærområdet» enno. Send namn, stad og logo
            til den som held nettsida, og trykk «Ordna» når klubben er lagd til.</p>
          ${ukjende.map(k => `<div class="medlem">
              <div class="namn">${esc(k.club_name)}</div>
              <div class="info">${k.count} innsjekk · sist ${esc(dato(k.last))}</div>
              <div class="rad"><button class="sekundar" data-klubb="${esc(k.club_name)}" onclick="ukjendOrdna(this.dataset.klubb)">Ordna</button></div>
            </div>`).join("")}
        </div>` : ""}
        <div class="kort" style="border-top-color:var(--gul)">
          <h2 style="margin-top:0">Ventar på godkjenning (${ventar.length})</h2>
          ${ventar.map(kort).join("") || '<p class="dempa">Ingen nye helsingar.</p>'}
        </div>
        <div class="kort">
          <h2 style="margin-top:0">Synlege på framsida (${godkjende.length})</h2>
          ${godkjende.map(kort).join("") || '<p class="dempa">Ingen enno.</p>'}
        </div>`;
      oppdaterGjestetal();
    }

    async function ukjendOrdna(namn) {
      if (!confirm(`Merke «${namn}» som ordna?`)) return;
      try { await rpc("unknown_club_handled", { p_club_name: namn }); } catch (e) { alert(e.message); }
      visGjestebok();
    }

    async function godkjennHelsing(id) {
      try { await rpc("guestbook_approve", { p_id: id }); } catch (e) { alert(e.message); }
      visGjestebok();
    }

    async function slettHelsing(id) {
      if (!confirm("Slette helsinga for godt?")) return;
      try { await rpc("guestbook_delete", { p_id: id }); } catch (e) { alert(e.message); }
      visGjestebok();
    }

    start();
  </script>
</body>
</html>
