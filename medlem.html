                  ${b.mine || meg.styre || s.can_pay ? `<button class="fare liten" onclick="fjernLagring(${b.id})">Fjern</button>` : ""}
                </div>
              </div>`).join("") || '<p class="dempa" style="margin:0">Ingen syklar meldt inn enno.</p>'}
          </div>
          ${s.can_pay ? `<div class="kort">
            <h2 style="margin-top:0">Legg inn sykkel som skal betalast</h2>
            <p class="dempa" style="margin-top:0">Fulle medlemmer og Prospect sin første sykkel er gratis og blir ikkje skrivne inn.</p>
            <label for="u-type">Kven gjeld det?</label>
            <select id="u-type">
              <option value="ute">Utanfor klubben – 1800 kr (må godkjennast av styret, 5.3)</option>
              <option value="hangaround">Hangaround – 1000 kr</option>
              <option value="prospect2">Prospect, sykkel nr. 2 – 1000 kr</option>
            </select>
            <label for="u-namn">Namn på eigar</label><input id="u-namn" maxlength="80">
            <label for="u-mc">Motorsykkel (merke og modell)</label><input id="u-mc" maxlength="100">
            <label for="u-reg">Reg.nr.</label><input id="u-reg" maxlength="10">
            <label style="display:flex; gap:8px; align-items:center; margin-top:8px; cursor:pointer">
              <input type="checkbox" id="u-fors" style="width:22px; height:22px; margin:0; accent-color:var(--oransje)">
              Sykkelen har gyldig lagringsforsikring med brannforsikring (5.2)</label>
            <button style="margin-top:10px" onclick="meldLagringGjest()">Legg inn</button>
          </div>` : ""}`;
        } else if (khDel === "brygging") {
          fane.innerHTML = meny + `<div class="kort">
            <h2 style="margin-top:0">🍺 Brygging</h2>
            ${reglarHtml([6])}
            <p class="dempa" style="margin-bottom:0">Bruk av bryggeutstyret skjer etter avtale med bryggeansvarleg (6.2).</p>
          </div>
          ${feilmeldingHtml("brygging", "⚠️ Meld skade eller feil på bryggeutstyr", "t.d. termometeret viser feil", [])}`;
        } else {
          fane.innerHTML = meny + `<div class="kort">
            <h2 style="margin-top:0">📜 Husreglar for Vikenes MC</h2>
            ${HUSREGLAR.map(([t, p]) => `<h3>${esc(t)}</h3><p>${p.map(esc).join("<br>")}</p>`).join("")}
          </div>`;
        }
      } catch (e) { fane.innerHTML = meny + `<p class="feil">${esc(e.message)}</p>`; }
    }

    // Feilmelding blir ei hastesak til styret (sjå fana «Saker»), med pushvarsel
    function feilmeldingHtml(kvar, tittel, hint, kapittel) {
      return `<div class="kort">
        <h2 style="margin-top:0">${tittel}</h2>
        ${kapittel.length ? reglarHtml(kapittel) : ""}
        <textarea id="f-${kvar}" rows="3" maxlength="2000" placeholder="${esc(hint)}"></textarea>
        <button style="margin-top:8px" onclick="meldFeil('${kvar}')">Send til styret</button>
        <p class="dempa" style="font-size:13px; margin-bottom:0">Styret får varsel med ein gong. Meldinga ligg under «Saker → Til styret».</p>
      </div>`;
    }

    async function meldFeil(kvar) {
      const t = document.getElementById("f-" + kvar).value.trim();
      if (t.length < 3) return alert("Skriv kva som er feil.");
      const tekst = (kvar === "verkstad" ? "🔧 Verkstad: " : "🍺 Bryggeutstyr: ") + t;
      try {
        const id = await rpc("agm_case_submit", { p_body: tekst, p_anonymous: false, p_target: "styret" });
        db.functions.invoke("chat-push", { body: { action: "sak", case_id: id } }).catch(() => {});
        alert("Sendt til styret. Takk!");
      } catch (e) { return alert(e.message); }
      visKlubbhus();
    }

    // ---- Lager (Bar og Kjøkken): varer med maks, teljing og «Må handlast» ----
    function lagerHtml(omr, b) {
      const mangel = b.items.filter(i => i.need > 0);
      const sist = b.items.filter(i => i.counted_at).sort((x, y) => y.counted_at.localeCompare(x.counted_at))[0];
      const fullTekst = omr === "bar" ? "Ingenting manglar – baren er full 🍻" : "Ingenting manglar på kjøkkenet 👍";
      const hint = omr === "bar" ? "t.d. Tuborg 0,33, Potetgull salt" : "t.d. Kaffi, Pappkrus, Oppvaskmiddel";
      let kat = "";
      return `<div class="kort" style="border-top-color:${mangel.length ? "var(--gul)" : ""}">
          <h2 style="margin-top:0">🛒 Må handlast (${mangel.length})</h2>
          ${mangel.map(i => `<div class="komande" style="cursor:default">
              <div style="flex:1; min-width:0"><b>Kjøp ${i.need} ${esc(i.unit)} ${esc(i.name)}</b>
                <div class="smaa">har ${i.count_qty} av ${i.max_qty}</div></div>
              <button class="liten" onclick="barHandla(${i.id}, '${esc(i.name).replace(/'/g, "")}')">✔ Handla</button>
            </div>`).join("") || `<p class="dempa" style="margin:0">${b.items.length ? fullTekst : "Ingen varer lagt inn enno."}</p>`}
          ${sist ? `<p class="smaa" style="margin-bottom:0">Sist talt ${datoKort(sist.counted_at)} av ${esc(sist.counted_by_name || "–")}</p>` : ""}
        </div>

        ${b.items.length ? `<div class="kort">
          <h2 style="margin-top:0">📋 Lagerteljing</h2>
          <p class="dempa" style="margin-top:0">Skriv kor mange som står på lageret no, og trykk «Lagre teljing». Tomme felt blir ikkje endra.</p>
          ${b.items.map(i => {
            const topp = i.category !== kat ? `<h3 style="margin:14px 0 4px">${esc(i.category)}</h3>` : "";
            kat = i.category;
            return topp + `<div class="komande" style="cursor:default">
              <div style="flex:1; min-width:0"><b>${esc(i.name)}</b><div class="smaa">maks ${i.max_qty} ${esc(i.unit)}${i.count_qty !== null ? " · sist " + i.count_qty : ""}</div></div>
              <input type="number" inputmode="numeric" min="0" class="bar-tal" data-id="${i.id}" placeholder="${i.count_qty ?? ""}"
                style="width:80px; margin:0; text-align:center">
              ${b.can_edit ? `<button class="sekundar liten" onclick="barRediger(${i.id})">✏️</button>` : ""}
            </div>`;
          }).join("")}
          <button style="margin-top:12px" onclick="barLagreTeljing()">💾 Lagre teljing</button>
        </div>` : ""}

        ${b.can_edit ? `<div class="kort" id="bar-skjema">
          <h2 style="margin-top:0">${barRedigerer ? "Endre vare" : "＋ Ny vare"}</h2>
          <label for="v-namn">Namn</label><input id="v-namn" maxlength="60" placeholder="${hint}">
          <div class="rad" style="align-items:flex-start">
            <div style="flex:1; min-width:120px"><label for="v-kat">Kategori</label>
              <select id="v-kat">${b.categories.map(k => `<option>${esc(k)}</option>`).join("")}</select></div>
            <div style="flex:1; min-width:90px"><label for="v-maks">Maks tal</label><input id="v-maks" type="number" inputmode="numeric" min="1"></div>
            <div style="flex:1; min-width:90px"><label for="v-eining">Eining</label><input id="v-eining" maxlength="20" value="stk" placeholder="stk, kasse, pose"></div>
          </div>
          <div class="rad" style="margin-top:10px">
            <button onclick="barLagreVare()">💾 Lagre vare</button>
            ${barRedigerer ? `<button class="sekundar" onclick="barRedigerer=null; visKlubbhus()">Avbryt</button>
              <button class="fare" onclick="barSlettVare()">Slett vare</button>` : ""}
          </div>
        </div>` : ""}`;
    }
    let barRedigerer = null;
    function barRediger(id) { barRedigerer = id; visKlubbhus(); }
    async function barLagreTeljing() {
      const tal = [...document.querySelectorAll(".bar-tal")].filter(f => f.value !== "")
        .map(f => ({ id: +f.dataset.id, count: Math.max(0, Math.round(+f.value)) }));
      if (!tal.length) return alert("Skriv inn minst eitt tal.");
      try { await rpc("bar_count", { p_counts: tal }); } catch (e) { return alert(e.message); }
      await visKlubbhus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    async function barHandla(id, namn) {
      if (!confirm(`Har du handla ${namn}? Lageret blir sett til maks.`)) return;
      try { await rpc("bar_bought", { p_id: id }); } catch (e) { alert(e.message); }
      visKlubbhus();
    }
    async function barLagreVare() {
      try {
        await rpc("bar_item_save", { p_id: barRedigerer, p_name: document.getElementById("v-namn").value,
          p_category: document.getElementById("v-kat").value, p_max: +document.getElementById("v-maks").value || null,
          p_unit: document.getElementById("v-eining").value, p_area: khDel });
      } catch (e) {
        return alert({ bad_text: "Skriv namnet på vara.", bad_max: "Skriv maks tal (minst 1)." }[e.message] || e.message);
      }
      barRedigerer = null;
      visKlubbhus();
    }
    async function barSlettVare() {
      if (!confirm("Slette vara frå baren?")) return;
      try { await rpc("bar_item_delete", { p_id: barRedigerer }); } catch (e) { alert(e.message); }
      barRedigerer = null;
      visKlubbhus();
    }

    async function leggTilVare() {
      const f = document.getElementById("h-vare");
      if (!f.value.trim()) return;
      try { await rpc("shop_add", { p_item: f.value }); } catch (e) { return alert(e.message); }
      await visKlubbhus();
      document.getElementById("h-vare")?.focus();
    }
    async function handla(id) {
      try { await rpc("shop_done", { p_id: id }); } catch (e) { alert(e.message); }
      visKlubbhus();
    }
    async function laan() {
      const t = document.getElementById("l-ting").value.trim();
      if (t.length < 2) return alert("Skriv kva du lånar.");
      try { await rpc("loan_add", { p_item: t }); } catch (e) { return alert(e.message); }
      visKlubbhus();
    }
    async function levert(id) {
      try { await rpc("loan_return", { p_id: id }); } catch (e) { alert(e.message); }
      visKlubbhus();
    }
    async function meldLagring() {
      if (!document.getElementById("g-fors").checked) return alert("Sykkelen må ha lagringsforsikring med brannforsikring (husregel 5.2).");
      try {
        await rpc("storage_add", { p_bike: document.getElementById("g-mc").value, p_reg_nr: document.getElementById("g-reg").value,
          p_owner_note: document.getElementById("g-eigar").value, p_insured: true });
      } catch (e) {
        return alert({ max_bikes: meg.role === "Hangaround" ? "Hangaround kan lagre éin sykkel." : "Du kan lagre maks to syklar (husregel 5.1).",
                       bad_text: "Skriv merke og modell.", not_insured: "Sykkelen må ha lagringsforsikring." }[e.message] || e.message);
      }
      visKlubbhus();
    }
    async function meldLagringGjest() {
      if (!document.getElementById("u-fors").checked) return alert("Sykkelen må ha lagringsforsikring med brannforsikring (husregel 5.2).");
      try {
        await rpc("storage_add_guest", { p_name: document.getElementById("u-namn").value, p_bike: document.getElementById("u-mc").value,
          p_reg_nr: document.getElementById("u-reg").value, p_insured: true, p_kind: document.getElementById("u-type").value });
      } catch (e) { return alert(e.message === "bad_text" ? "Skriv namn og motorsykkel." : e.message); }
      visKlubbhus();
    }
    async function settBetalt(id, ja) {
      try { await rpc("storage_set_paid", { p_id: id, p_paid: ja }); } catch (e) { alert(e.message); }
      visKlubbhus();
    }
    async function fjernLagring(id) {
      if (!confirm("Fjerne sykkelen frå lagringslista?")) return;
      try { await rpc("storage_remove", { p_id: id }); } catch (e) { alert(e.message); }
      visKlubbhus();
    }

    // ---------------- Styregodkjenning ----------------
    async function lastForslag(boksId, visTom) {
      const boks = document.getElementById(boksId);
      if (!boks) return;
      let f;
      try { f = await rpc("member_changes_open"); } catch (e) { return; }
      if (!f.length) {
        boks.innerHTML = visTom ? `<div class="kort"><h2 style="margin-top:0">Til styret</h2>
          <p class="dempa" style="margin:0">Ingen forslag ventar på godkjenning.</p></div>` : "";
        return;
      }
      boks.innerHTML = `<div class="kort" style="border-top-color:var(--gul)">
        <h2 style="margin-top:0">Til styret (${f.length})</h2>
        <p class="dempa" style="margin-top:0">Endringa trer i kraft når alle i styret har sagt ja. Éin nei stoppar ho.</p>
        ${f.map(x => `<div class="medlem">
          <div class="namn">${x.kind === "remove" ? "Slette " + esc(x.member_name)
                                                  : esc(x.member_name) + ": " + esc(x.member_role) + " → " + esc(x.new_role)}</div>
          <div class="info">Foreslått av ${esc(x.proposed_name || "–")}</div>
          <div class="info">${x.voters.map(v => `${v.yes === true ? "✅" : v.yes === false ? "❌" : "⏳"} ${esc(v.name)}`).join(" · ")}</div>
          <div class="rad" style="margin-top:6px">
            ${x.can_vote ? `<button class="liten" onclick="svarForslag(${x.id}, true)" ${x.my_vote === true ? "disabled" : ""}>👍 Godkjenn</button>
                            <button class="fare liten" onclick="svarForslag(${x.id}, false)">👎 Nei</button>` : ""}
            ${x.can_cancel ? `<button class="sekundar liten" onclick="trekkForslag(${x.id})">Trekk forslaget</button>` : ""}
          </div>
        </div>`).join("")}
      </div>`;
    }

    async function svarForslag(id, ja) {
      if (!ja && !confirm("Seie nei? Då blir forslaget stoppa.")) return;
      try {
        const s = await rpc("member_change_vote", { p_change: id, p_yes: ja });
        if (s === "applied") alert("Alle i styret har sagt ja – endringa er gjennomført.");
        if (s === "rejected") alert("Forslaget er stoppa.");
      } catch (e) { alert(e.message === "closed" ? "Forslaget er alt avgjort." : e.message); }
      visFane(aktivFane);
    }

    async function trekkForslag(id) {
      if (!confirm("Trekkje forslaget?")) return;
      try { await rpc("member_change_cancel", { p_change: id }); } catch (e) { alert(e.message); }
      visFane(aktivFane);
    }

    // Rediger-knappen: byte tittel eller slette (blir forslag til styret)
    function visRediger(id) {
      const m = liste.find(x => x.id === id);
      if (!m) return;
      const bak = document.createElement("div");
      bak.className = "modal-bak";
      bak.innerHTML = `<div class="modal" style="text-align:left">
        <h2 style="margin-top:0">${esc(m.name)}</h2>
        <p class="dempa" style="margin-top:0">No: ${esc(m.role)}</p>
        <label for="rolle-${m.id}">Ny tittel</label>
        ${rolleVal(m.id, m.role)}
        <button style="margin-top:8px" onclick="foreslaa('${m.id}', 'role')">Send ny tittel til styret</button>
        <hr style="border:0; border-top:1px solid #333; margin:18px 0">
        <button class="fare" onclick="foreslaa('${m.id}', 'remove')">🗑️ Slett frå klubben</button>
        <p class="dempa" style="font-size:13px">Personen mister tilgangen til medlemssida. Alle i styret må godkjenne først.</p>
        <button class="sekundar stor" onclick="this.closest('.modal-bak').remove()">Lukk</button>
      </div>`;
      document.body.appendChild(bak);
    }

    async function foreslaa(id, kind) {
      const m = liste.find(x => x.id === id);
      const rolle = kind === "role" ? document.getElementById("rolle-" + id).value : null;
      if (kind === "remove" && !confirm(`Foreslå å slette ${m.name} frå klubben?`)) return;
      try {
        const r = await rpc("member_change_propose", { p_member: id, p_kind: kind, p_role: rolle });
        document.querySelector(".modal-bak")?.remove();
        if (r.status === "applied") alert("Gjennomført (ingen andre i styret treng å godkjenne).");
        else {
          db.functions.invoke("chat-push", { body: { action: "styre", change_id: r.id } }).catch(() => {});
          alert("Sendt til styret. Endringa trer i kraft når alle har godkjent.");
        }
      } catch (e) {
        alert({ not_allowed: "Du har ikkje tilgang til medlemsregisteret.", not_self: "Du kan ikkje endre deg sjølv.",
                same_role: "Personen har alt den tittelen." }[e.message] || e.message);
      }
      visFane("medlemmer");
    }

    // President: tilgangsregister – kven slepp inn kvar
    const OMRADE = [
      ["quiz_admin", "Quiz-admin"],
      ["medlemsregister", "Medlemsregister"],
      ["nyheiter", "Nyheiter og gjestebok"],
      ["arkiv", "Arkiv (laste opp)"],
      ["regnskap", "Regnskap"],
    ];
    async function lastTilgang() {
      const boks = document.getElementById("tilgang-liste");
      if (!boks) return;
      let rader;
      try { rader = await rpc("access_list"); }
      catch (e) { boks.textContent = "Feil: " + e.message; return; }
      boks.className = "";
      boks.innerHTML = `<div style="overflow-x:auto"><table class="tilgang">
        <tr><th></th>${OMRADE.map(([, n]) => `<th>${esc(n)}</th>`).join("")}</tr>
        ${rader.map(r => `<tr><td><b>${esc(r.name)}</b><br><span class="dempa" style="font-size:13px">${esc(r.role)}</span></td>
          ${r.role === "President"
            ? `<td colspan="${OMRADE.length}" class="dempa">Alt (President)</td>`
            : OMRADE.map(([k]) => `<td><input type="checkbox" ${r.areas.includes(k) ? "checked" : ""}
                onchange="settTilgang('${r.id}','${k}',this)"></td>`).join("")}</tr>`).join("")}
      </table></div>`;
    }
    async function settTilgang(id, omrade, boks) {
      boks.disabled = true;
      try { await rpc("access_set", { p_member: id, p_area: omrade, p_allowed: boks.checked }); }
      catch (e) { boks.checked = !boks.checked; alert(e.message); }
      boks.disabled = false;
    }

    // President: vis QR-kode som nye medlemmer skannar for å lage konto
    async function visInvitasjon() {
      let inv;
      try { inv = await rpc("invite_create"); }
      catch (e) { return alert(e.message === "not_allowed" ? "Berre President kan lage QR-kode for nye medlemmer." : e.message); }
      const url = BASE_URL + "medlem.html?ny=" + encodeURIComponent(inv.token);
      const bak = document.createElement("div");
      bak.className = "modal-bak";
      bak.innerHTML = `<div class="modal">
        <h2 style="margin-top:0">Ny medlem i Vikenes MC</h2>
        <p class="dempa" style="margin:0">Skann med mobilkameraet</p>
        <div class="qr-boks" id="inv-qr"></div>
        <p class="dempa" style="font-size:14px">Gjeld til ${new Date(inv.expires_at).toLocaleString("nb-NO", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</p>
        <button class="stor" onclick="this.closest('.modal-bak').remove()">Lukk</button>
      </div>`;
      document.body.appendChild(bak);
      new QRCode(document.getElementById("inv-qr"), { text: url, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
    }

    async function sett(id, status, verb) {
      const m = liste.find(x => x.id === id);
      if (verb && !confirm(verb + " " + (m ? m.name : "") + "?")) return;
      const rolle = document.getElementById("rolle-" + id).value;
      try {
        await rpc("member_set", { p_id: id, p_role: rolle, p_status: status });
      } catch (e) {
        const t = { not_allowed: "Berre President og Vice President kan gjere dette.",
                    not_self: "Du kan ikkje endre deg sjølv." }[e.message] || e.message;
        alert(t);
      }
      visFane("medlemmer");
    }

    // ---------------- Nyheiter (President, Vice President, Secretary) ----------------
    let nyheiter = [];
    let redigerer = null;   // id på saka som blir redigert, "ny" for ny sak

    function dato(iso) {
      return iso ? new Date(iso).toLocaleDateString("nb-NO", { day: "numeric", month: "long", year: "numeric" }) : "";
    }

    async function visNyheiter() {
      try { nyheiter = await rpc("news_all"); }
      catch (e) { document.getElementById("fane").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      const sak = redigerer === "ny" ? {} : nyheiter.find(n => n.id === redigerer);
      document.getElementById("fane").innerHTML = (redigerer !== null && sak) ? nyheitSkjema(sak) : `
        <div class="kort">
          <p class="dempa" style="margin-top:0">Publiserte saker kjem rett på framsida (dei 10 nyaste).</p>
          <button class="stor" onclick="redigerer='ny'; visNyheiter()">+ Skriv ny sak</button>
        </div>
        ${nyheiter.map(n => `
          <div class="kort" style="${n.published ? "" : "border-top-color:#555"}">
            <div class="rad" style="justify-content:space-between">
              <b>${esc(n.title)}</b>
              ${n.published ? `<span class="merke gronn">Publisert ${esc(dato(n.published_at))}</span>`
                            : `<span class="merke">Kladd</span>`}
            </div>
            <p class="dempa" style="white-space:pre-line; margin-bottom:0">${esc(n.body.length > 200 ? n.body.slice(0, 200) + " …" : n.body)}</p>
            <p class="dempa" style="font-size:14px">Skriven av ${esc(n.author_name || "–")}</p>
            <button class="sekundar liten" onclick="redigerer=${n.id}; visNyheiter()">Rediger</button>
          </div>`).join("") || '<p class="dempa">Ingen saker enno.</p>'}`;
    }

    function nyheitSkjema(n) {
      return `
        <div class="kort">
          <h2 style="margin-top:0">${n.id ? "Rediger sak" : "Ny sak"}</h2>
          <label for="n-tittel">Overskrift</label>
          <input id="n-tittel" maxlength="120" value="${esc(n.title || "")}">
          <label for="n-tekst">Tekst</label>
          <textarea id="n-tekst" rows="8" maxlength="5000">${esc(n.body || "")}</textarea>
          <label for="n-lenkje">Lenkje (valfritt) – t.d. #quiz, quiz.html eller https://…</label>
          <input id="n-lenkje" value="${esc(n.link_url || "")}" placeholder="quiz.html">
          <label for="n-lenkjetekst">Tekst på knappen (valfritt)</label>
          <input id="n-lenkjetekst" value="${esc(n.link_text || "")}" placeholder="Meld deg på">
          <div class="rad" style="margin-top:16px">
            <button onclick="lagreNyheit(${n.id || "null"}, true)">${n.published ? "Lagre" : "Publiser"}</button>
            <button class="sekundar" onclick="lagreNyheit(${n.id || "null"}, false)">${n.published ? "Gjer om til kladd" : "Lagre som kladd"}</button>
            <button class="sekundar" onclick="redigerer=null; visNyheiter()">Avbryt</button>
            ${n.id ? `<button class="fare" onclick="slettNyheit(${n.id})">Slett</button>` : ""}
          </div>
          <p id="n-feil" class="feil"></p>
        </div>`;
    }

    async function lagreNyheit(id, publiser) {
      const v = k => document.getElementById(k).value;
      try {
        await rpc("news_save", { p_id: id, p_title: v("n-tittel"), p_body: v("n-tekst"),
          p_link_url: v("n-lenkje"), p_link_text: v("n-lenkjetekst"), p_published: publiser });
      } catch (e) {
        const t = { bad_title: "Overskrifta må vere 2–120 teikn.", bad_body: "Teksten er for lang.",
                    bad_link: "Lenkja må starte med https://, vere ei side her (t.d. quiz.html) eller ein bolk på framsida (t.d. #quiz).",
                    not_allowed: "Berre President, Vice President og Secretary kan skrive nyheiter." }[e.message] || e.message;
        document.getElementById("n-feil").textContent = t;
        return;
      }
      redigerer = null;
      visNyheiter();
    }

    async function slettNyheit(id) {
      if (!confirm("Slette saka for godt?")) return;
      try { await rpc("news_delete", { p_id: id }); } catch (e) { alert(e.message); }
      redigerer = null;
      visNyheiter();
    }

    // ---------------- Arkiv / dokument ----------------
    const MAPPER = [
      { id: "reglar", namn: "📜 Retningslinjer / Reglar" },
      { id: "vedtekter", namn: "⚖️ Vedtekter" },
      { id: "hus-lokale", namn: "🏠 Hus / Lokale" },
      { id: "arsmote", namn: "🗳️ Årsmøte" },
      { id: "regnskap", namn: "💰 Regnskap", berreRegnskap: true },
    ];
    let aktivMappe = "reglar";

    function kanSkrive(mappe) {
      return mappe === "regnskap" ? !!meg.regnskap : !!meg.arkiv;
    }
    function storleik(b) {
      if (!b && b !== 0) return "";
      return b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + " kB" : (b / 1024 / 1024).toFixed(1).replace(".", ",") + " MB";
    }

    async function visArkiv() {
      const mapper = MAPPER.filter(m => !m.berreRegnskap || meg.regnskap);
      if (!mapper.some(m => m.id === aktivMappe)) aktivMappe = mapper[0].id;
      document.getElementById("fane").innerHTML = `
        <div class="kort">
          <label for="mappeval" style="margin-top:0">Mappe</label>
          <select id="mappeval" onchange="aktivMappe = this.value; visArkiv()">
            ${mapper.map(m => `<option value="${m.id}" ${m.id === aktivMappe ? "selected" : ""}>${m.namn}</option>`).join("")}
          </select>
          ${kanSkrive(aktivMappe) ? `
            <div style="margin-top:16px">
              <label for="arkivfil" style="margin-top:0">Last opp dokument (maks 25 MB)</label>
              <input type="file" id="arkivfil" multiple style="background:#222; color:#fff">
              <button onclick="lastOppDok()">⬆️ Last opp</button>
              <p id="arkivstatus" class="dempa" style="margin-bottom:0"></p>
            </div>` : ""}
        </div>
        <div class="kort" id="dokliste"><p class="dempa">Lastar …</p></div>`;
      let liste;
      try { liste = await rpc("doc_list", { p_folder: aktivMappe }); }
      catch (e) { document.getElementById("dokliste").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      document.getElementById("dokliste").innerHTML = liste.length ? liste.map(d => `
        <div class="medlem">
          <div class="namn">📄 ${esc(d.name)}</div>
          <div class="info">${esc(storleik(d.size))} · ${esc(dato(d.created_at))}${d.uploader ? " · " + esc(d.uploader) : ""}</div>
          <div class="rad">
            <button class="liten" style="margin-top:8px" onclick="opneDok('${esc(d.path)}')">Opne</button>
            ${kanSkrive(aktivMappe) ? `<button class="fare liten" style="margin-top:8px" onclick="slettDok(${d.id})">Slett</button>` : ""}
          </div>
        </div>`).join("") : '<p class="dempa" style="margin:0">Ingen dokument i denne mappa enno.</p>';
    }

    // Lagar eit trygt filnamn til lagringa (det ekte namnet blir lagra i lista)
    function trygtNamn(n) {
      return n.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[æÆ]/g, "ae").replace(/[øØ]/g, "o").replace(/[åÅ]/g, "a")
        .replace(/[^a-zA-Z0-9._-]+/g, "-").replace(/-+/g, "-").slice(-80) || "fil";
    }

    async function lastOppDok() {
      const filer = [...document.getElementById("arkivfil").files];
      const status = document.getElementById("arkivstatus");
      if (!filer.length) { status.textContent = "Vel ei fil først."; return; }
      for (const [i, f] of filer.entries()) {
        if (f.size > 25 * 1024 * 1024) { alert(`«${f.name}» er større enn 25 MB og blir ikkje lasta opp.`); continue; }
        status.textContent = `Lastar opp ${i + 1} av ${filer.length}: ${f.name} …`;
        const sti = `${aktivMappe}/${Date.now()}-${trygtNamn(f.name)}`;
        const { error } = await db.storage.from("arkiv").upload(sti, f, { contentType: f.type || "application/octet-stream" });
        if (error) { alert(`Klarte ikkje å laste opp «${f.name}»: ${error.message}`); continue; }
        try { await rpc("doc_add", { p_folder: aktivMappe, p_path: sti, p_name: f.name, p_size: f.size, p_mime: f.type }); }
        catch (e) { await db.storage.from("arkiv").remove([sti]); alert(`Feil for «${f.name}»: ${e.message}`); }
      }
      visArkiv();
    }

    async function opneDok(sti) {
      const vindauge = window.open("", "_blank");   // opnar fane med ein gong (elles blokkerer mobilen)
      const { data, error } = await db.storage.from("arkiv").createSignedUrl(sti, 300);
      if (error) { if (vindauge) vindauge.close(); return alert("Klarte ikkje å opne: " + error.message); }
      if (vindauge) vindauge.location = data.signedUrl; else location.href = data.signedUrl;
    }

    async function slettDok(id) {
      if (!confirm("Slette dokumentet for godt?")) return;
      try {
        const sti = await rpc("doc_delete", { p_id: id });
        await db.storage.from("arkiv").remove([sti]);
      } catch (e) { alert(e.message); }
      visArkiv();
    }

    // ---------------- MC Quiz: snarvegar til quiz-sidene ----------------
    function visQuiz() {
      const knapp = (href, ikon, tittel, tekst) => `
        <a class="knapp" href="${href}" target="_blank" rel="noopener"
           style="display:block; text-align:left; margin-top:10px; background:#2a2a2a; color:#fff; border-left:4px solid var(--oransje)">
          <span style="font-size:20px">${ikon}</span> <b>${tittel}</b><br>
          <span style="font-weight:normal; font-size:14px; color:var(--dempa)">${tekst}</span></a>`;
      document.getElementById("fane").innerHTML = `
        <div class="kort">
          <h2 style="margin-top:0">MC Quiz</h2>
          <p class="dempa" style="margin-top:0">Sidene opnar i ny fane. Admin krev eiga quiz-innlogging og PIN.</p>
          ${knapp("admin.html", "🛠️", "Quiz-admin", "Deltakarar, betaling, grupper, postar, ruter og start")}
          ${knapp("skjerm.html", "📺", "Skjerm ute", "Klokke, neste gruppe ut og poengtavle")}
          ${knapp("skjerm.html?inne", "🖥️", "Skjerm inne", "Alle gruppene med starttid og status")}
          ${knapp("utskrift.html", "🖨️", "Skriv ut QR-kodar", "QR-ark til postane og målet")}
          ${knapp("quiz.html", "📝", "Påmelding", "Sida deltakarane melder seg på")}
        </div>`;
    }

    // ---------------- Kalender ----------------
    const FRAVAER = { jobb: "💼 Jobb", ferie: "🏖️ Ferie", vekk: "✈️ Bortreist" };
    let kalMnd = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
    let kalValt = null;       // ISO-dato for dagen som er vald
    let kalData = null;
    let kalSkjema = null;     // null | {type:"treff", e} | {type:"fravaer", a}

    function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
    function treffDato(e) {
      const f = datoKort(e.dato) + (e.tid ? ` kl. ${e.tid}` : "");
      return e.til_dato && e.til_dato !== e.dato ? `${f} – ${datoKort(e.til_dato)}` : f;
    }
    function erLeiarEllerEigar(e) { return meg.leader || e.created_by === meg.id; }

    async function visKalender() {
      if (!kalValt) kalValt = iso(new Date());
      // Rutenettet startar på måndag
      const forste = new Date(kalMnd);
      const start = new Date(forste); start.setDate(1 - ((forste.getDay() + 6) % 7));
      const slutt = new Date(start); slutt.setDate(start.getDate() + 41);
      const idagIso = iso(new Date());
      const omEitAar = new Date(); omEitAar.setFullYear(omEitAar.getFullYear() + 1);
      let komande;
      try {
        [kalData, komande] = await Promise.all([
          rpc("cal_range", { p_fra: iso(start), p_til: iso(slutt) }),
          rpc("cal_range", { p_fra: idagIso, p_til: iso(omEitAar) }),
        ]);
      }
      catch (e) { document.getElementById("fane").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      let celler = "";
      for (let i = 0; i < 42; i++) {
        const d = new Date(start); d.setDate(start.getDate() + i);
        const di = iso(d);
        const treff = kalData.events.filter(e => e.dato <= di && (e.til_dato || e.dato) >= di);
        const borte = kalData.absences.filter(a => a.fra <= di && a.til >= di);
        celler += `<div class="dag ${d.getMonth() !== kalMnd.getMonth() ? "annan" : ""} ${di === idagIso ? "idag" : ""} ${di === kalValt ? "vald" : ""}"
            onclick="kalValt='${di}'; kalSkjema=null; visKalender()">
          <span class="nr">${d.getDate()}</span>
          ${treff.slice(0, 2).map(e => `<span class="merke-treff">${esc(e.title)}</span>`).join("")}
          ${treff.length > 2 ? `<span class="merke-treff">+${treff.length - 2}</span>` : ""}
          ${borte.length ? `<span class="merke-borte">🚫 ${borte.length}</span>` : ""}
        </div>`;
      }
      const dagTreff = kalData.events.filter(e => e.dato <= kalValt && (e.til_dato || e.dato) >= kalValt);
      const dagBorte = kalData.absences.filter(a => a.fra <= kalValt && a.til >= kalValt);
      const valtDato = new Date(kalValt + "T12:00:00");
      document.getElementById("fane").innerHTML = `
        <div class="kort">
          <div class="mnd-topp">
            <button class="sekundar" onclick="kalMnd.setMonth(kalMnd.getMonth() - 1); kalMnd = new Date(kalMnd); kalSkjema=null; visKalender()">◀</button>
            <h2>${kalMnd.toLocaleDateString("nb-NO", { month: "long", year: "numeric" })}</h2>
            <button class="sekundar" onclick="kalMnd.setMonth(kalMnd.getMonth() + 1); kalMnd = new Date(kalMnd); kalSkjema=null; visKalender()">▶</button>
          </div>
          <div class="kal">
            ${["Må", "Ty", "On", "To", "Fr", "La", "Sø"].map(v => `<div class="vd">${v}</div>`).join("")}
            ${celler}
          </div>
          <div class="rad" style="margin-top:12px">
            <button onclick="kalSkjema={type:'treff', e:null}; visKalender()">＋ Nytt arrangement</button>
            <button class="sekundar" onclick="kalSkjema={type:'fravaer', a:null}; visKalender()">＋ Legg inn fråvær</button>
          </div>
        </div>
        ${kalSkjema ? kalSkjemaHtml() : ""}
        <div class="kort">
          <h2 style="margin-top:0">Kommande arrangement</h2>
          ${komande.events.map(e => `<div class="komande" onclick="gaaTilDag('${e.dato < idagIso ? idagIso : e.dato}')">
              <div class="kdato">${datoKort(e.dato).slice(0, 5)}<span>${e.dato.slice(0, 4)}</span></div>
              <div style="flex:1; min-width:0">
                <b>${esc(e.title)}</b>
                <div class="smaa">${e.tid ? "kl. " + esc(e.tid) : ""}${e.tid && (e.place || e.arranger) ? " · " : ""}${e.place ? "📍 " + esc(e.place) : esc(e.arranger || "")}</div>
              </div>
              <div class="smaa" style="white-space:nowrap">${e.ja.length ? "👍 " + e.ja.length : ""}</div>
            </div>`).join("") || '<p class="dempa" style="margin:0">Ingen arrangement lagt inn framover.</p>'}
        </div>
        <div class="kort" id="dagkort">
          <h2 style="margin-top:0; text-transform:capitalize">${valtDato.toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" })}</h2>
          ${dagTreff.map(treffHtml).join("") || '<p class="dempa" style="margin:0">Ingen arrangement denne dagen.</p>'}
          ${dagBorte.length ? `<p style="margin:14px 0 0"><b>Borte:</b> ${dagBorte.map(a =>
              `${esc(a.name)} <span class="dempa">(${FRAVAER[a.type]}${a.note ? " – " + esc(a.note) : ""})</span>`).join(", ")}</p>` : ""}
        </div>
        <div class="kort">
          <h2 style="margin-top:0">Mitt fråvær</h2>
          ${kalData.mine_fravaer.map(a => `<div class="medlem">
              <div class="namn">${FRAVAER[a.type]} ${datoKort(a.fra)}${a.til !== a.fra ? " – " + datoKort(a.til) : ""}</div>
              ${a.note ? `<div class="info">${esc(a.note)}</div>` : ""}
              <div class="rad">
                <button class="sekundar liten" style="margin-top:8px" onclick='kalSkjema={type:"fravaer", a:${JSON.stringify(a).replace(/'/g, "&#39;")}}; visKalender()'>Endre</button>
                <button class="fare liten" style="margin-top:8px" onclick="slettFravaer(${a.id})">Slett</button>
              </div></div>`).join("") || '<p class="dempa" style="margin:0">Du har ikkje lagt inn noko fråvær framover.</p>'}
        </div>`;
      if (kalSkjema) document.getElementById("kalskjema")?.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // Klubbar for «Kven arrangerer?» – same liste og stad som på framsida (Klubbar i nærområdet)
    const KLUBBAR = [
      ["Vikenes MC", "Vikeneset, Volda"],
      ["Aalesund Motorsykkelklubb", "Aalesund"], ["Atlantic Riders MC", "Elnesvågen"], ["BAB MC", "Heggjabygda"],
      ["Bjørkedal MC", "Bjørkedalen"], ["Eid MC", "Nordfjord"], ["Fenris MC", "Kristiansund"], ["Fumbleheads MC", "Nordhordland"],
      ["Gange Rolv HD MC", "Aalesund"], ["Hangover MC", "Skåla, Molde"], ["Headstone MC", "Aalesund"], ["HOD MC", "Ulsteinvik"],
      ["Høyangbjørn MC", "Høyanger"], ["Moonshine MC", "Romsdal"], ["Njords Men MC", "Bremanger"],
      ["Old Nicks MC", "Nordfjordeid"], ["Red Wolf MC", "Aalesund"], ["Shakin' Brains MC", "Vestnes"],
      ["Sioux MC", "Sunndalsøra"], ["Skallagrim MC", "Ørstavik"], ["Snorre MC", "Molde"], ["Speed Hogs MC", "Romsdal"],
      ["Stallar MC", "Søre-Sunnmøre"], ["Thorsmen MC", "Kristiansund"], ["Twin Riders MC", "Sykkylven"],
    ];
    function normKlubb(t) { return t.toLowerCase().replace(/\bmc\b|motorsykkelklubb|[^a-z0-9æøå]/g, ""); }
    // Vel ein klubb → stad blir fylt inn (berre om stad er tom eller fylt inn av ein tidlegare klubb)
    function klubbTilStad(tekst) {
      const n = normKlubb(tekst || "");
      const k = n && KLUBBAR.find(([namn]) => normKlubb(namn) === n);
      const stad = document.getElementById("t-stad");
      if (!k || !stad) return;
      if (!stad.value.trim() || stad.dataset.auto) { stad.value = k[1]; stad.dataset.auto = "1"; }
    }

    // Trykk på eit arrangement i lista → hopp til den dagen i kalenderen
    async function gaaTilDag(di) {
      kalValt = di; kalSkjema = null;
      const d = new Date(di + "T12:00:00");
      kalMnd = new Date(d.getFullYear(), d.getMonth(), 1);
      await visKalender();
      document.getElementById("dagkort")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function svarKnappar(e, kjelde) {
      return `<div class="jane">
        <button class="${e.mitt === true ? "vald-ja" : ""}" onclick="svarTreff(${e.id}, ${e.mitt === true ? "null" : "true"}, '${kjelde}')">👍 Ja${e.ja.length ? " (" + e.ja.length + ")" : ""}</button>
        <button class="${e.mitt === false ? "vald-nei" : ""}" onclick="svarTreff(${e.id}, ${e.mitt === false ? "null" : "false"}, '${kjelde}')">👎 Nei${e.nei.length ? " (" + e.nei.length + ")" : ""}</button>
      </div>`;
    }

    function treffHtml(e) {
      return `<div class="treff">
        <h3>${esc(e.title)}</h3>
        <div class="smaa">📅 ${treffDato(e)}${e.place ? " · 📍 " + esc(e.place) : ""}${e.arranger ? " · " + esc(e.arranger) : ""}</div>
        ${e.info ? `<p style="white-space:pre-line; margin:8px 0 0">${esc(e.info)}</p>` : ""}
        ${e.link ? `<p style="margin:6px 0 0"><a href="${esc(e.link)}" target="_blank" rel="noopener">Meir info ↗</a></p>` : ""}
        ${svarKnappar(e, "kal")}
        <p class="smaa" style="margin:8px 0 0">
          ${e.ja.length ? "👍 " + e.ja.map(esc).join(", ") : ""}${e.ja.length && e.nei.length ? "<br>" : ""}
          ${e.nei.length ? "👎 " + e.nei.map(esc).join(", ") : ""}
          ${e.borte.length ? `<br>🚫 Borte: ${e.borte.map(b => esc(b.name) + " (" + FRAVAER[b.type].split(" ")[1].toLowerCase() + ")").join(", ")}` : ""}
        </p>
        <div class="rad">
          <button class="liten" style="margin-top:8px" onclick="delTreff(${e.id})">💬 Del i chatten</button>
          ${erLeiarEllerEigar(e) ? `<button class="sekundar liten" style="margin-top:8px" onclick="redigerTreff(${e.id})">Endre</button>
            <button class="fare liten" style="margin-top:8px" onclick="slettTreff(${e.id})">Slett</button>` : ""}
        </div>
        <div class="smaa" style="margin-top:6px; font-size:12px">Lagt inn av ${esc(e.created_name || "–")}</div>
      </div>`;
    }

    function kalSkjemaHtml() {
      if (kalSkjema.type === "treff") {
        const e = kalSkjema.e || {};
        return `<div class="kort" id="kalskjema">
          <h2 style="margin-top:0">${e.id ? "Endre arrangement" : "Nytt arrangement"}</h2>
          <label for="t-tittel">Kva er det?</label>
          <input id="t-tittel" maxlength="120" placeholder="t.d. Sommartreff hos Eid MC" value="${esc(e.title || "")}">
          <div class="rad" style="align-items:flex-start">
            <div style="flex:1; min-width:140px"><label for="t-dato">Dato</label>${datoFelt("t-dato", e.dato || kalValt, true)}</div>
            <div style="flex:1; min-width:150px"><label for="t-time">Klokka (valfritt)</label>
              <div class="rad" style="flex-wrap:nowrap; gap:4px">
                <select id="t-time" style="margin-top:6px">${tidVal(24, 1, e.tid ? e.tid.slice(0, 2) : "")}</select>
                <b style="margin-top:6px">:</b>
                <select id="t-min" style="margin-top:6px">${tidVal(60, 5, e.tid ? e.tid.slice(3, 5) : "")}</select>
              </div></div>
          </div>
          <label for="t-til">Siste dag (om det varer fleire dagar)</label>
          ${datoFelt("t-til", e.til_dato || "", true)}
          <label for="t-arr">Kven arrangerer?</label>
          <input id="t-arr" maxlength="80" list="kal-klubbar" placeholder="Vel klubb eller skriv namnet" value="${esc(e.arranger || "")}"
            oninput="klubbTilStad(this.value)" onchange="klubbTilStad(this.value)">
          <datalist id="kal-klubbar">${KLUBBAR.map(([n]) => `<option value="${esc(n)}"></option>`).join("")}</datalist>
          <label for="t-stad">Stad (valfritt)</label>
          <input id="t-stad" maxlength="120" value="${esc(e.place || "")}" oninput="this.dataset.auto = ''">
          <label for="t-lenkje">Lenkje (valfritt, https://…)</label>
          <input id="t-lenkje" placeholder="https://www.facebook.com/events/…" value="${esc(e.link || "")}">
          <label for="t-info">Meir info (valfritt)</label>
          <textarea id="t-info" rows="3" maxlength="2000">${esc(e.info || "")}</textarea>
          <div class="rad" style="margin-top:12px">
            <button onclick="lagreTreff(${e.id || "null"})">💾 Lagre</button>
            <button class="sekundar" onclick="kalSkjema=null; visKalender()">Avbryt</button>
          </div>
          <p id="k-melding" class="feil" style="margin-bottom:0"></p>
        </div>`;
      }
      const a = kalSkjema.a || {};
      return `<div class="kort" id="kalskjema">
        <h2 style="margin-top:0">${a.id ? "Endre fråvær" : "Legg inn fråvær"}</h2>
        <div class="jane">
          ${Object.entries(FRAVAER).map(([k, n]) => `<label style="flex:1; margin:0; background:#333; border-radius:8px; padding:10px; text-align:center; cursor:pointer">
            <input type="radio" name="f-type" value="${k}" ${(a.type || "jobb") === k ? "checked" : ""}> ${n}</label>`).join("")}
        </div>
        <div class="rad" style="align-items:flex-start">
          <div style="flex:1; min-width:140px"><label for="f-fra">Frå</label>${datoFelt("f-fra", a.fra || kalValt, true)}</div>
          <div style="flex:1; min-width:140px"><label for="f-til">Til og med</label>${datoFelt("f-til", a.til || kalValt, true)}</div>
        </div>
        <label for="f-note">Merknad (valfritt)</label>
        <input id="f-note" maxlength="200" placeholder="t.d. nattskift" value="${esc(a.note || "")}">
        <div class="rad" style="margin-top:12px">
          <button onclick="lagreFravaer(${a.id || "null"})">💾 Lagre</button>
          <button class="sekundar" onclick="kalSkjema=null; visKalender()">Avbryt</button>
        </div>
        <p id="k-melding" class="feil" style="margin-bottom:0"></p>
      </div>`;
    }

    // 24-timars klokke med eigne nedtrekkslister (nettlesaren kan elles vise AM/PM)
    function tidVal(maks, steg, valt) {
      let s = maks === 24 ? `<option value="">--</option>` : "";
      for (let i = 0; i < maks; i += steg) {
        const v = String(i).padStart(2, "0");
        s += `<option ${v === valt ? "selected" : ""}>${v}</option>`;
      }
      return s;
    }

    const kalFeil = { bad_title: "Skriv kva arrangementet heiter (2–120 teikn).", bad_dates: "Sjekk datoane.", bad_link: "Lenkja må starte med https://",
      too_long: "Fråvær kan vere maks eitt år om gongen.", not_allowed: "Berre den som la inn arrangementet, eller President/Vice President, kan endre det." };

    async function lagreTreff(id) {
      const v = k => document.getElementById(k).value;
      try {
        const tid = v("t-time") ? `${v("t-time")}:${v("t-min")}` : null;
        const dato = lesDato("t-dato"), til = lesDato("t-til");
        if (!dato || til === null) throw new Error("bad_dates");
        await rpc("event_save", { p_id: id, p_title: v("t-tittel"), p_dato: dato, p_tid: tid,
          p_til_dato: til || null, p_place: v("t-stad"), p_link: v("t-lenkje"), p_info: v("t-info"), p_arranger: v("t-arr") });
      } catch (e) { document.getElementById("k-melding").textContent = kalFeil[e.message] || e.message; return; }
      kalValt = lesDato("t-dato"); const d = new Date(kalValt + "T12:00:00"); kalMnd = new Date(d.getFullYear(), d.getMonth(), 1);
      kalSkjema = null; visKalender();
    }

    async function lagreFravaer(id) {
      const v = k => document.getElementById(k).value;
      const type = document.querySelector('input[name="f-type"]:checked')?.value;
      try {
        const fra = lesDato("f-fra"), til = lesDato("f-til");
        if (!fra || !til) throw new Error("bad_dates");
        await rpc("absence_save", { p_id: id, p_fra: fra, p_til: til, p_type: type, p_note: v("f-note") });
      }
      catch (e) { document.getElementById("k-melding").textContent = kalFeil[e.message] || e.message; return; }
      kalSkjema = null; visKalender();
    }

    function redigerTreff(id) { kalSkjema = { type: "treff", e: kalData.events.find(e => e.id === id) }; visKalender(); }

    async function slettTreff(id) {
      if (!confirm("Slette arrangementet? Svara blir òg sletta.")) return;
      try { await rpc("event_delete", { p_id: id }); } catch (e) { alert(kalFeil[e.message] || e.message); }
      visKalender();
    }

    async function slettFravaer(id) {
      if (!confirm("Slette fråværet?")) return;
      try { await rpc("absence_delete", { p_id: id }); } catch (e) { alert(e.message); }
      visKalender();
    }

    async function svarTreff(id, svar, kjelde) {
      let e;
      try { e = await rpc("event_answer", { p_id: id, p_svar: svar }); } catch (err) { return alert(err.message); }
      if (kjelde === "kal") return visKalender();
      // I chatten: oppdater alle treffkort for dette treffet
      document.querySelectorAll(`.treffkort[data-treff="${id}"]`).forEach(k => k.outerHTML = treffkortHtml(e));
    }

    async function delTreff(id) {
      if (!confirm("Dele arrangementet i chatten? Alle får varsel og kan svare Ja eller Nei.")) return;
      try {
        const mid = await rpc("event_share", { p_id: id });
        db.functions.invoke("chat-push", { body: { action: "send", message_id: mid } }).catch(() => {});
      } catch (e) { return alert(e.message); }
      visFane("chat");
    }

    function treffkortHtml(e) {
      return `<div class="treffkort" data-treff="${e.id}">
        <b>${esc(e.title)}</b><br><span class="dempa">${treffDato(e)}${e.place ? " · " + esc(e.place) : ""}</span>
        ${svarKnappar(e, "chat")}
      </div>`;
    }

    // ---------------- Regnskap (President og Treasurer) ----------------
    let regnAr = new Date().getFullYear();
    let regnData = null;
    let regnRediger = null;   // posten som blir endra, eller null
    // Klubben har berre éin bankkonto (ingen kontantar lenger)
    const KONTO = { bank: "Bank" };

    function kr(n) {
      return Number(n).toLocaleString("nb-NO", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " kr";
    }
    function idag() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
    // Norsk datoformat: DD/MM-ÅÅÅÅ
    function datoKort(iso) { if (!iso) return ""; const [y, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}-${y}`; }

    // Datofelt som alltid viser DD/MM-ÅÅÅÅ (nettlesaren sitt eige datofelt følgjer språket på mobilen)
    // medKalender: 📅-knapp ved sida som opnar mobilen sin eigen kalender – trykk på dato i staden for å skrive
    function datoFelt(id, iso, medKalender) {
      const felt = `<input id="${id}" class="datofelt" inputmode="numeric" maxlength="10" placeholder="DD/MM-ÅÅÅÅ"
        value="${iso ? datoKort(iso) : ""}" oninput="formaterDato(this)"${medKalender ? ' style="flex:1; margin:0"' : ""}>`;
      if (!medKalender) return felt;
      return `<div class="datorad">${felt}
        <label class="kalknapp" title="Vel dato i kalender">📅
          <input type="date" tabindex="-1" aria-label="Vel dato"
            onfocus="this.value = lesDato('${id}') || ''"
            onclick="this.value = lesDato('${id}') || ''; try { this.showPicker(); } catch (e) {}"
            onchange="if (this.value) document.getElementById('${id}').value = datoKort(this.value)">
        </label></div>`;
    }
    function formaterDato(el) {
      const s = el.value.replace(/\D/g, "").slice(0, 8);
      el.value = s.length > 4 ? `${s.slice(0, 2)}/${s.slice(2, 4)}-${s.slice(4)}` : s.length > 2 ? `${s.slice(0, 2)}/${s.slice(2)}` : s;
    }
    // Les datofeltet → ÅÅÅÅ-MM-DD, "" om tomt, null om ugyldig
    function lesDato(id) {
      const v = document.getElementById(id).value.trim();
      if (!v) return "";
      const m = v.match(/^(\d{1,2})\D(\d{1,2})\D(\d{4})$/);
      if (!m) return null;
      const d = new Date(+m[3], +m[2] - 1, +m[1]);
      if (d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1]) return null;
      return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    }

    async function visRegnskap() {
      try { regnData = await rpc("ledger_year", { p_year: regnAr }); }
      catch (e) { document.getElementById("fane").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      const r = regnData, p = regnRediger;
      const saldo = k => {
        const s = r.kontoar[k];
        return `<div class="saldo"><h3>${KONTO[k]}</h3>
          <div class="linje"><span>Inngåande 1.1.</span><span>${kr(s.inn_saldo)}</span></div>
          <div class="linje"><span>Inn ${r.year}</span><span style="color:var(--gronn)">${kr(s.inn)}</span></div>
          <div class="linje"><span>Ut ${r.year}</span><span style="color:var(--raud)">${kr(s.ut)}</span></div>
          <div class="linje sum"><span>Saldo 31.12.</span><span>${kr(s.ut_saldo)}</span></div></div>`;
      };
      document.getElementById("fane").innerHTML = `
        <div class="kort">
          <div class="rad" style="justify-content:space-between">
            <select style="width:auto; margin:0" onchange="regnAr = +this.value; regnRediger = null; visRegnskap()">
              ${r.years.map(y => `<option ${y === r.year ? "selected" : ""}>${y}</option>`).join("")}
            </select>
            ${r.full ? `<div class="rad">
              <button class="sekundar liten" onclick="lastNedRegnskap()">📥 Excel (CSV)</button>
              <button class="sekundar liten" onclick="skrivUtRegnskap()">🖨️ Skriv ut</button>
            </div>` : ""}
          </div>
          <div style="margin-top:12px">${saldo("bank")}</div>
        </div>

        ${r.full ? `<div class="kort" id="regnskjema">
          <h2 style="margin-top:0">${p ? "Endre post" : "Ny post"}</h2>
          <div class="innut">
            <label><input type="radio" name="r-type" value="inn" ${p && p.belop > 0 ? "checked" : ""}><span>➕ Inn</span></label>
            <label><input type="radio" name="r-type" value="ut" ${!p || p.belop < 0 ? "checked" : ""}><span>➖ Ut</span></label>
          </div>
          <label for="r-belop">Beløp (kr)</label>
          <input id="r-belop" inputmode="decimal" placeholder="t.d. 249,90" value="${p ? String(Math.abs(p.belop)).replace(".", ",") : ""}">
          <label for="r-tekst">Kva gjeld det?</label>
          <input id="r-tekst" maxlength="200" placeholder="t.d. Kaffi og vaflar, Rema 1000" value="${esc(p ? p.tekst : "")}">
          <label for="r-dato">Dato</label>
          ${datoFelt("r-dato", p ? p.dato : idag(), true)}
          <label for="r-kvittering">Kvittering (bilete eller PDF)${p && p.kvittering_path ? " – har alt ei, vel ny for å byte" : ""}</label>
          <input id="r-kvittering" type="file" accept="image/*,application/pdf" style="background:#222; color:#fff">
          <div class="rad" style="margin-top:12px">
            <button onclick="lagrePost()">💾 Lagre</button>
            ${p ? `<button class="sekundar" onclick="regnRediger = null; visRegnskap()">Avbryt</button>` : ""}
          </div>
          <p id="r-melding" class="feil" style="margin-bottom:0"></p>
        </div>

        <div class="kort">
          <h2 style="margin-top:0">Postar ${r.year} (${r.postar.length})</h2>
          ${r.postar.map(x => `
            <div class="post">
              <div class="tekst">${esc(x.tekst)}</div>
              <div class="belop ${x.belop > 0 ? "inn" : "ut"}">${x.belop > 0 ? "+" : "−"} ${kr(Math.abs(x.belop))}</div>
              <div class="meta">${datoKort(x.dato)}${x.created_name ? " · " + esc(x.created_name) : ""}</div>
              <div class="meta" style="text-align:right">${x.kvittering_path ? "📎 kvittering" : "⚠️ manglar kvittering"}</div>
              <div class="rad" style="grid-column: 1 / -1">
                ${x.kvittering_path ? `<button class="liten" onclick="opneDok('${esc(x.kvittering_path)}')">Sjå kvittering</button>` : ""}
                <button class="sekundar liten" onclick="redigerPost(${x.id})">Endre</button>
                <button class="fare liten" onclick="slettPost(${x.id})">Slett</button>
              </div>
            </div>`).join("") || '<p class="dempa" style="margin:0">Ingen postar i år enno.</p>'}
        </div>` : ""}`;
    }

    function redigerPost(id) {
      regnRediger = regnData.postar.find(x => x.id === id) || null;
      visRegnskap().then(() => document.getElementById("regnskjema").scrollIntoView({ behavior: "smooth" }));
    }

    // Gjer store mobilbilete mindre (maks 1800 px) så lagringsplassen held lenge
    async function krympBilete(fil) {
      if (!fil.type.startsWith("image/") || fil.size < 1.2 * 1024 * 1024) return fil;
      try {
        const bmp = await createImageBitmap(fil);
        const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
        const c = document.createElement("canvas");
        c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
        c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
        const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
        return blob ? new File([blob], fil.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" }) : fil;
      } catch (e) { return fil; }
    }

    async function lagrePost() {
      const feil = t => { document.getElementById("r-melding").textContent = t; };
      const type = document.querySelector('input[name="r-type"]:checked')?.value;
      const belop = parseFloat(document.getElementById("r-belop").value.replace(/\s/g, "").replace(",", "."));
      const tekst = document.getElementById("r-tekst").value.trim();
      const dato = lesDato("r-dato");
      const konto = "bank";
      let fil = document.getElementById("r-kvittering").files[0];
      if (!type) return feil("Vel Inn eller Ut.");
      if (!(belop > 0)) return feil("Skriv eit beløp større enn 0.");
      if (tekst.length < 2) return feil("Skriv kva posten gjeld.");
      if (!dato) return feil("Vel dato.");
      feil("Lagrar …");
      let sti = null, namn = null;
      if (fil) {
        fil = await krympBilete(fil);
        if (fil.size > 25 * 1024 * 1024) return feil("Kvitteringa er større enn 25 MB.");
        sti = `regnskap/kvitteringar/${Date.now()}-${trygtNamn(fil.name)}`;
        namn = fil.name;
        const { error } = await db.storage.from("arkiv").upload(sti, fil, { contentType: fil.type || "application/octet-stream" });
        if (error) return feil("Klarte ikkje å laste opp kvitteringa: " + error.message);
      }
      const gammal = regnRediger && sti ? regnRediger.kvittering_path : null;
      try {
        await rpc("ledger_save", { p_id: regnRediger ? regnRediger.id : null, p_dato: dato, p_konto: konto, p_tekst: tekst,
          p_belop: type === "ut" ? -belop : belop, p_kvittering_path: sti, p_kvittering_namn: namn });
      } catch (e) {
        if (sti) await db.storage.from("arkiv").remove([sti]);
        return feil({ bad_amount: "Ugyldig beløp.", bad_text: "Teksten må vere 2–200 teikn.", not_allowed: "Berre President og Treasurer kan føre regnskap." }[e.message] || e.message);
      }
      if (gammal) await db.storage.from("arkiv").remove([gammal]);
      regnAr = +dato.slice(0, 4);
      regnRediger = null;
      visRegnskap();
    }

    async function slettPost(id) {
      const x = regnData.postar.find(p => p.id === id);
      if (!confirm(`Slette «${x ? x.tekst : "posten"}» for godt? Kvitteringa blir òg sletta.`)) return;
      try {
        const sti = await rpc("ledger_delete", { p_id: id });
        if (sti) await db.storage.from("arkiv").remove([sti]);
      } catch (e) { alert(e.message); }
      visRegnskap();
    }

    function lastNedRegnskap() {
      const r = regnData;
      const csvFelt = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const tal = n => Number(n).toFixed(2).replace(".", ",");
      const linjer = [["Dato", "Tekst", "Inn", "Ut", "Kvittering", "Ført av"].map(csvFelt).join(";")];
      for (const x of [...r.postar].reverse()) {
        linjer.push([datoKort(x.dato), x.tekst, x.belop > 0 ? tal(x.belop) : "", x.belop < 0 ? tal(-x.belop) : "",
                     x.kvittering_namn || (x.kvittering_path ? "ja" : "MANGLAR"), x.created_name || ""].map(csvFelt).join(";"));
      }
      linjer.push("");
      for (const k of ["bank"]) {
        const s = r.kontoar[k];
        linjer.push([`${KONTO[k]}: inngåande ${tal(s.inn_saldo)}`, `inn ${tal(s.inn)}`, `ut ${tal(-s.ut)}`, `saldo 31.12. ${tal(s.ut_saldo)}`].map(csvFelt).join(";"));
      }
      const blob = new Blob(["﻿" + linjer.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `regnskap-vikenes-mc-${r.year}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
    }

    function skrivUtRegnskap() {
      const r = regnData;
      const rader = [...r.postar].reverse().map(x => `<tr><td>${datoKort(x.dato)}</td><td>${esc(x.tekst)}</td>
        <td class="t">${x.belop > 0 ? kr(x.belop) : ""}</td><td class="t">${x.belop < 0 ? kr(-x.belop) : ""}</td>
        <td>${x.kvittering_path ? "✔" : "MANGLAR"}</td></tr>`).join("");
      const saldo = ["bank"].map(k => { const s = r.kontoar[k];
        return `<tr><td>${KONTO[k]}</td><td class="t">${kr(s.inn_saldo)}</td><td class="t">${kr(s.inn)}</td><td class="t">${kr(-s.ut)}</td><td class="t"><b>${kr(s.ut_saldo)}</b></td></tr>`; }).join("");
      const w = window.open("", "_blank");
      if (!w) return alert("Nettlesaren stoppa utskriftsvindauget. Tillat sprettoppvindauge og prøv igjen.");
      w.document.write(`<!DOCTYPE html><html lang="no"><head><meta charset="utf-8"><title>Regnskap Vikenes MC ${r.year}</title>
        <style>body{font-family:Arial,sans-serif;margin:24px;color:#000} h1{margin:0 0 4px} table{border-collapse:collapse;width:100%;margin:12px 0 24px;font-size:13px}
        th,td{border:1px solid #999;padding:5px 7px;text-align:left} th{background:#eee} .t{text-align:right;white-space:nowrap}</style></head><body>
        <h1>Regnskap – Vikenes MC</h1><div>År ${r.year} · utskrive ${datoKort(idag())}</div>
        <h2>Saldo</h2><table><tr><th>Konto</th><th>Inngåande 1.1.</th><th>Inn</th><th>Ut</th><th>Saldo 31.12.</th></tr>${saldo}</table>
        <h2>Postar</h2><table><tr><th>Dato</th><th>Tekst</th><th>Inn</th><th>Ut</th><th>Kvittering</th></tr>${rader}</table>
        <script>window.onload=()=>window.print()<\/script></body></html>`);
      w.document.close();
    }

    // ---------------- Gjestebok (President, Vice President, Secretary) ----------------
    async function oppdaterGjestetal() {
      try {
        const n = await rpc("guestbook_pending_count");
        const el = document.getElementById("g-tal");
        if (el) el.textContent = n ? ` (${n})` : "";
      } catch (e) { /* ikkje kritisk */ }
    }

    async function visGjestebok() {
      let liste, ukjende = [];
      try { [liste, ukjende] = await Promise.all([rpc("guestbook_all"), rpc("unknown_clubs")]); }
      catch (e) { document.getElementById("fane").innerHTML = `<p class="feil">${esc(e.message)}</p>`; return; }
      const ventar = liste.filter(h => h.status === "pending");
      const godkjende = liste.filter(h => h.status === "approved");
      const kort = h => `
        <div class="medlem">
          <div class="namn">${esc(h.name)}${h.club_name ? ` <span style="color:var(--oransje); font-weight:normal">· ${esc(h.club_name)}</span>` : ""}
            <span class="dempa" style="font-weight:normal; font-size:14px">${esc(dato(h.created_at))}</span></div>
          <div style="white-space:pre-line; margin-top:4px">${esc(h.message)}</div>
          <div class="rad">
            ${h.status === "pending" ? `<button onclick="godkjennHelsing(${h.id})">Godkjenn</button>` : ""}
            <button class="${h.status === "pending" ? "sekundar" : "fare"}" onclick="slettHelsing(${h.id})">Slett</button>
          </div>
        </div>`;
      document.getElementById("fane").innerHTML = `
        ${ukjende.length ? `<div class="kort" style="border-top-color:var(--gul)">
          <h2 style="margin-top:0">Nye klubbar som har sjekka inn (${ukjende.length})</h2>
          <p class="dempa" style="margin-top:0">Desse er ikkje under «Klubbar i nærområdet» enno. Send namn, stad og logo
            til den som held nettsida, og trykk «Ordna» når klubben er lagd til.</p>
          ${ukjende.map(k => `<div class="medlem">
              <div class="namn">${esc(k.club_name)}</div>
              <div class="info">${k.count} innsjekk · sist ${esc(dato(k.last))}</div>
              <div class="rad"><button class="sekundar" data-klubb="${esc(k.club_name)}" onclick="ukjendOrdna(this.dataset.klubb)">Ordna</button></div>
            </div>`).join("")}
        </div>` : ""}
        <div class="kort" style="border-top-color:var(--gul)">
          <h2 style="margin-top:0">Ventar på godkjenning (${ventar.length})</h2>
          ${ventar.map(kort).join("") || '<p class="dempa">Ingen nye helsingar.</p>'}
        </div>
        <div class="kort">
          <h2 style="margin-top:0">Synlege på framsida (${godkjende.length})</h2>
          ${godkjende.map(kort).join("") || '<p class="dempa">Ingen enno.</p>'}
        </div>`;
      oppdaterGjestetal();
    }

    async function ukjendOrdna(namn) {
      if (!confirm(`Merke «${namn}» som ordna?`)) return;
      try { await rpc("unknown_club_handled", { p_club_name: namn }); } catch (e) { alert(e.message); }
      visGjestebok();
    }

    async function godkjennHelsing(id) {
      try { await rpc("guestbook_approve", { p_id: id }); } catch (e) { alert(e.message); }
      visGjestebok();
    }

    async function slettHelsing(id) {
      if (!confirm("Slette helsinga for godt?")) return;
      try { await rpc("guestbook_delete", { p_id: id }); } catch (e) { alert(e.message); }
      visGjestebok();
    }

    start();
  </script>
</body>
</html>
