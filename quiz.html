<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Quiz - Vikenes MC</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap">
  <link rel="stylesheet" href="stil.css">
</head>
<body>
  <div class="wrap">
    <p><a href="index.html">← Tilbake til Vikenes MC</a></p>
    <div class="stripe"><img class="vinge" src="vinge-logo.png" alt="Vikenes MC"></div>
    <h1>MC Quiz – påmelding</h1>

    <div class="kort" id="skjema">
      <label for="name">Namn</label>
      <input id="name" type="text" autocomplete="name" placeholder="Skriv namnet ditt">

      <label for="phone">Telefonnummer</label>
      <input id="phone" type="tel" autocomplete="tel" placeholder="Telefonnummer">

      <button class="stor" id="meldPaa" onclick="registrer()">Meld meg på</button>
      <p id="melding" class="feil"></p>
    </div>

    <div class="kort" id="takk" style="display:none">
      <p class="stor-tekst ok">Du er påmeld! ✓</p>
      <p>Betal kontant hos arrangøren. Når alle er påmelde, blir de fordelte i grupper.</p>
      <p class="dempa">Du treng ikkje gjere noko meir på mobilen. Leiaren i gruppa di blir vald ved start.</p>
      <button class="sekundar" onclick="nyPaamelding()">Meld på ein til</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="felles.js"></script>
  <script>
    async function registrer() {
      const namn = document.getElementById("name").value.trim();
      const tlf = document.getElementById("phone").value.trim();
      const melding = document.getElementById("melding");
      melding.textContent = "";

      if (namn.length < 2 || tlf.replace(/\D/g, "").length < 8) {
        melding.textContent = "Fyll inn namn og telefonnummer (minst 8 siffer).";
        return;
      }

      const knapp = document.getElementById("meldPaa");
      knapp.disabled = true;
      try {
        await rpc("register_participant", { p_name: namn, p_phone: tlf });
        document.getElementById("skjema").style.display = "none";
        document.getElementById("takk").style.display = "block";
      } catch (e) {
        melding.textContent = "Noko gjekk gale. Prøv igjen, eller meld deg på hos arrangøren.";
        console.error(e);
      } finally {
        knapp.disabled = false;
      }
    }

    function nyPaamelding() {
      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("takk").style.display = "none";
      document.getElementById("skjema").style.display = "block";
    }
  </script>
</body>
</html>
