<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Quiz - Vikenes MC</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .quiz-wrap {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #1b1b1b;
      padding: 30px;
      border-radius: 10px;
      margin-top: 30px;
    }

    .start-button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: 0;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    a {
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="quiz-wrap">
    <p><a href="index.html">← Tilbake til Vikenes MC</a></p>

    <h1>MC Quiz</h1>

    <div class="card">
      <h2>Velkommen</h2>
      <p>
        Her startar Vikenes MC sin MC Quiz.
      </p>

  <button class="start-button" onclick="showRegistration()">
  Start quiz
</button>

<div id="registration" style="display:none; margin-top:25px;">
  <h2>Registrering</h2>

  <label for="name">Namn</label>
  <input
    id="name"
    type="text"
    placeholder="Skriv namnet ditt"
    style="width:100%; padding:14px; margin:8px 0 18px; box-sizing:border-box;"
  >

  <label for="phone">Telefonnummer</label>
  <input
    id="phone"
    type="tel"
    placeholder="Telefonnummer"
    style="width:100%; padding:14px; margin:8px 0 18px; box-sizing:border-box;"
  >

  <button class="start-button" onclick="registerParticipant()">
  Registrer
</button>
</div>

<script>
  function showRegistration() {
    document.getElementById("registration").style.display = "block";
  }
  async function registerParticipant() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();

  if (!name || !phone) {
    alert("Fyll inn namn og telefonnummer.");
    return;
  }

  const response = await fetch(
    "https://yrozxcxjqxfwbbdwlwwi.supabase.co/rest/v1/participants",
    {
      method: "POST",
      headers: {
        "apikey": "sb_publishable_eb4NTorneozNeCZU7GnGFQ_ybS53nn5",
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        name: name,
        phone: phone,
        event_id: 1,
        paid: false
      })
    }
  );

  if (response.ok) {
    alert("Registreringa er lagra!");
  } else {
    const errorText = await response.text();
    alert("Noko gjekk gale: " + errorText);
  }
}
</script>
    </div>
  </div>

</body>
</html>
