<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Quiz Admin</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .wrap {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .participant {
      background: #1b1b1b;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .participant strong {
      font-size: 18px;
    }

    .status {
      margin-top: 8px;
      color: #bbb;
    }

    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .paid {
      color: #7CFC90;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <h1>MC Quiz Admin</h1>
    <p>Registrerte deltakarar</p>

    <div id="participants">
      Lastar deltakarar...
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yrozxcxjqxfwbbdwlwwi.supabase.co";
    const SUPABASE_KEY = "sb_publishable_eb4NTorneozNeCZU7GnGFQ_ybS53nn5";

    async function loadParticipants() {
      const response = await fetch(
        SUPABASE_URL + "/rest/v1/participants?select=id,name,phone,paid&event_id=eq.1&order=id.asc",
        {
          headers: {
            "apikey": SUPABASE_KEY
          }
        }
      );

      if (!response.ok) {
        document.getElementById("participants").innerHTML =
          "Klarte ikkje å hente deltakarane.";
        return;
      }

      const participants = await response.json();

      document.getElementById("participants").innerHTML =
        participants.map(p => `
          <div class="participant">
            <strong>${p.name}</strong><br>
            ${p.phone}

            <div class="status">
              ${p.paid
                ? '<span class="paid">Betaling registrert ✓</span>'
                : 'Ikkje registrert som betalt'}
            </div>

            ${!p.paid
              ? `<button onclick="markPaid(${p.id})">Merk som betalt</button>`
              : ''}
          </div>
        `).join("");
    }

async function markPaid(id) {
  const response = await fetch(
    SUPABASE_URL + "/rest/v1/participants?id=eq." + id,
    {
      method: "PATCH",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        paid: true
      })
    }
  );

  if (response.ok) {
    loadParticipants();
  } else {
    alert("Klarte ikkje å registrere betaling.");
  }
}

    loadParticipants();
  </script>

</body>
</html>
